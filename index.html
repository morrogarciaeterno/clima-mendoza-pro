<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Radar Meteorológico</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
}

#map{
    height:100vh;
    width:100%;
}

.panel{
    position:absolute;
    z-index:9999;
    top:10px;
    left:10px;
    background:rgba(17,24,39,.95);
    padding:10px;
    border-radius:10px;
    border:1px solid #374151;
}

button{
    margin:3px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="panel">

<button onclick="mostrarBase()">🌍 Base</button>

<button onclick="irArgentina()">🇦🇷 Argentina</button>

<button onclick="irGPS()">📍 GPS</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// CREAR MAPA

const mapa = L.map('map').setView(
    [-38.4161,-63.6167],
    5
);

// CAPA BASE

const capaBase = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
);

capaBase.addTo(mapa);

// FUNCIONES

function mostrarBase(){

    mapa.eachLayer(function(layer){

        if(layer !== capaBase){
            mapa.removeLayer(layer);
        }

    });

}

function irArgentina(){

    mapa.setView(
        [-38.4161,-63.6167],
        5
    );

}
