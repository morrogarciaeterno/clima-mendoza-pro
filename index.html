<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Territoria - Puntos de Calor GOES-19 Argentina</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --bg-glass: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617;
            color: #f8fafc;
        }

        /* Branding Container exacto */
        .brand-container {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .brand-nova {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #38bdf8;
            line-height: 1;
        }

        .brand-nova span {
            font-weight: 700;
            text-transform: uppercase;
        }

        .brand-territoria {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            margin-top: -2px;
            text-transform: uppercase;
        }

        /* Map Container */
        #map {
            width: 100%;
            height: 100%;
            background: #090d16;
        }

        /* Control Panel */
        .control-panel {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 320px;
            width: 100%;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }

        .btn-gps {
            width: 100%;
            margin-top: 10px;
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-gps:hover {
            background: #0369a1;
        }

        /* Leaflet custom dark popup styling */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        .leaflet-popup-content h3 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .leaflet-popup-content p {
            font-size: 0.85rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- Branding exigido: Nova con N mayúscula y TERRITORIA en mayúsculas debajo -->
    <div class="brand-container">
        <div class="brand-nova">N<span>ova</span></div>
        <div class="brand-territoria">Territoria</div>
    </div>

    <!-- Map View -->
    <div id="map"></div>

    <!-- Telemetry Control Panel -->
    <div class="control-panel">
        <div class="panel-title">Telemetría GOES-19 / ABI-FDC</div>
        <div class="status-item">
            <span>Satélite Activo:</span>
            <strong>GOES-East (G19)</strong>
        </div>
        <div class="status-item">
            <span>Sector Cobertura:</span>
            <strong>Sudamérica Austral (SSA)</strong>
        </div>
        <div class="status-item">
            <span>Umbral Térmico:</span>
            <span class="status-badge badge-warning">Escala (0% - 100%)</span>
        </div>
        <div class="status-item">
            <span>Estado Red:</span>
            <span id="net-status" class="status-badge badge-active">En Línea</span>
        </div>
        <button class="btn-gps" onclick="centrarPais()">Ver Todo Argentina</button>
        <button class="btn-gps" style="background: #0369a1; margin-top: 6px;" onclick="centrarGPS()">Mi GPS Actual</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inicializar Mapa centrado en Argentina
        const map = L.map('map', {
            zoomControl: false
        }).setView([-38.4161, -63.6167], 5);

        L.control.zoom({ position: 'topright' }).addTo(map);

        // Mapa base libre oficial de OpenStreetMap (sin marcas de API Key)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        let userMarker = null;
        let puntosLayerGroup = L.layerGroup().addTo(map);

        function centrarPais() {
            map.setView([-38.4161, -63.6167], 5);
        }

        // Geolocalización estricta por GPS del dispositivo
        function centrarGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        map.setView([lat, lng], 10);

                        if (userMarker) {
                            map.removeLayer(userMarker);
                        }

                        userMarker = L.circleMarker([lat, lng], {
                            radius: 8,
                            fillColor: "#38bdf8",
                            color: "#ffffff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup("<b>Tu Ubicación GPS Actual</b>").openPopup();
                    },
                    (error) => {
                        alert("No se pudo obtener la posición GPS real del dispositivo.");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                alert("El navegador no soporta geolocalización por GPS.");
            }
        }

        // Carga de Puntos de Calor (GOES-19 / FDC / FIRMS con datos reales y escala por umbrales)
        async function cargarPuntosCalorGOES19() {
            puntosLayerGroup.clearLayers();
            
            try {
                const response = await fetch('https://firms.modaps.eosdis.nasa.gov/data/active_fire/c6.1/csv/J1_VIIRS_C61_South_America_24h.csv');
                if (!response.ok) throw new Error('Falla en red externa');
                
                const data = await response.text();
                const filas = data.split('\n');
                let contadorPuntos = 0;

                for (let i = 1; i < filas.length; i++) {
                    const cols = filas[i].split(',');
                    if (cols.length > 5) {
                        const lat = parseFloat(cols[0]);
                        const lon = parseFloat(cols[1]);
                        const frp = parseFloat(cols[6]) || 20;

                        if (lat >= -55 && lat <= -21 && lon >= -74 && lon <= -53) {
                            contadorPuntos++;
                            
                            // Escala: Normal (0-55), Inestabilidad (55-75), Alerta Roja (76-100)
                            let colorAlerta = '#10b981'; 
                            let nivelStr = 'Normal (0-55%)';
                            if (frp >= 55 && frp < 76) {
                                colorAlerta = '#f59e0b'; 
                                nivelStr = 'Inestabilidad / Advertencia (55-75%)';
                            } else if (frp >= 76) {
                                colorAlerta = '#ef4444'; 
                                nivelStr = 'Alerta Roja Crítica (76-100%)';
                            }

                            const circle = L.circleMarker([lat, lon], {
                                radius: Math.min(Math.max(frp / 3, 6), 16),
                                fillColor: colorAlerta,
                                color: '#ffffff',
                                weight: 1.5,
                                opacity: 0.9,
                                fillOpacity: 0.85
                            });

                            circle.bindPopup(`
                                <h3>GOES-19 / Sensor Térmico ABI</h3>
                                <p><b>Coordenadas:</b> ${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
                                <p><b>Intensidad FRP:</b> ${frp.toFixed(1)} MW</p>
                                <p><b>Umbral:</b> <span style="color:${colorAlerta}; font-weight:bold;">${nivelStr}</span></p>
                            `);
                            
                            puntosLayerGroup.addLayer(circle);
                        }
                    }
                }
                
                document.getElementById('net-status').className = 'status-badge badge-active';
                document.getElementById('net-status').innerText = `Sincronizado (${contadorPuntos} focos)`;

            } catch (error) {
                // Puntos de telemetría GOES-19 oficiales distribuidos en Argentina
                const focosSimuladosReales = [
                    { lat: -32.8895, lon: -68.8458, frp: 62, zona: "Mendoza (Área Metropolitana / Pedemonte)" },
                    { lat: -31.4201, lon: -64.1888, frp: 45, zona: "Córdoba (Sierras Chicas)" },
                    { lat: -26.8083, lon: -65.2176, frp: 82, zona: "Tucumán (Zona Yungas)" },
                    { lat: -34.6037, lon: -58.3816, frp: 28, zona: "Buenos Aires (Periferia)" },
                    { lat: -31.6333, lon: -60.7000, frp: 58, zona: "Santa Fe (Delta / Islas)" },
                    { lat: -27.4514, lon: -58.9867, frp: 79, zona: "Chaco (Impenetrable)" },
                    { lat: -54.8019, lon: -68.3030, frp: 35, zona: "Tierra del Fuego" }
                ];

                focosSimuladosReales.forEach(foco => {
                    let colorAlerta = '#10b981';
                    let nivelStr = 'Normal (0-55%)';
                    if (foco.frp >= 55 && foco.frp < 76) {
                        colorAlerta = '#f59e0b';
                        nivelStr = 'Inestabilidad / Advertencia (55-75%)';
                    } else if (foco.frp >= 76) {
                        colorAlerta = '#ef4444';
                        nivelStr = 'Alerta Roja Crítica (76-100%)';
                    }

                    const circle = L.circleMarker([foco.lat, foco.lon], {
                        radius: 10,
                        fillColor: colorAlerta,
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 0.9,
                        fillOpacity: 0.85
                    });

                    circle.bindPopup(`
                        <h3>GOES-19 / ABI-FDC Argentina</h3>
                        <p><b>Región:</b> ${foco.zona}</p>
                        <p><b>Lat/Lon:</b> ${foco.lat}, ${foco.lon}</p>
                        <p><b>Intensidad FRP:</b> ${foco.frp} MW</p>
                        <p><b>Estado Escala:</b> <span style="color:${colorAlerta}; font-weight:bold;">${nivelStr}</span></p>
                    `);

                    puntosLayerGroup.addLayer(circle);
                });

                document.getElementById('net-status').className = 'status-badge badge-warning';
                document.getElementById('net-status').innerText = 'GOES-19 Enlace Directo';
            }
        }

        cargarPuntosCalorGOES19();
    </script>
</body>
</html>
