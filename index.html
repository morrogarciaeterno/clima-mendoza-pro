<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clima Mendoza Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 15px; margin: 0; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { font-size: 1.4rem; margin-top: 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌦 Clima Mendoza Pro</h1>
        <p id="subtitulo-alerta">Alertas · Zonda · Pronóstico</p>
    </div>

    <div class="card">
        <h3 id="lbl-ubicacion">📍 Detectando ubicación...</h3>
        <p id="lbl-temp">🌡 Temperatura: --</p>
        <p id="lbl-humedad">💧 Humedad: --</p>
        <p id="lbl-viento">🌬 Viento: --</p>
        <p id="lbl-estado">🌤 Estado del cielo: --</p>
    </div>

    <script>
        // Función principal de ubicación y clima original adaptada con el puente nativo
        function iniciarClimaPro() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    try {
                        // Obtener nombre del departamento por geocodificación inversa
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const data = await response.json();
                        
                        const ciudad = data.address.city || data.address.town || data.address.village || data.address.county || "Mendoza";
                        const estado = data.address.state || "";
                        const nombreLugar = `Departamento ${ciudad}, ${estado}`;

                        // Mostrar en la interfaz web original
                        document.getElementById("lbl-ubicacion").innerText = `📍 ${nombreLugar}`;

                        // ==========================================
                        // PUENTE NATIVO CON ANDROID (CLIMA SERVICE)
                        // ==========================================
                        if (window.Android && typeof window.Android.guardarUbicacion === "function") {
                            window.Android.guardarUbicacion(lat, lon, ciudad);
                        }

                        // Consultar datos de Open-Meteo
                        cargarClimaAPI(lat, lon);

                    } catch (e) {
                        console.error("Error obteniendo ubicación web", e);
                        document.getElementById("lbl-ubicacion").innerText = "📍 Mendoza Capital";
                        cargarClimaAPI(-32.89, -68.84);
                    }
                }, error => {
                    console.error("GPS denegado o no disponible", error);
                    document.getElementById("lbl-ubicacion").innerText = "📍 Mendoza Capital (Por defecto)";
                    cargarClimaAPI(-32.89, -68.84);
                });
            } else {
                cargarClimaAPI(-32.89, -68.84);
            }
        }

        async function cargarClimaAPI(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=America%2FArgentina%2FMendoza`);
                const data = await res.json();

                const temp = Math.round(data.current.temperature_2m);
                const humedad = data.current.relative_humidity_2m;
                const viento = data.current.wind_speed_10m;
                const code = data.current.weather_code;

                document.getElementById("lbl-temp").innerText = `🌡 Temperatura: ${temp}°C`;
                document.getElementById("lbl-humedad").innerText = `💧 Humedad: ${humedad}%`;
                document.getElementById("lbl-viento").innerText = `🌬 Viento: ${viento} km/h`;
                document.getElementById("lbl-estado").innerText = `🌤 Estado del cielo: ${obtenerTexto(code)}`;

            } catch (e) {
                console.error("Error en Open-Meteo", e);
            }
        }

        function obtenerTexto(code) {
            if (code === 0) return "Cielo despejado ☀️";
            if (code >= 1 && code <= 3) return "Parcialmente nublado 🌤️";
            if (code >= 51 && code <= 67) return "Lluvia 🌧️";
            return "Condiciones estables";
        }

        // Iniciar
        iniciarClimaPro();
    </script>
</body>
</html>
