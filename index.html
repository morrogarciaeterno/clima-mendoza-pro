<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa Test</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:Arial,sans-serif;
}

#map{
    width:100%;
    height:100vh;
}

.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.3);
}

button{
    padding:8px 12px;
    margin:3px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="panel">

<button id="btnBase">🌍 Base</button>

<button id="btnArgentina">🇦🇷 Argentina</button>

<button id="btnGPS">📍 GPS</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Crear mapa

const map = L.map('map').setView(
[-38.4161,-63.6167],
5
);

// Capa OSM

const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
);

osm.addTo(map);

// Botón Argentina

document
.getElementById('btnArgentina')
.addEventListener('click',function(){

    map.setView(
        [-38.4161,-63.6167],
        5
    );

});

// Botón Base

document
.getElementById('btnBase')
.addEventListener('click',function(){

    alert('Mapa Base OK');

});

// Botón GPS

document
.getElementById('btnGPS')
.addEventListener('click',function(){

    navigator.geolocation.getCurrentPosition(

        function(pos){

            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            L.marker([lat,lon])
            .addTo(map)
            .bindPopup("Tu ubicación")
            .openPopup();

            map.setView(
                [lat,lon],
                12
            );

        },

        function(error){

            alert(
              "No se pudo obtener GPS"
            );

            console.log(error);

        }

    );

});

console.log("TODO OK");

</script>

</body>
</html>
