</div></div></main><footer><span>TERRITORIA ENERGY</span><span>GIS NEUQUÉN · RES. 319/93</span><span id="foot">SISTEMA LISTO</span></footer></div>
<div class="modal" id="modal"><div class="window"><div class="head"><h2 id="title">MÓDULO</h2><div class="nav"><button class="close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>CERRAR</button></div></div><div class="body" id="modalBody"><div id="map" class="map"></div><aside class="side"><section class="card" id="filterCard"><div class="ch"><h3>FILTRO</h3><span id="count">0 ELEMENTOS</span></div><div class="cb"><div class="filters"><input id="search" placeholder="Buscar…"><select id="group"><option value="">Todos</option></select></div></div></section><section class="card"><div class="ch"><h3 id="detailTitle">DETALLE DEL ELEMENTO</h3><span id="layer">GIS</span></div><div class="cb" id="detail"><div class="loading">Selecciona un elemento en el mapa.</div></div></section></aside></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API='https://territoria-energy-api.elexpreso17.workers.dev';
let map,groupLayer,current='areas',raw=[],wellMode=false,statsSeq=0,statsCache={},statsCuenca='NEUQUINA',statsFluid='oil',statsMonth='';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
function setStatsLayout(isStats){$('modalBody').classList.toggle('stats-mode',isStats);$('filterCard').style.display=isStats?'none':'';$('detailTitle').textContent=isStats?'TABLERO ESTADÍSTICO · 12 MESES & COMPARATIVA MENSUAL':'DETALLE DEL ELEMENTO';if(!isStats&&map)setTimeout(()=>map.invalidateSize(),80)}
function closeModal(){statsSeq++;setStatsLayout(false);$('modal').classList.remove('open')}
function initMap(){if(map)return;map=L.map('map',{preferCanvas:true}).setView([-38.4,-69.1],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);groupLayer=L.layerGroup().addTo(map)}
async function openModule(type){statsSeq++;setStatsLayout(false);current=type;wellMode=type==='pozos';$('modal').classList.add('open');$('title').textContent=({pozos:'PADRÓN DE POZOS · NEUQUÉN',locaciones:'ACTIVOS · NEUQUÉN',ductos:'OLEODUCTOS Y LÍNEAS DE CONDUCCIÓN',plantas:'PLANTAS E INSTALACIONES',areas:'ÁREAS Y CONCESIONES · PRODUCCIÓN REAL'}[type]);initMap();setTimeout(()=>map.invalidateSize(),80);$('detail').innerHTML='<div class="loading">Consultando fuente oficial…</div>';try{const u=wellMode?API+'/api/pozos?inicio=0&limite=2000':API+'/api/infraestructura?tipo='+type;const r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Sin respuesta');raw=wellMode?(j.registros||[]).map(x=>({type:'Feature',geometry:x.geometria,properties:{...(x.datos||{}),_id:x.id}})):(j.features||[]);$('layer').textContent=j.layer||type.toUpperCase();buildGroups();render(true);$('apiStatus').textContent='API ONLINE · NEUQUÉN'}catch(e){$('detail').innerHTML='<div class="loading err">'+esc(e.message)+'</div>'}}
function props(f){return f.properties||{}}function titleOf(p){return p.WELL_NAME||p.SIGLA_NACION||p.NOMBRE||p.LOC_NOMBRE||p.YACIMIENTO||p.OPERADOR||p.CAPA||'Elemento GIS'}function operatorOf(p){return p.OPERADOR||p.OPERADORA||p.EMPRESA||p.TITULAR||''}function buildGroups(){let a=[...new Set(raw.map(f=>operatorOf(props(f))).filter(Boolean))].sort();$('group').innerHTML='<option value="">Todos</option>'+a.map(x=>'<option>'+esc(x)+'</option>').join('')}
$('search').oninput=()=>['mendozaAreas','mendozaPozos','neuquenCuenca'].includes(current)?renderCuencaLayer(false):render(false);$('group').onchange=()=>['mendozaAreas','mendozaPozos','neuquenCuenca'].includes(current)?renderCuencaLayer(false):render(false);
function render(fit){
  groupLayer.clearLayers();
  const q=$('search').value.toLowerCase(),g=$('group').value;
  const list=raw.filter(f=>{
    const p=props(f);
    return(!g||operatorOf(p)===g)&&(!q||Object.values(p).some(v=>String(v||'').toLowerCase().includes(q)));
  });
  $('count').textContent=list.length+' ELEMENTOS';

  const isMedicion=p=>{
    const cap=String(p.CAPA||'').toLowerCase();
    const tipo=String(p.TIPO_INST||p.TIPO||'').toLowerCase();
    return cap.includes('medicion')||cap.includes('punto')||tipo.includes('medic');
  };

  const instList=current==='plantas'?list.filter(f=>!isMedicion(props(f))):list;
  const medList=current==='plantas'?list.filter(f=>isMedicion(props(f))):[];

  const makeGeo=(items,forceMed=false)=>L.geoJSON({type:'FeatureCollection',features:items},{
    style:f=>{
      const p=props(f),gas=/GAS/.test(String(p.FLUIDO||p.TIPO||'').toUpperCase());
      return{color:gas?'#f4b544':'#24d6d0',weight:current==='ductos'?3:2,fillColor:'#24d6d0',fillOpacity:.15};
    },
    pointToLayer:(f,ll)=>{
      const med=current==='plantas'&&forceMed;
      return L.circleMarker(ll,{
        radius:med?5.5:4.8,
        color:'#ffffff',
        weight:med?1.4:1,
        fillColor:med?'#ff9f1c':'#24d6d0',
        fillOpacity:.95
      });
    },
    onEachFeature:(f,l)=>{
      const p=props(f);
      if(current==='plantas')l.bindTooltip(esc(titleOf(p)));
      l.on('click',()=>show(f));
    }
  });

  const gjInst=makeGeo(instList,false).addTo(groupLayer);
  const gjMed=medList.length?makeGeo(medList,true).addTo(groupLayer):null;

  if(fit){
    const b1=gjInst.getBounds().isValid()?gjInst.getBounds():null;
    const b2=gjMed&&gjMed.getBounds().isValid()?gjMed.getBounds():null;
    const bounds=b1&&b2?b1.extend(b2):(b1||b2);
    if(bounds)map.fitBounds(bounds,{padding:[30,30],maxZoom:12});
  }

  if(current==='plantas'){
    $('detail').innerHTML=`<div class="legend-bar"><span><i class="dot-lg" style="background:#24d6d0"></i>Instalaciones (${instList.length})</span><span><i class="dot-lg" style="background:#ff9f1c"></i>Puntos de medición (${medList.length})</span></div><div class="loading">Seleccioná una planta, batería o punto de medición en el mapa.</div>`;
    return;
  }
  $('detail').innerHTML='<div class="loading">Selecciona un elemento en el mapa.</div>';
}
function row(k,v){if(v===null||v===undefined||String(v).trim()===''||String(v).trim()==='0')return'';return`<div class="row"><span>${esc(k)}</span><b title="${esc(v)}">${esc(v)}</b></div>`}function formatNum(v){return Number(v).toLocaleString('es-AR',{maximumFractionDigits:2})}function stamp(v){if(!v)return'Sin dato';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('es-AR')}
function copyCoords(lat,lon,btn){if(!navigator.clipboard)return;navigator.clipboard.writeText(`${lat}, ${lon}`).then(()=>{const old=btn.textContent;btn.textContent='✓ COORDENADAS COPIADAS';setTimeout(()=>btn.textContent=old,1600)})}
async function show(f){const p={...props(f)},t=titleOf(p),sub=[p.ID_NQN,p.ID_DUCTO,p.LOC_ID,p.CAPA].filter(Boolean).join(' · ');if(current==='areas'){const keys=[['ID Neuquén',p.ID_NQN],['Nombre',p.NOMBRE],['Bloque',p.BLOQUE],['Tipo de área',p.TIPO_AREA||p.TIPO],['Titular',p.TITULAR],['Operador',p.OPERADOR],['Superficie legal',p.SUP_LEGAL||p.SUPERFICIE],['Participación',p.PARTICIPACION],['Tipo de contrato',p.TIPO_CONTRATO],['Norma legal',p.NORMA_LEGAL],['Inicio contrato',p.INICIO_CONTRATO],['Fin contrato',p.FIN_CONTRATO],['Mensura',p.MENSURA],['Observaciones',p.OBSERVACIONES]];$('detail').innerHTML=`<div class="banner"><b>${esc(t)}</b><small>${esc(sub||'ÁREA GIS · NEUQUÉN')}</small></div><div class="kv">${keys.map(x=>row(...x)).join('')}</div><div id="areaProd" class="prod"><div class="loading">Consultando producción real del área…</div></div>`;await loadArea(p.NOMBRE||p.AREA||p.BLOQUE||t);return}if(current==='plantas'){const tipo=p.TIPO_INST||p.TIPO||p.CAPA||'Instalación';const oper=operatorOf(p)||'Sin dato';const areaName=p.AREA||p.CONCESION||p.YACIMIENTO||'';const lat=p.LATITUD??(f.geometry?.coordinates?.[1]);const lon=p.LONGITUD??(f.geometry?.coordinates?.[0]);const hasCoords=lat!==undefined&&lon!==undefined&&lat!==''&&lon!=='';const entries=Object.entries(p).filter(([,v])=>v!==null&&v!==''&&String(v).trim()!=='').slice(0,26);$('detail').innerHTML=`<div class="banner"><b>${esc(t)}</b><small>${esc(sub||'PLANTA / INSTALACIÓN · NEUQUÉN')}</small></div><div class="metrics" style="margin-bottom:10px"><div class="metric"><span>TIPO</span><strong class="c" title="${esc(tipo)}">${esc(tipo)}</strong></div><div class="metric"><span>OPERADOR</span><strong title="${esc(oper)}">${esc(oper)}</strong></div><div class="metric"><span>ÁREA</span><strong class="a" title="${esc(areaName||'Sin dato')}">${esc(areaName||'Sin dato')}</strong></div></div><div class="kv">${entries.map(([k,v])=>row(k,v)).join('')}</div>${hasCoords?`<button type="button" class="gps-btn" onclick="copyCoords('${esc(lat)}','${esc(lon)}',this)">COPIAR COORDENADAS GPS (${esc(Number(lat).toFixed(5))}, ${esc(Number(lon).toFixed(5))})</button>`:''}${areaName?`<div id="areaProd" class="prod"><div class="loading">Consultando producción real del área ${esc(areaName)}…</div></div>`:''}`;if(areaName)await loadArea(areaName);return}if(current==='ductos'){const keys=[['ID ducto',p.ID_DUCTO],['Operador',operatorOf(p)],['Concesión',p.CONCESION],['Otorgado',p.OTORGADO],['Desde',p.DESDE||p.ORIGEN],['Hasta',p.HASTA||p.DESTINO],['Recibe de',p.RECIBE_DE||p.RECIBE],['Entrega a',p.ENTREGA_A||p.ENTREGA],['Fluido',p.FLUIDO],['Tipo',p.TIPO],['Tramo',p.TRAMO],['Diámetro',p.DIAMETRO],['Espesor',p.ESPESOR],['Material',p.MATERIAL],['Tendido',p.TENDIDO],['Profundidad',p.PROFUNDIDAD||p.PROF],['Revestimiento exterior',p.REVESTIMIENTO_EXTERIOR||p.REV_EXT],['Revestimiento interior',p.REVESTIMIENTO_INTERIOR||p.REV_INT]];$('detail').innerHTML=`<div class="banner"><b>${esc(t)}</b><small>${esc(sub||'DUCTO · GIS')}</small></div><div class="metrics"><div class="metric"><span>OPERADOR</span><strong>${esc(operatorOf(p)||'Sin dato')}</strong></div><div class="metric"><span>FLUIDO</span><strong class="c">${esc(p.FLUIDO||'Sin dato')}</strong></div><div class="metric"><span>TIPO</span><strong>${esc(p.TIPO||'Sin dato')}</strong></div></div><div class="duct-grid">${keys.map(x=>row(...x)).join('')}</div>`;return}if(wellMode){showWell(p);return}let entries=Object.entries(p).filter(([,v])=>v!==null&&v!==''&&String(v).trim()!=='').slice(0,28);$('detail').innerHTML=`<div class="banner"><b>${esc(t)}</b><small>${esc(sub||'GIS · NEUQUÉN')}</small></div><div class="kv">${entries.map(([k,v])=>row(k,v)).join('')}</div>`}
async function loadArea(name){const box=$('areaProd');if(!box)return;try{const r=await fetch(API+'/api/produccion/areas?area='+encodeURIComponent(name),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Error');const a=j.area;if(!a||!a.periodo){box.innerHTML='<div class="loading">Sin declaraciones asociadas a esta área.</div>';return}box.innerHTML=`<div class="prod-head"><b>PRODUCCIÓN DEL ÁREA</b><span>${esc(a.periodo)}</span></div><div class="metrics"><div class="metric"><span>PETRÓLEO</span><strong class="c">${formatNum(a.petroleo_m3)}</strong><small>m³/mes</small></div><div class="metric"><span>GAS</span><strong>${formatNum(a.gas_miles_m3)}</strong><small>miles m³/mes</small></div><div class="metric"><span>AGUA</span><strong>${formatNum(a.agua_m3)}</strong><small>m³/mes</small></div></div><div class="prod-foot"><b>${formatNum(a.cantidad_pozos)} pozos incluidos</b><br>Operadora/s: ${esc((a.empresas||[]).join(', ')||'Sin dato')}<br>Actualización de fuente: ${esc(stamp(a.fecha_actualizacion))}<br>Fuente: ${esc(a.fuente||j.recurso||'Capítulo IV')}</div>`}catch(e){if(box)box.innerHTML='<div class="loading err">'+esc(e.message)+'</div>'}}
async function showWell(p){const name=p.WELL_NAME||p.UWI_NQN||'Pozo seleccionado';$('detail').innerHTML=`<div class="banner"><b class="well-name">${esc(name)}</b><small>${esc(p.YACIMIENTO||p.FIELD_NAME||'GIS NEUQUÉN')} · ${esc(operatorOf(p)||'Sin operadora')}</small></div><div id="wellProd" class="prod"><div class="loading">Consultando producción declarada…</div></div><div class="kv">${[['UWI Neuquén',p.UWI_NQN],['UWI Nación',p.UWI_SEN],['Estado',p.ESTADO_GIS],['Operadora',p.OPERADOR],['Área',p.AREA_LEGAL],['Yacimiento',p.YACIMIENTO],['Formación',p.FORM_PROD],['Reservorio',p.RESERVORIO],['Profundidad',p.PROFUNDIDAD_MEDIDA],['Sistema extracción',p.SIST_EXTRACCION]].map(x=>row(...x)).join('')}</div>`;const sigla=p.WELL_NAME||p.SIGLA_NACION||'',id=p.UWI_SEN||'';try{const qs=new URLSearchParams();if(sigla)qs.set('sigla',sigla);if(id)qs.set('idpozo',id);const r=await fetch(API+'/api/produccion?'+qs),j=await r.json(),a=j.ultimo_mes;if(!a)throw Error('Sin declaración productiva');$('wellProd').innerHTML=`<div class="prod-head"><b>PRODUCCIÓN DECLARADA</b><span>${String(a.mes).padStart(2,'0')}/${a.anio}</span></div><div class="metrics"><div class="metric"><span>PETRÓLEO</span><strong class="c">${formatNum(a.prod_pet)}</strong><small>m³/mes</small></div><div class="metric"><span>GAS</span><strong>${formatNum(a.prod_gas)}</strong><small>miles m³/mes</small></div><div class="metric"><span>AGUA</span><strong>${formatNum(a.prod_agua)}</strong><small>m³/mes</small></div></div><div class="prod-foot">Empresa declarada: ${esc(a.empresa||'Sin dato')} · Estado: ${esc(a.tipoestado||'Sin dato')} · TEF: ${esc(a.tef||'Sin dato')}</div>`}catch(e){$('wellProd').innerHTML='<div class="loading err">'+esc(e.message)+'</div>'}}

function fmtDelta(pct, diffStr, refPeriod){
  if(pct===null||pct===undefined||!Number.isFinite(Number(pct)))return'<small class="delta-flat">Sin mes previo para comparar</small>';
  const n=Number(pct),cls=n>0?'delta-up':(n<0?'delta-down':'delta-flat'),arrow=n>0?'▲':(n<0?'▼':'•'),sign=n>0?'+':'';
  return`<small class="${cls}">${arrow} ${sign}${formatNum(n)}% (${diffStr}) vs ${esc(refPeriod||'')}</small>`;
}

function renderSerie12mSvg(serie, isGas){
  if(!serie||!serie.length)return'<div class="loading">Sin serie mensual disponible.</div>';
  const vals=serie.map(x=>Number(isGas?x.gas_miles_m3:x.petroleo_mbbl_d)||0);
  const unit=isGas?'Mm³':'Mbbl/d';
  const w=900,h=150,padL=54,padR=34,padT=16,padB=24;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const dataMax=Math.max(...vals), dataMin=Math.min(...vals);
  const rawSpan=Math.max(dataMax-dataMin, Math.abs(dataMax)*0.02, 1);
  const minV=dataMin - rawSpan*0.25;
  const maxV=dataMax + rawSpan*0.20;
  const span=Math.max(maxV-minV, 1);
  const pts=serie.map((m,i)=>{
    const x=padL+(serie.length===1?plotW/2:(i/(serie.length-1))*plotW);
    const v=vals[i];
    const y=padT+plotH-(((v-minV)/span)*plotH);
    const improved=isGas?m.mejoro_gas:m.mejoro_pet;
    return{x,y,v,m,improved};
  });
  const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaD=`M ${pts[0].x.toFixed(1)},${(padT+plotH).toFixed(1)} `+pts.map(p=>`L ${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+` L ${pts[pts.length-1].x.toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  const strokeColor=isGas?'#31d67b':'#24d6d0';
  const fillColor=isGas?'rgba(49,214,123,.14)':'rgba(36,214,208,.14)';
  const gridLines=[0,.5,1].map(t=>{
    const gy=padT+plotH*(1-t);
    const gv=minV+span*t;
    return`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="#1f3545" stroke-dasharray="3 3" stroke-width="1"/><text x="${padL-8}" y="${(gy+3).toFixed(1)}" fill="#7f9aaa" font-size="9.5" text-anchor="end">${formatNum(gv)}</text>`;
  }).join('');
  const circles=pts.map(p=>{
    const dotCol=p.improved===true?'#31d67b':(p.improved===false?'#ff5e68':strokeColor);
    const varPct=isGas?p.m.variacion_gas_pct:p.m.variacion_pet_pct;
    const varTip=varPct!==null&&varPct!==undefined?` (${varPct>0?'+':''}${varPct}% vs mes ant.)`:'';
    return`<g><title>${esc(p.m.periodo)}: ${formatNum(p.v)} ${unit}${esc(varTip)}</title><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${dotCol}" stroke="#071018" stroke-width="1.5"/><text x="${p.x.toFixed(1)}" y="${h-6}" fill="#7f9aaa" font-size="9" text-anchor="middle">${esc(p.m.periodo)}</text></g>`;
  }).join('');
  const last=pts[pts.length-1];
  const lastPct=isGas?last.m.variacion_gas_pct:last.m.variacion_pet_pct;
  const lastCls=lastPct>0?'delta-up':(lastPct<0?'delta-down':'delta-flat');
  const lastTxt=lastPct===null||lastPct===undefined?'Sin mes previo':`${lastPct>0?'▲ +':'▼ '}${formatNum(lastPct)}% vs mes ant.`;
  return`<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfica últimos meses">${gridLines}<path d="${areaD}" fill="${fillColor}"/><polyline fill="none" stroke="${strokeColor}" stroke-width="2.4" points="${poly}"/>${circles}</svg></div><div class="prod-foot" style="display:flex;justify-content:space-between;gap:12px;margin-top:4px"><span>Último punto (${esc(last.m.periodo)}): <b>${formatNum(last.v)} ${esc(unit)}</b> · <span class="${lastCls}">${lastTxt}</span></span><span>Pasá el cursor o tocá un punto para ver el detalle</span></div>`;
}

function renderBarsHtml(items,labelKey,valKey,unitSuffix,fillClass,limit=12,subFn=null){
  if(!items||!items.length)return'<div class="loading">Sin datos en el período.</div>';
  const slice=items.slice(0,limit);
  const topMax=Math.max(...slice.map(x=>Number(x[valKey])||0),1);
  return slice.map((it,idx)=>{
    const v=Number(it[valKey])||0,pct=Math.max(2,Math.min(100,(v/topMax)*100));
    const sub=subFn?subFn(it):'';
    return`<div class="bar-item"><div class="bar-top"><b title="${esc(it[labelKey])}">${idx+1}. ${esc(it[labelKey])}</b><span>${formatNum(v)} ${esc(unitSuffix)}</span></div>${sub?`<div class="bar-sub">${esc(sub)}</div>`:''}<div class="bar-track"><div class="bar-fill ${fillClass||''}" style="width:${pct.toFixed(1)}%"></div></div></div>`;
  }).join('');
}

function setStatsFluid(mode){statsFluid=mode==='gas'?'gas':'oil';paintEstadisticas()}
function setStatsCuenca(c){statsCuenca=c;loadEstadisticasData()}
function onStatsMonthChange(val){statsMonth=String(val||'').trim();loadEstadisticasData()}

function paintEstadisticas(){
  if(current!=='estadisticas')return;
  const cacheKey=`${statsCuenca}|${statsMonth||'latest'}`;
  const j=statsCache[cacheKey]||statsCache[`${statsCuenca}|latest`];
  const curMonthVal=statsMonth||(j?.periodo?.anio&&j?.periodo?.mes?`${j.periodo.anio}-${String(j.periodo.mes).padStart(2,'0')}`:'');
  const rawPeriodos=(statsCache[`${statsCuenca}|latest`]?.periodos_disponibles)||(j?.periodos_disponibles)||(j?.serie_12m||[]).map(m=>({
    value:`${m.anio}-${String(m.mes).padStart(2,'0')}`,
    label:m.periodo
  }));
  const mesesOpts=rawPeriodos.slice().reverse().map(m=>{
    const sel=curMonthVal===m.value?' selected':'';
    return`<option value="${esc(m.value)}"${sel}>${esc(m.label)}</option>`;
  }).join('');
  const fallbackOpt=curMonthVal?`<option value="${esc(curMonthVal)}" selected>${esc(curMonthVal.split('-').reverse().join('/'))}</option>`:'<option value="">Último mes</option>';
  const monthControl=`<div class="month-picker"><label for="statsMonthSelect">MES/AÑO</label><select id="statsMonthSelect" onchange="onStatsMonthChange(this.value)">${mesesOpts||fallbackOpt}</select></div>`;
  const toolbar=`<div class="stats-toolbar"><div class="stats-cuencas"><button type="button" class="${statsCuenca==='NEUQUINA'?'active':''}" onclick="setStatsCuenca('NEUQUINA')">CUENCA NEUQUINA</button><button type="button" class="${statsCuenca==='CUYANA'?'active':''}" onclick="setStatsCuenca('CUYANA')">CUENCA CUYANA</button><button type="button" class="${statsCuenca==='TODAS'?'active':''}" onclick="setStatsCuenca('TODAS')">ARGENTINA (TODAS)</button>${monthControl}</div><div class="fluid-switch" style="margin:0;min-width:200px"><button type="button" class="${statsFluid==='oil'?'active':''}" onclick="setStatsFluid('oil')">OIL</button><button type="button" class="${statsFluid==='gas'?'active':''}" onclick="setStatsFluid('gas')">GAS</button></div></div>`;
  const activeData=statsCache[cacheKey];
  if(!activeData){$('detail').innerHTML=toolbar+'<div class="loading">Calculando serie histórica, comparativa mensual y rankings…</div>';return}
  if(!activeData.periodo){$('detail').innerHTML=toolbar+'<div class="loading err">Sin datos disponibles para el mes o cuenca seleccionado.</div>';return}
  const m=activeData.resumen_mes||{},cmp=activeData.comparacion_mes_anterior||{},isGas=statsFluid==='gas';
  const areas=isGas?(activeData.ranking_areas_gas||activeData.ranking_areas||[]):(activeData.ranking_areas_oil||activeData.ranking_areas||[]);
  const emps=isGas?(activeData.ranking_empresas_gas||activeData.ranking_empresas||[]):(activeData.ranking_empresas_oil||activeData.ranking_empresas||[]);
  const pozos=isGas?(activeData.ranking_pozos_gas||[]):(activeData.ranking_pozos_oil||[]);
  const areaValKey=isGas?'gas_miles_m3':'petroleo_mbbl_d',areaUnit=isGas?'Mm³':'Mbbl/d';
  const pozoValKey=isGas?'gas_miles_m3':'petroleo_bbl_d',pozoUnit=isGas?'Mm³':'bbl/d';
  const petDiffStr=`${cmp.diferencia_mbbl_d>0?'+':''}${formatNum(cmp.diferencia_mbbl_d||0)} Mbbl/d`;
  const gasDiffStr=`${cmp.diferencia_gas_miles_m3>0?'+':''}${formatNum(cmp.diferencia_gas_miles_m3||0)} Mm³`;
  $('detail').innerHTML=toolbar+`
    <div class="banner"><b>${esc(statsCuenca==='TODAS'?'ARGENTINA · TODAS LAS CUENCAS':'CUENCA '+statsCuenca)} · PERÍODO ${esc(activeData.periodo.label)} (${isGas?'GAS':'OIL'})</b><small>SERIE DE ${(activeData.serie_12m||[]).length} MESES HASTA ${esc(activeData.periodo.label)} · COMPARATIVA VS MES ANTERIOR</small></div>
    <div class="metrics">
      <div class="metric"><span>PETRÓLEO (${esc(activeData.periodo.label)})</span><strong class="c">${formatNum(m.petroleo_mbbl_d)}</strong><small>Mbbl/d (${formatNum(m.petroleo_m3)} m³)</small>${fmtDelta(cmp.pct_mbbl_d??cmp.pct_pet,petDiffStr,cmp.periodo_anterior)}</div>
      <div class="metric"><span>GAS (${esc(activeData.periodo.label)})</span><strong>${formatNum(m.gas_miles_m3)}</strong><small>miles m³/mes (Mm³)</small>${fmtDelta(cmp.pct_gas,gasDiffStr,cmp.periodo_anterior)}</div>
      <div class="metric"><span>POZOS ACTIVOS</span><strong>${formatNum(isGas?(m.pozos_con_gas??m.pozos_con_petroleo):m.pozos_con_petroleo)}</strong><small>con prod. ${isGas?'gas':'oil'} &gt; 0</small><small class="delta-flat">Días del mes: ${esc(activeData.periodo.dias)}</small></div>
    </div>
    <div class="chart-card">
      <div class="stat-title"><b>EVOLUCIÓN ÚLTIMOS ${(activeData.serie_12m||[]).length} MESES · ${isGas?'GAS (Mm³)':'PETRÓLEO (Mbbl/d)'}</b><span>VERDE = SUBIÓ · ROJO = BAJÓ</span></div>
      ${renderSerie12mSvg(activeData.serie_12m||[],isGas)}
    </div>
    <div class="stats-grid">
      <div class="stats-panel"><div class="stat-title"><b>TOP ÁREAS (${isGas?'GAS':'OIL'})</b><span>${esc(areaUnit)}</span></div>${renderBarsHtml(areas,'area',areaValKey,areaUnit,isGas?'g':'',12)}</div>
      <div class="stats-panel"><div class="stat-title"><b>TOP OPERADORAS (${isGas?'GAS':'OIL'})</b><span>${esc(areaUnit)}</span></div>${renderBarsHtml(emps,'empresa',areaValKey,areaUnit,'a',12)}</div>
      <div class="stats-panel"><div class="stat-title"><b>TOP POZOS (${isGas?'GAS':'OIL'})</b><span>${esc(pozoUnit)}</span></div>${renderBarsHtml(pozos,'sigla',pozoValKey,pozoUnit,isGas?'g':'',12,p=>`${p.empresa} · ${p.area}`)}</div>
    </div>
    <div class="prod-foot">Fuente: ${esc(activeData.fuente_serie||activeData.recurso||'Capítulo IV')} · Actualización: ${esc(stamp(activeData.fecha_actualizacion))}</div>
  `;
}

async function loadEstadisticasData(){
  const seq=++statsSeq;
  const cacheKey=`${statsCuenca}|${statsMonth||'latest'}`;
  if(statsCache[cacheKey]){paintEstadisticas();return}
  paintEstadisticas();
  try{
    const params=new URLSearchParams({top:'15'});
    if(statsCuenca!=='TODAS')params.set('cuenca',statsCuenca);
    if(statsMonth&&/^\d{4}-\d{2}$/.test(statsMonth)){
      const [y,m]=statsMonth.split('-');
      params.set('anio',String(Number(y)));
      params.set('mes',String(Number(m)));
    }
    const r=await fetch(API+'/api/estadisticas?'+params.toString(),{cache:'no-store'}),j=await r.json();
    if(seq!==statsSeq||current!=='estadisticas')return;
    if(!r.ok||!j.ok)throw Error(j.error||'Error consultando estadísticas');
    statsCache[cacheKey]=j;
    paintEstadisticas();
  }catch(e){
    if(seq!==statsSeq||current!=='estadisticas')return;
    $('detail').innerHTML='<div class="loading err">'+esc(e.message)+'</div>';
  }
}

async function openEstadisticas(){
  current='estadisticas';wellMode=false;$('modal').classList.add('open');$('title').textContent='ESTADÍSTICAS · 12 MESES & COMPARATIVA MENSUAL';setStatsLayout(true);$('layer').textContent='CAPÍTULO IV · SE';await loadEstadisticasData();
}

async function openCuencas(){
  statsSeq++;setStatsLayout(false);current='cuencas';wellMode=false;$('modal').classList.add('open');$('title').textContent='CUENCAS PRODUCTIVAS · ARGENTINA';initMap();setTimeout(()=>map.invalidateSize(),80);groupLayer.clearLayers();$('count').textContent='2 CUENCAS';$('layer').textContent='TERRITORIA ENERGY';$('group').innerHTML='<option value="">Todos</option>';$('search').value='';$('detail').innerHTML='<div class="cuenca-tabs"><button onclick="openNeuquinaCuenca()">CUENCA NEUQUINA</button><button onclick="openCuyanaCuenca()">CUENCA CUYANA</button></div><div class="loading">Selecciona una cuenca.</div>';}
async function openNeuquinaCuenca(){
  setStatsLayout(false);current='neuquenCuenca';$('title').textContent='CUENCA NEUQUINA · ÁREAS Y CONCESIONES';$('detail').innerHTML='<div class="loading">Cargando áreas de Neuquén…</div>';try{const r=await fetch(API+'/api/infraestructura?tipo=areas',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Sin respuesta');raw=j.features||[];$('layer').textContent=j.layer||'ÁREAS NEUQUÉN';buildCuencaFilters('nqn');renderCuencaLayer(true);}catch(e){$('detail').innerHTML='<div class="loading err">'+esc(e.message)+'</div>';}}
async function openCuyanaCuenca(){
  setStatsLayout(false);current='mendozaAreas';$('title').textContent='CUENCA CUYANA · MENDOZA';$('detail').innerHTML='<div class="loading">Cargando producción por áreas de Mendoza…</div>';await loadMendozaProductionAreas();}
function cuencaTabs(active){return '<div class="cuenca-tabs"><button '+(active==='nqn'?'class="active"':'')+' onclick="openNeuquinaCuenca()">CUENCA NEUQUINA</button><button '+(active==='cuyana'?'class="active"':'')+' onclick="openCuyanaCuenca()">CUENCA CUYANA</button></div>';}
function mzaSubtabs(active){return '<div class="subtabs"><button '+(active==='areas'?'class="active"':'')+' onclick="loadMendozaProductionAreas()">ÁREAS + PRODUCCIÓN</button><button '+(active==='pozos'?'class="active"':'')+' onclick="loadMendozaPozos()">POZOS</button></div>';}
function buildCuencaFilters(kind){const ops=[...new Set(raw.map(f=>{const p=f.properties||{};return String(kind==='mzaP'?p.empresa:(p.operador||p.Operador25||p.OPERADOR||p.TITULAR||'')).trim()}).filter(Boolean))].sort();$('group').innerHTML='<option value="">Todos los operadores</option>'+ops.map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join('');$('search').value='';}
async function loadMendozaProductionAreas(){
  setStatsLayout(false);current='mendozaAreas';$('title').textContent='CUENCA CUYANA · ÁREAS PRODUCTIVAS';$('detail').innerHTML=cuencaTabs('cuyana')+mzaSubtabs('areas')+'<div class="loading">Cargando áreas productivas oficiales…</div>';try{const r=await fetch(API+'/api/mendoza/produccion-areas?limite=5000',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Sin respuesta');raw=j.features||[];$('layer').textContent=j.layer||'PRODUCCIÓN ÁREAS MENDOZA';buildCuencaFilters('mza');renderCuencaLayer(true);}catch(e){$('detail').innerHTML=cuencaTabs('cuyana')+mzaSubtabs('areas')+'<div class="loading err">'+esc(e.message)+'</div>';}}
async function loadMendozaPozos(){
  setStatsLayout(false);current='mendozaPozos';$('title').textContent='MENDOZA · POZOS CUENCA CUYANA Y NEUQUINA';$('detail').innerHTML=cuencaTabs('cuyana')+mzaSubtabs('pozos')+'<div class="loading">Cargando pozos oficiales…</div>';try{const [rC,rN]=await Promise.all([fetch(API+'/api/mendoza/pozos?limite=15000&cuenca=CUYANA',{cache:'no-store'}),fetch(API+'/api/mendoza/pozos?limite=15000&cuenca=NEUQUINA',{cache:'no-store'})]);const [jC,jN]=await Promise.all([rC.json(),rN.json()]);if(!rC.ok||!jC.ok)throw Error(jC.error||'Sin respuesta Cuyana');if(!rN.ok||!jN.ok)throw Error(jN.error||'Sin respuesta Neuquina');const merged=[...(jC.features||[]),...(jN.features||[])];const seen=new Set();raw=merged.filter(f=>{const k=f.id||((f.properties||{}).sigla+'|'+JSON.stringify(f.geometry||{}));if(seen.has(k))return false;seen.add(k);return true});$('layer').textContent='POZOS MENDOZA · CUYANA + NEUQUINA';buildCuencaFilters('mzaP');renderCuencaLayer(true);}catch(e){$('detail').innerHTML=cuencaTabs('cuyana')+mzaSubtabs('pozos')+'<div class="loading err">'+esc(e.message)+'</div>';}}
function renderCuencaLayer(fit){
  groupLayer.clearLayers();const q=$('search').value.trim().toLowerCase(),op=$('group').value;
  const list=raw.filter(f=>{const p=f.properties||{};let oper=current==='mendozaPozos'?p.empresa:(p.operador||p.Operador25||p.OPERADOR||p.TITULAR||'');let vals=current==='mendozaPozos'?[p.sigla,p.area,p.cod_area,p.empresa,p.yacimiento,p.formacion,p.tipoestado]:current==='mendozaAreas'?[p.nombre_area,p.id_area,p.operador]:Object.values(p);return(!op||String(oper)===op)&&(!q||vals.some(v=>String(v||'').toLowerCase().includes(q)))});
  $('count').textContent=list.length+(current==='mendozaPozos'?' POZOS':' ÁREAS');
  const gj=L.geoJSON({type:'FeatureCollection',features:list},{style:f=>({color:current==='mendozaAreas'?'#f4b544':'#24d6d0',weight:2,fillColor:current==='mendozaAreas'?'#f4b544':'#24d6d0',fillOpacity:.22}),pointToLayer:(f,ll)=>{const st=String((f.properties||{}).tipoestado||'').toLowerCase(),fill=st.includes('aband')?'#ff5e68':st.includes('reserva')?'#f4b544':'#24d6d0';return L.circleMarker(ll,{radius:4,color:'#fff',weight:1,fillColor:fill,fillOpacity:.9})},onEachFeature:(f,l)=>{const p=f.properties||{};l.bindTooltip(esc(p.nombre_area||p.area||p.sigla||p.NOMBRE||'Elemento'));l.on('click',()=>showCuencaFeature(f));}}).addTo(groupLayer);
  if(fit&&gj.getBounds().isValid())map.fitBounds(gj.getBounds(),{padding:[25,25],maxZoom:current==='mendozaPozos'?12:10});
  const head=current==='neuquenCuenca'?cuencaTabs('nqn'):(cuencaTabs('cuyana')+mzaSubtabs(current==='mendozaPozos'?'pozos':'areas'));
  $('detail').innerHTML=head+'<div class="banner"><b>'+(current==='mendozaPozos'?'POZOS DE MENDOZA':current==='mendozaAreas'?'ÁREAS PRODUCTIVAS DE MENDOZA':'ÁREAS DE LA CUENCA NEUQUINA')+'</b><small>'+list.length+' ELEMENTOS VISIBLES</small></div><div class="loading">Busca y selecciona un elemento en el mapa.</div>';
}
function showCuencaFeature(f){const p=f.properties||{};if(current==='mendozaAreas'){showMendozaProductionArea(p);return}if(current==='mendozaPozos'){showMendozaWell(p);return}const t=p.NOMBRE||p.BLOQUE||p.AREA||'Área Neuquén';$('detail').innerHTML=cuencaTabs('nqn')+`<div class="banner"><b>${esc(t)}</b><small>CUENCA NEUQUINA · GIS OFICIAL</small></div><div class="kv">${Object.entries(p).filter(([,v])=>v!==null&&v!=='').slice(0,24).map(([k,v])=>row(k,v)).join('')}</div>`;}
function showMendozaProductionArea(p){$('detail').innerHTML=cuencaTabs('cuyana')+mzaSubtabs('areas')+`<div class="banner"><b>${esc(p.nombre_area||'Área Mendoza')}</b><small>${esc(p.id_area||'')} · PRODUCCIÓN POR ÁREA</small></div><div class="metrics"><div class="metric"><span>PETRÓLEO</span><strong class="c">${formatNum(p.total_pet_m3)}</strong><small>m³</small></div><div class="metric"><span>GAS</span><strong>${formatNum(p.total_gas_m3)}</strong><small>m³</small></div><div class="metric"><span>POZOS ACTIVOS</span><strong>${formatNum(p.pozos_activos)}</strong><small>unidades</small></div></div><div class="prod"><div class="kv">${row('Operador',p.operador)}${row('ID área',p.id_area)}${row('Fuente','vista_produccion_areas_final')}</div></div>`;}
function showMendozaWell(p){$('detail').innerHTML=cuencaTabs('cuyana')+mzaSubtabs('pozos')+`<div class="banner"><b>${esc(p.sigla||'Pozo Mendoza')}</b><small>${esc(p.area||'')} · ${esc(p.cuenca||'CUYANA')}</small></div><div class="kv">${row('Empresa',p.empresa)}${row('Área',p.area)}${row('Código área',p.cod_area)}${row('Yacimiento',p.yacimiento)}${row('Código yacimiento',p.cod_yacimiento)}${row('Formación',p.formacion)}${row('Profundidad',p.profundidad!=null?formatNum(p.profundidad)+' m':null)}${row('Cota',p.cota!=null?formatNum(p.cota)+' m':null)}${row('Clasificación',p.clasificacion)}${row('Subclasificación',p.subclasificacion)}${row('Recurso',p.tipo_recurso)}${row('Tipo pozo',p.tipopozo)}${row('Extracción',p.tipoextraccion)}${row('Estado',p.tipoestado)}</div>`;}
fetch(API+'/health').then(r=>r.json()).then(j=>{$('apiStatus').textContent=j.ok?'API ONLINE · NEUQUÉN':'API SIN RESPUESTA'}).catch(()=>{$('apiStatus').textContent='API SIN RESPUESTA';document.querySelector('.dot').style.background='var(--r)'})
</script></body></html>
