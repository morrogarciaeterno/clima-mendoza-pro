<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroTech Argentina</title>
    <!-- Librería Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Librería Leaflet.draw para dibujo de polígonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- Librería PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --card-inner: #1f2937;
            --accent: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            max-width: 100%;
        }

        html, body {
            background-color: var(--bg);
            color: var(--text-main);
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 12px 10px 12px;
            padding-top: max(24px, env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }

        .header-content {
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand p {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .date-display {
            text-align: right;
        }

        #fecha {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .time-temp-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 2px;
        }

        #digitalFallback {
            font-size: 0.75rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        #headerTemp {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            display: inline-block;
        }

        .btn-notif-header {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            flex-shrink: 0;
        }

        .container {
            max-width: 1400px;
            margin: 10px auto;
            padding: 0 8px 60px 8px;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 12px;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            width: 100%;
            overflow: hidden;
        }

        .card h3 {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 4px;
        }

        .card-temp-main {
            grid-column: span 2;
        }

        @media (min-width: 768px) {
            .card-temp-main {
                grid-column: span 1;
            }
        }

        .card-temp-main .metric {
            font-size: 2.8rem !important;
            font-weight: 900 !important;
            color: #ffffff !important;
            line-height: 0.95;
            margin-top: 2px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        }

        .temp-box {
            display: flex
