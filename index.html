<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba Radar Meteorológico</title>

<link rel="stylesheet"

<style>

body{

#map{
