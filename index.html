<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroTech Argentina</title>
    <!-- Librería Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Librería Leaflet.draw para dibujo de polígonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- Librería PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --card-inner: #1f2937;
            --accent: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: var(--bg);
            color: var(--text-main);
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-y;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px 12px 20px;
            padding-top: max(32px, env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .date-display {
            text-align: right;
        }

        #fecha {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .time-temp-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 2px;
        }

        #digitalFallback {
            font-size: 0.8rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        #headerTemp {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            display: inline-block;
        }

        .btn-notif-header {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .btn-notif-header:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.05);
        }

        .container {
            max-width: 1400px;
            margin: 15px auto;
            padding: 0 10px 60px 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
        }

        .card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 6px;
        }

        .card-temp-main .metric {
            font-size: 3.5rem !important;
            font-weight: 900 !important;
            color: #ffffff !important;
            line-height: 0.95;
            margin-top: 2px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        }

        .temp-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #weatherIcon {
            width: 48px;
            height: 48px;
        }

        .forecast-cards {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            touch-action: pan-x;
        }

        .forecast-card {
            flex: 1;
            min-width: 68px;
            background: var(--card-inner);
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
        }

        .forecast-card .icon {
            font-size: 1.3rem;
            margin: 3px 0;
        }

        .forecast-card .max {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
        }

        .forecast-card .min {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .dashboard-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            align-items: center;
        }

        .sismos-container-block {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .sismos-table-wrapper {
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            touch-action: pan-y;
            margin-top: 8px;
            background: var(--card-inner);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tabla-sismos {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            text-align: center;
        }

        .tabla-sismos th {
            position: sticky;
            top: 0;
            background-color: #374151;
            color: #d1d5db;
            padding: 6px 4px;
            font-weight: 700;
        }

        .tabla-sismos td {
            padding: 6px 4px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        .sismo-mendoza {
            color: #ef4444 !important;
            font-weight: bold;
        }

        .sismo-normal {
            color: var(--accent);
        }

        .solar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--border);
            padding-left: 10px;
        }

        .solar-arc {
            position: relative;
            width: 110px;
            height: 55px;
            border: 2px dashed #374151;
            border-bottom: 2px solid #374151;
            border-radius: 55px 55px 0 0;
            margin-top: 8px;
        }

        .sun-pivot {
            position: absolute;
            width: 100%;
            height: 100%;
            bottom: 0;
            left: 0;
            transform-origin: bottom center;
            transition: transform 1s ease-out;
        }

        .sun-icon {
            position: absolute;
            left: -10px;
            bottom: -10px;
            font-size: 18px;
        }

        .solar-times {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .solar-times strong {
            color: var(--text-main);
            display: block;
        }

        .lunar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--border);
            padding-left: 10px;
        }

        .moon-display {
            font-size: 3.5rem;
            line-height: 1;
            margin: 4px 0;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        .moon-phase-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-main);
            text-align: center;
        }

        .moon-illumination {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 700;
            margin-top: 2px;
        }

        .polen-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .polen-card {
            background: var(--card-inner);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .polen-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .polen-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .polen-dias {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.75rem;
            text-align: left;
        }

        .polen-item {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dot-nivel {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .dot-ninguno { background-color: #9ca3af; }
        .dot-bajo { background-color: #22c55e; }
        .dot-medio { background-color: #facc15; }
        .dot-alto { background-color: #fb923c; }
        .dot-muyalto { background-color: #ef4444; }

        .embalses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .embalse-card {
            background: var(--card-inner);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .embalse-nombre {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .embalse-nivel {
            display: block;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-fill {
            background: var(--accent);
            height: 100%;
            border-radius: 3px;
        }

        .embalse-estado {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .embalse-estado.optimal { color: #22c55e; }
        .embalse-estado.warning { color: #f59e0b; }
        .embalse-estado.alert { color: #ef4444; }

        .dual-section {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 12px;
            align-items: stretch;
        }

        .grid-confort-termico {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .grid-agricola {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .glosario-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .glosario-item {
            background: var(--card-inner);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
        }

        .glosario-titulo {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
