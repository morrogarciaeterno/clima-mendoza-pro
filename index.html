<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Territoria Energy</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#071018;--p:#0b1722;--p2:#0e1c28;--line:#1f3545;--txt:#eaf4f8;--mut:#7f9aaa;--c:#24d6d0;--g:#31d67b;--a:#f4b544;--r:#ff5e68}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Inter,Arial,sans-serif;overflow:hidden}button,input,select{font:inherit}.app{height:100%;display:grid;grid-template-rows:64px 1fr 28px}header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#071018}.brand{font-weight:900;letter-spacing:.12em}.brand b{color:var(--c)}.status{font-size:11px;color:#bffbd8;border:1px solid var(--line);padding:8px 12px;border-radius:8px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:7px}.home{display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,rgba(36,214,208,.12),transparent 40%),var(--bg)}.hub{width:min(980px,94%);padding:32px;border:1px solid #24465a;border-radius:20px;background:linear-gradient(160deg,#0e1c28,#08121b);box-shadow:0 25px 70px #0008;text-align:center}.hub h1{font-size:40px;letter-spacing:.12em;margin:0}.hub h1 b{color:var(--c)}.hub p{color:var(--mut);letter-spacing:.16em;font-size:11px}.launch{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:28px}.launch button{padding:17px 12px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--p);color:var(--txt);cursor:pointer}.launch button:hover{border-color:var(--c);background:#112a39}.launch b{display:block;font-size:12px}.launch small{display:block;color:var(--mut);margin-top:7px;line-height:1.35}footer{display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-top:1px solid var(--line);font-size:9px;color:var(--mut)}.modal{position:fixed;inset:0;background:#03090edd;backdrop-filter:blur(6px);display:none;padding:14px;z-index:2000}.modal.open{display:grid}.window{width:100%;height:100%;display:grid;grid-template-rows:52px 1fr;border:1px solid #284b60;border-radius:14px;overflow:hidden;background:var(--p)}.head{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:#08141f}.head h2{font-size:13px;color:var(--c);letter-spacing:.1em;margin:0}.nav{display:flex;gap:7px}.nav button,.close{border:1px solid var(--line);border-radius:7px;background:var(--p2);color:var(--mut);padding:7px 10px;font-size:10px;cursor:pointer}.nav button:hover,.nav button.active{color:var(--c);border-color:var(--c)}.close:hover{color:#fff;border-color:var(--r)}.body{min-height:0;display:grid;grid-template-columns:1fr 420px;gap:10px;padding:10px}.map{height:100%;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#09141d}.side{min-height:0;overflow:auto;display:grid;grid-auto-rows:max-content;gap:10px}.card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,var(--p2),var(--p));overflow:hidden}.ch{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line)}.ch h3{font-size:10px;letter-spacing:.13em;color:#a8c0ce;margin:0}.ch span{font-size:9px;color:var(--mut)}.cb{padding:12px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters input,.filters select{width:100%;height:42px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#08141f;color:var(--txt)}.banner{padding:11px;border:1px solid #295368;background:#0b1e2b;border-radius:10px;margin-bottom:10px}.banner b{display:block;font-size:17px;color:#fff}.banner small{display:block;margin-top:4px;color:var(--a);font-size:9px;letter-spacing:.08em}.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.row{padding:7px 0;border-bottom:1px solid #2f4b5b88;display:flex;justify-content:space-between;gap:10px}.row span{font-size:10px;color:var(--mut)}.row b{font-size:10px;text-align:right;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{padding:10px;border:1px solid var(--line);border-radius:9px;background:#091823;min-width:0}.metric span{display:block;color:var(--mut);font-size:8px;letter-spacing:.08em}.metric strong{display:block;margin-top:6px;color:var(--txt);font-size:14px;overflow:hidden;text-overflow:ellipsis}.metric strong.c{color:var(--c)}.metric small{display:block;color:var(--mut);font-size:8px;margin-top:3px}.prod{margin-top:10px;padding:10px;border:1px solid #27566b;border-radius:10px;background:#071923}.prod-head{display:flex;justify-content:space-between;margin-bottom:9px}.prod-head b{font-size:10px;color:var(--c);letter-spacing:.1em}.prod-head span{font-size:10px;color:var(--a)}.prod-foot{font-size:9px;color:var(--mut);line-height:1.5;margin-top:8px}.loading{padding:25px;text-align:center;color:var(--mut)}.err{color:#ffc2c6}.duct-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.well-name{color:var(--c)!important;font-size:19px!important}.leaflet-container{background:#071018}.leaflet-control-attribution{background:#071018cc!important;color:#789!important}.leaflet-control-attribution a{color:var(--c)!important}@media(max-width:1000px){.launch{grid-template-columns:repeat(2,1fr)}.body{grid-template-columns:1fr}.side{max-height:45vh}.hub h1{font-size:28px}}
</style>
</head>
<body><div class="app"><header><div class="brand">TERRITORIA <b>ENERGY</b></div><div class="status"><i class="dot"></i><span id="apiStatus">API LISTA</span></div></header><main class="home"><div class="hub"><h1>TERRITORIA <b>ENERGY</b></h1><p>PLATAFORMA INTELIGENTE · CUENCA NEUQUINA Y VACA MUERTA</p><div class="launch"><button onclick="openModule('pozos')"><b>⌖ POZOS</b><small>Ficha técnica y producción declarada</small></button><button onclick="openModule('locaciones')"><b>◈ ACTIVOS</b><small>Locaciones y activos de superficie</small></button><button onclick="openModule('ductos')"><b>⌇ OLEODUCTOS</b><small>Ductos y líneas de conducción</small></button><button onclick="openModule('plantas')"><b>⬡ PLANTAS</b><small>Instalaciones y medición</small></button><button onclick="openModule('areas')"><b>▣ ÁREAS</b><small>Concesiones + producción real</small></button></div></div></main><footer><span>TERRITORIA ENERGY</span><span>GIS NEUQUÉN · RES. 319/93</span><span id="foot">SISTEMA LISTO</span></footer></div>
<div class="modal" id="modal"><div class="window"><div class="head"><h2 id="title">MÓDULO</h2><div class="nav"><button onclick="openModule('pozos')">POZOS</button><button onclick="openModule('locaciones')">ACTIVOS</button><button onclick="openModule('ductos')">OLEODUCTOS</button><button onclick="openModule('plantas')">PLANTAS</button><button onclick="openModule('areas')">ÁREAS</button><button class="close" onclick="closeModal()">✕ CERRAR</button></div></div><div class="body"><div id="map" class="map"></div><aside class="side"><section class="card"><div class="ch"><h3>FILTRO</h3><span id="count">0 ELEMENTOS</span></div><div class="cb"><div class="filters"><input id="search" placeholder="Buscar…"><select id="group"><option value="">Todos</option></select></div></div></section><section class="card"><div class="ch"><h3>DETALLE DEL ELEMENTO</h3><span id="layer">GIS</span></div><div class="cb" id="detail"><div class="loading">Selecciona un elemento en el mapa.</div></div></section></aside></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API='https://territoria-energy-api.elexpreso17.workers.dev';let map,groupLayer,current='areas',raw=[],wellMode=false;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
function closeModal(){$('modal').classList.remove('open')}function navActive(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent.trim()===({pozos:'POZOS',locaciones:'ACTIVOS',ductos:'OLEODUCTOS',plantas:'PLANTAS',areas:'ÁREAS'}[current])))}
function initMap(){if(map)return;map=L.map('map',{preferCanvas:true}).setView([-38.4,-69.1],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);groupLayer=L.layerGroup().addTo(map)}
async function openModule(type){current=type;wellMode=type==='pozos';$('modal').classList.add('open');$('title').textContent=({pozos:'PADRÓN DE POZOS · NEUQUÉN',locaciones:'ACTIVOS · NEUQUÉN',ductos:'OLEODUCTOS Y LÍNEAS DE CONDUCCIÓN',plantas:'PLANTAS E INSTALACIONES',areas:'ÁREAS Y CONCESIONES · PRODUCCIÓN REAL'}[type]);navActive();initMap();setTimeout(()=>map.invalidateSize(),80);$('detail').innerHTML='<div class="loading">Consultando fuente oficial…</div>';try{const u=wellMode?API+'/api/pozos?inicio=0&limite=2000':API+'/api/infraestructura?tipo='+type;const r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Sin respuesta');raw=wellMode?(j.registros||[]).map(x=>({type:'Feature',geometry:x.geometria,properties:{...(x.datos||{}),_id:x.id}})):(j.features||[]);$('layer').textContent=j.layer||type.toUpperCase();buildGroups();render(true);$('apiStatus').textContent='API ONLINE · NEUQUÉN'}catch(e){$('detail').innerHTML='<div class="loading err">'+esc(e.message)+'</div>'}}
function props(f){return f.properties||{}}function titleOf(p){return p.WELL_NAME||p.SIGLA_NACION||p.NOMBRE||p.LOC_NOMBRE||p.YACIMIENTO||p.OPERADOR||p.CAPA||'Elemento GIS'}function operatorOf(p){return p.OPERADOR||p.OPERADORA||p.EMPRESA||p.TITULAR||''}function buildGroups(){let a=[...new Set(raw.map(f=>operatorOf(props(f))).filter(Boolean))].sort();$('group').innerHTML='<option value="">Todos</option>'+a.map(x=>'<option>'+esc(x)+'</option>').join('')}
$('search').oninput=()=>render(false);$('group').onchange=()=>render(false);
function render(fit){groupLayer.clearLayers();const q=$('search').value.toLowerCase(),g=$('group').value;let list=raw.filter(f=>{const p=props(f);return(!g||operatorOf(p)===g)&&(!q||Object.values(p).some(v=>String(v||'').toLowerCase().includes(q)))});$('count').textContent=list.length+' ELEMENTOS';const bounds=[];const gj=L.geoJSON({type:'FeatureCollection',features:list},{style:f=>{const p=props(f),gas=/GAS/.test(String(p.FLUIDO||p.TIPO||'').toUpperCase());return{color:gas?'#f4b544':'#24d6d0',weight:current==='ductos'?3:2,fillColor:'#24d6d0',fillOpacity:.15}},pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:'#fff',weight:1,fillColor:'#24d6d0',fillOpacity:.9}),onEachFeature:(f,l)=>{l.on('click',()=>show(f));if(l.getBounds&&l.getBounds().isValid())bounds.push(l.getBounds().getCenter())}}).addTo(groupLayer);if(fit&&gj.getBounds().isValid())map.fitBounds(gj.getBounds(),{padding:[30,30],maxZoom:12});$('detail').innerHTML='<div class="loading">Selecciona un elemento en el mapa.</div>'}
function row(k,v){if(v===null||v===undefined||String(v).trim()===''||String(v).trim()==='0')return'';return`<div class="row"><span>${esc(k)}</span><b title="${esc(v)}">${esc(v)}</b></div>`}function formatNum(v){return Number(v).toLocaleString('es-AR',{maximumFractionDigits:2})}function stamp(v){if(!v)return'Sin dato';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('es-AR')}
async function show(f){const p={...props(f)},t=titleOf(p),sub=[p.ID_NQN,p.ID_DUCTO,p.LOC_ID,p.CAPA].filter(Boolean).join(' · ');if(current==='areas'){const keys=[['ID Neuquén',p.ID_NQN],['Nombre',p.NOMBRE],['Bloque',p.BLOQUE],['Tipo de área',p.TIPO_AREA||p.TIPO],['Titular',p.TITULAR],['Operador',p.OPERADOR],['Superficie legal',p.SUP_LEGAL||p.SUPERFICIE],['Participación',p.PARTICIPACION],['Tipo de contrato',p.TIPO_CONTRATO],['Norma legal',p.NORMA_LEGAL],['Inicio contrato',p.INICIO_CONTRATO],['Fin contrato',p.FIN_CONTRATO],['Mensura',p.MENSURA],['Observaciones',p.OBSERVACIONES]];$('detail').innerHTML=`<div class="banner"><b>${esc(t)}</b><small>${esc(sub||'ÁREA GIS · NEUQUÉN')}</small></div><div class="kv">${keys.map(x=>row(...x)).join('')}</div><div id="areaProd" class="prod"><div class="loading">Consultando producción real del área…</div></div>`;await loadArea(p.NOMBRE||p.AREA||p.BLOQUE||t);return}if(current==='ductos'){const keys=[['ID ducto',p.ID_DUCTO],['Operador',operatorOf(p)],['Concesión',p.CONCESION],['Otorgado',p.OTORGADO],['Desde',p.DESDE||p.ORIGEN],['Hasta',p.HASTA||p.DESTINO],['Recibe de',p.RECIBE_DE||p.RECIBE],['Entrega a',p.ENTREGA_A||p.ENTREGA],['Fluido',p.FLUIDO],['Tipo',p.TIPO],['Tramo',p.TRAMO],['Diámetro',p.DIAMETRO],['Espesor',p.ESPESOR],['Material',p.MATERIAL],['Tendido',p.TENDIDO],['Profundidad',p.PROFUNDIDAD||p.PROF],['Revestimiento exterior',p.REVESTIMIENTO_EXTERIOR||p.REV_EXT],['Revestimiento interior',p.REVESTIMIENTO_INTERIOR||p.REV_INT]];$('detail').innerHTML=`<div class="banner"><b>${esc(t)}</b><small>${esc(sub||'DUCTO · GIS')}</small></div><div class="metrics"><div class="metric"><span>OPERADOR</span><strong>${esc(operatorOf(p)||'Sin dato')}</strong></div><div class="metric"><span>FLUIDO</span><strong class="c">${esc(p.FLUIDO||'Sin dato')}</strong></div><div class="metric"><span>TIPO</span><strong>${esc(p.TIPO||'Sin dato')}</strong></div></div><div class="duct-grid">${keys.map(x=>row(...x)).join('')}</div>`;return}if(wellMode){showWell(p);return}let entries=Object.entries(p).filter(([,v])=>v!==null&&v!==''&&String(v).trim()!=='').slice(0,28);$('detail').innerHTML=`<div class="banner"><b>${esc(t)}</b><small>${esc(sub||'GIS · NEUQUÉN')}</small></div><div class="kv">${entries.map(([k,v])=>row(k,v)).join('')}</div>`}
async function loadArea(name){const box=$('areaProd');try{const r=await fetch(API+'/api/produccion/areas?area='+encodeURIComponent(name),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Error');const a=j.area;if(!a||!a.periodo){box.innerHTML='<div class="loading">Sin declaraciones asociadas a esta área.</div>';return}box.innerHTML=`<div class="prod-head"><b>PRODUCCIÓN DEL ÁREA</b><span>${esc(a.periodo)}</span></div><div class="metrics"><div class="metric"><span>PETRÓLEO</span><strong class="c">${formatNum(a.petroleo_m3)}</strong><small>m³/mes</small></div><div class="metric"><span>GAS</span><strong>${formatNum(a.gas_miles_m3)}</strong><small>miles m³/mes</small></div><div class="metric"><span>AGUA</span><strong>${formatNum(a.agua_m3)}</strong><small>m³/mes</small></div></div><div class="prod-foot"><b>${formatNum(a.cantidad_pozos)} pozos incluidos</b><br>Operadora/s: ${esc((a.empresas||[]).join(', ')||'Sin dato')}<br>Actualización de fuente: ${esc(stamp(a.fecha_actualizacion))}<br>Fuente: ${esc(a.fuente||j.recurso||'Capítulo IV')}</div>`}catch(e){box.innerHTML='<div class="loading err">'+esc(e.message)+'</div>'}}
async function showWell(p){const name=p.WELL_NAME||p.UWI_NQN||'Pozo seleccionado';$('detail').innerHTML=`<div class="banner"><b class="well-name">${esc(name)}</b><small>${esc(p.YACIMIENTO||p.FIELD_NAME||'GIS NEUQUÉN')} · ${esc(operatorOf(p)||'Sin operadora')}</small></div><div id="wellProd" class="prod"><div class="loading">Consultando producción declarada…</div></div><div class="kv">${[['UWI Neuquén',p.UWI_NQN],['UWI Nación',p.UWI_SEN],['Estado',p.ESTADO_GIS],['Operadora',p.OPERADOR],['Área',p.AREA_LEGAL],['Yacimiento',p.YACIMIENTO],['Formación',p.FORM_PROD],['Reservorio',p.RESERVORIO],['Profundidad',p.PROFUNDIDAD_MEDIDA],['Sistema extracción',p.SIST_EXTRACCION]].map(x=>row(...x)).join('')}</div>`;const sigla=p.WELL_NAME||p.SIGLA_NACION||'',id=p.UWI_SEN||'';try{const qs=new URLSearchParams();if(sigla)qs.set('sigla',sigla);if(id)qs.set('idpozo',id);const r=await fetch(API+'/api/produccion?'+qs),j=await r.json(),a=j.ultimo_mes;if(!a)throw Error('Sin declaración productiva');$('wellProd').innerHTML=`<div class="prod-head"><b>PRODUCCIÓN DECLARADA</b><span>${String(a.mes).padStart(2,'0')}/${a.anio}</span></div><div class="metrics"><div class="metric"><span>PETRÓLEO</span><strong class="c">${formatNum(a.prod_pet)}</strong><small>m³/mes</small></div><div class="metric"><span>GAS</span><strong>${formatNum(a.prod_gas)}</strong><small>miles m³/mes</small></div><div class="metric"><span>AGUA</span><strong>${formatNum(a.prod_agua)}</strong><small>m³/mes</small></div></div><div class="prod-foot">Empresa declarada: ${esc(a.empresa||'Sin dato')} · Estado: ${esc(a.tipoestado||'Sin dato')} · TEF: ${esc(a.tef||'Sin dato')}</div>`}catch(e){$('wellProd').innerHTML='<div class="loading err">'+esc(e.message)+'</div>'}}
fetch(API+'/health').then(r=>r.json()).then(j=>{$('apiStatus').textContent=j.ok?'API ONLINE · NEUQUÉN':'API SIN RESPUESTA'}).catch(()=>{$('apiStatus').textContent='API SIN RESPUESTA';document.querySelector('.dot').style.background='var(--r)'})
</script></body></html>
