<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Territoria Upstream Mobile | Nova Territoria</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --border-color: rgba(56, 189, 248, 0.25);
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      position: relative;
    }

    /* HEADER MÓVIL COMPACTO */
    header {
      background: #0b111e;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px;
      z-index: 1000;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 7px;
      border-radius: 5px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .brand-title span {
      color: var(--accent-amber);
    }

    .demo-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
    }

    /* SELECTOR DE SECTORES SCROLLABLE */
    .sector-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .sector-bar::-webkit-scrollbar { display: none; }

    .sector-btn {
      flex: 0 0 auto;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .sector-btn.active {
      background: rgba(14, 165, 233, 0.22);
      border-color: var(--accent-cyan);
      color: #fff;
      font-weight: 600;
    }

    /* MAPA PRINCIPAL */
    .map-stage {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    #map {
      height: 100%;
      width: 100%;
      background: var(--bg-dark);
    }

    /* TIRA DE KPIs DESLIZABLE SOBRE EL MAPA */
    .kpi-carousel {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 800;
    }
    .kpi-carousel::-webkit-scrollbar { display: none; }

    .kpi-card {
      flex: 0 0 132px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .kpi-label {
      font-size: 9.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .kpi-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    .kpi-sub {
      font-size: 10px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .up { color: var(--accent-emerald); }
    .warn { color: var(--accent-amber); }

    /* BOTONES FLOTANTES TÁCTILES (CAPAS / FICHA / ALERTAS) */
    .fab-stack {
      position: absolute;
      right: 12px;
      bottom: 84px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 850;
    }

    .fab-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .fab-btn.active {
      border-color: var(--accent-cyan);
      background: rgba(14, 165, 233, 0.3);
    }

    /* PANEL FLOTANTE DE CAPAS */
    .layers-drawer {
      position: absolute;
      left: 12px;
      bottom: 84px;
      width: 235px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      z-index: 860;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .layers-drawer.open {
      display: block;
    }

    .drawer-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 12.5px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }
    .layer-row:last-child { border-bottom: none; }

    .layer-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-cyan);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 7px;
    }

    /* BOTTOM SHEET DESLIZABLE / PLEGABLE */
    .bottom-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      border-radius: 16px 16px 0 0;
      z-index: 900;
      max-height: 76dvh;
      display: flex;
      flex-direction: column;
      transform: translateY(calc(100% - 68px));
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.65);
    }

    .bottom-sheet.expanded {
      transform: translateY(0);
    }

    .sheet-handle-bar {
      padding: 8px 14px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      flex-shrink: 0;
    }

    .pill-grip {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.45);
      margin-bottom: 8px;
    }

    .sheet-peek-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .peek-well-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .peek-well-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .peek-rate {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-emerald);
      background: rgba(
