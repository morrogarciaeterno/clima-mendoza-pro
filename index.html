<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Territoria Energy</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#071018;--p:#0b1722;--p2:#0e1c28;--line:#1f3545;--txt:#eaf4f8;--mut:#7f9aaa;--c:#24d6d0;--g:#31d67b;--a:#f4b544;--r:#ff5e68}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Inter,Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit}
.app{height:100%;display:grid;grid-template-rows:64px 1fr 28px}
header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#071018}
.brand{font-weight:900;letter-spacing:.12em;display:flex;align-items:center;gap:10px}
.brand-logo{width:44px;height:44px;flex:0 0 44px}
.brand-logo svg{width:100%;height:100%;display:block}
.hero-logo{width:180px;height:180px;margin:0 auto 10px}
.hero-logo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 24px rgba(0,0,0,.55))}
.brand b{color:var(--c)}
.status{font-size:11px;color:#bffbd8;border:1px solid var(--line);padding:8px 12px;border-radius:8px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:7px}
.home{display:grid;place-items:stretch;padding:12px;background:radial-gradient(circle at 50% 25%,rgba(36,214,208,.12),transparent 40%),var(--bg)}
.hub{width:100%;height:100%;padding:24px 32px;border:1px solid #24465a;border-radius:20px;background:linear-gradient(160deg,#0e1c28,#08121b);box-shadow:0 25px 70px #0008;text-align:center;display:flex;flex-direction:column;justify-content:center}
.hub h1{font-size:42px;letter-spacing:.12em;margin:0}
.hub h1 b{color:var(--c)}
.hub p{color:var(--mut);letter-spacing:.16em;font-size:12px}

.basin-selector{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1280px;width:100%;margin:24px auto 0}
.basin-card{display:flex;flex-direction:column;justify-content:space-between;padding:20px 18px;text-align:left;border:1px solid #25485c;border-radius:16px;background:linear-gradient(160deg,#0f2230,#091520);color:var(--txt);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.basin-card:hover{border-color:var(--c);background:#122c3c;transform:translateY(-2px)}
.basin-card .b-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.basin-card .b-tag{font-size:8.5px;font-weight:800;letter-spacing:.1em;padding:4px 7px;border-radius:6px;background:#081822;border:1px solid #234659;color:var(--c);white-space:nowrap}
.basin-card b{display:block;font-size:17px;letter-spacing:.06em;margin-top:14px;color:#fff}
.basin-card small{display:block;color:var(--mut);font-size:11px;margin-top:6px;line-height:1.45}
.basin-card .b-foot{margin-top:16px;padding-top:10px;border-top:1px solid #1f3545;font-size:10px;font-weight:700;color:var(--c);display:flex;justify-content:space-between;align-items:center}

.basin-view{display:none;flex-direction:column;align-items:center;width:100%;max-width:1280px;margin:0 auto}
.basin-view.active{display:flex}
.basin-topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;margin-bottom:18px;border:1px solid #25485c;border-radius:12px;background:#091823}
.basin-topbar-left{display:flex;align-items:center;gap:12px;text-align:left}
.basin-topbar-left b{display:block;font-size:16px;letter-spacing:.08em;color:var(--c)}
.basin-topbar-left small{display:block;font-size:10px;color:var(--mut);letter-spacing:.1em}
.back-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--p2);color:var(--txt);font-size:10px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.back-btn:hover{border-color:var(--c);color:var(--c)}

.launch{width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:stretch;gap:12px}
.launch.cuyana-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
.launch.rn-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.launch button{display:flex;flex-direction:column;justify-content:flex-start;height:100%;min-height:118px;min-width:0;padding:18px 14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--p);color:var(--txt);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.launch button:hover{border-color:var(--c);background:#112a39;transform:translateY(-1px)}
.btn-top{display:flex;align-items:center;gap:8px;min-width:0}
.btn-ico{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;background:#091c27;border:1px solid #234659;color:var(--c)}
.btn-ico svg{width:16px;height:16px;display:block}
.launch b{display:block;font-size:12px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.launch small{display:block;color:var(--mut);font-size:10.5px;margin-top:8px;line-height:1.35}

footer{display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-top:1px solid var(--line);font-size:9px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#03090edd;backdrop-filter:blur(6px);display:none;padding:14px;z-index:2000}
.modal.open{display:grid}
.window{width:100%;height:100%;display:grid;grid-template-rows:52px 1fr;border:1px solid #284b60;border-radius:14px;overflow:hidden;background:var(--p)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#08141f}
.head h2{font-size:13px;color:var(--c);letter-spacing:.1em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:6px;flex-shrink:0}
.close{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;background:var(--p2);color:var(--mut);padding:7px 10px;font-size:10px;white-space:nowrap;cursor:pointer}
.close svg{width:12px;height:12px;flex:0 0 12px}
.close:hover{color:#fff;border-color:var(--r)}
.body{min-height:0;display:grid;grid-template-columns:1fr 450px;gap:10px;padding:10px}
.body.stats-mode{grid-template-columns:1fr}
.body.stats-mode .map{display:none}
.map{height:100%;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#09141d}
.side{min-height:0;height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,var(--p2),var(--p));flex-shrink:0}
.ch{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line)}
.ch h3{font-size:10px;letter-spacing:.13em;color:#a8c0ce;margin:0}
.ch span{font-size:9px;color:var(--mut)}
.cb{padding:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input,.filters select{width:100%;height:42px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#08141f;color:var(--txt)}
.banner{padding:11px;border:1px solid #295368;background:#0b1e2b;border-radius:10px;margin-bottom:10px}
.banner b{display:block;font-size:17px;color:#fff;overflow-wrap:anywhere}
.banner small{display:block;margin-top:4px;color:var(--a);font-size:9px;letter-spacing:.08em;overflow-wrap:anywhere}
.kv,.duct-grid{display:grid;grid-template-columns:1fr;gap:0}
.row{padding:6px 0;border-bottom:1px solid #2f4b5b88;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-width:0}
.row span{font-size:10px;color:var(--mut);flex:0 0 auto}
.row b{font-size:10px;text-align:right;min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.metric{padding:10px;border:1px solid var(--line);border-radius:9px;background:#091823;min-width:0}
.metric span{display:block;color:var(--mut);font-size:8px;letter-spacing:.08em}
.metric strong{display:block;margin-top:6px;color:var(--txt);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metric strong.c{color:var(--c)}
.metric strong.a{color:var(--a)}
.metric small{display:block;color:var(--mut);font-size:8px;margin-top:3px}
.delta-up{color:var(--g)!important}
.delta-down{color:var(--r)!important}
.delta-flat{color:var(--mut)!important}
.prod{margin-top:10px;padding:10px;border:1px solid #27566b;border-radius:10px;background:#071923}
.prod-head{display:flex;justify-content:space-between;margin-bottom:9px}
.prod-head b{font-size:10px;color:var(--c);letter-spacing:.1em}
.prod-head span{font-size:10px;color:var(--a)}
.prod-foot{font-size:9px;color:var(--mut);line-height:1.5;margin-top:8px}
.native-cta{width:100%;margin-top:9px;height:34px;border:1px solid var(--c);border-radius:8px;background:#0b2433;color:var(--c);font-size:10px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.native-cta:hover{background:#12364a;color:#fff}
.loading{padding:25px;text-align:center;color:var(--mut)}
.err{color:#ffc2c6}
.duct-grid{margin-top:6px}
.route-box{margin:8px 0 10px;padding:9px 11px;border:1px solid #27566b;border-radius:9px;background:#071923;font-size:10px;line-height:1.5}
.route-box div{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:2px 0}
.route-box span{color:var(--mut);flex:0 0 auto}
.route-box b{color:#eaf4f8;text-align:right;min-width:0;overflow-wrap:anywhere}
.well-name{color:var(--c)!important;font-size:19px!important}
.legend-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:#091823;font-size:9px;color:var(--mut)}
.legend-bar button{background:none;border:0;cursor:pointer;font-size:9px;font-weight:700;padding:2px 4px;display:inline-flex;align-items:center;gap:5px}
.dot-lg{width:8px;height:8px;border-radius:50%;display:inline-block}
.subtabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 10px}
.subtabs button{min-height:38px;height:auto;border:1px solid var(--line);border-radius:8px;background:#091823;color:var(--mut);cursor:pointer;font-weight:800;font-size:9.5px;padding:6px 8px;line-height:1.15;white-space:normal;display:flex;align-items:center;justify-content:center;text
