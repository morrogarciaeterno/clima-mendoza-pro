<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Territoria · SMN Mendoza prueba</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#07111f;color:#e7edf6;font:14px Segoe UI,Arial}.app{max-width:1100px;margin:auto}.card{background:#101d31;border:1px solid #293b55;border-radius:14px;padding:15px;margin-bottom:10px}.head{background:linear-gradient(135deg,#102b49,#153f68)}.muted{color:#9baac0;font-size:11px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls button{padding:9px;border:1px solid #3b82f6;border-radius:8px;background:#172554;color:#fff}.controls input{flex:1;min-width:260px}.controls button{cursor:pointer}.green{background:#14532d;border-color:#22c55e!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}.st{background:#0c1728;border:1px solid #22d3ee;border-left:5px solid #22d3ee;border-radius:12px;padding:12px}.big{font-size:25px;font-weight:900;color:#67e8f9}.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #293b55;gap:8px}#map{height:410px;border-radius:12px;background:#0f172a}.err{color:#fca5a5}.ok{color:#86efac}@media(max-width:600px){#map{height:330px}}</style></head><body><main class="app"><section class="card head"><h2>🌤️ TERRITORIA · Estaciones oficiales Mendoza</h2><div class="muted">Prueba geolocalizada con Mendoza Aero, Mendoza Observatorio, San Martín, San Rafael, Malargüe y Uspallata.</div></section><section class="card"><div class="controls"><input id="rapidKey" type="password" placeholder="RapidAPI key"><button class="green" onclick="start()">📍 Consultar cerca de mi GPS</button></div><div class="muted" id="status" style="margin-top:8px">Esperando API key…</div></section><section class="card"><div id="map"></div></section><section id="grid" class="grid"></section></main><script>
const ST=[['87418','Mendoza Aero',-32.8437,-68.796358],['87420','Mendoza Observatorio',-32.894736,-68.872755],['87416','San Martín Mza',-33.073319,-68.464804],['87509','San Rafael Aero',-34.590836,-68.401642],['87506','Malargüe Aero',-35.481209,-69.583357],['87405','Uspallata Aero',-32.594583,-69.340084]].map(([id,name,lat,lon])=>({id,name,lat,lon}));let lat=-32.89,lon=-68.84,map,marks=[];const $=x=>document.getElementById(x);function d(a,b,c,e){const R=6371,x=(c-a)*Math.PI/180,y=(e-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function leaflet(){return new Promise((ok,no)=>{if(window.L)return ok();let c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);let s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}async function mapInit(){await leaflet();if(!map){map=L.map('map').setView([lat,lon],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map)}marks.forEach(x=>map.removeLayer(x));marks=[];marks.push(L.circleMarker([lat,lon],{radius:9,color:'#fff',fillColor:'#2563eb',fillOpacity:1,weight:3}).addTo(map).bindPopup('📍 Mi GPS'))}async function start(){const key=$('rapidKey').value.trim();if(!key)return $('status').innerHTML='<span class="err">Pega tu RapidAPI key.</span>';localStorage.setItem('argweather_rapid_key',key);navigator.geolocation.getCurrentPosition(async p=>{lat=p.coords.latitude;lon=p.coords.longitude;await mapInit();query(key)},async()=>{await mapInit();query(key)},{enableHighAccuracy:true,timeout:10000})}async function one(st,key){const url='https://argentina-real-time-weather.p.rapidapi.com/ArgWeatherAnalytics?wmo_id='+st.id,r=await fetch(url,{headers:{'X-RapidAPI-Key':key,'X-RapidAPI-Host':'argentina-real-time-weather.p.rapidapi.com'},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function query(key){$('status').textContent='Consultando estaciones…';const near=ST.map(x=>({...x,km:d(lat,lon,x.lat,x.lon)})).sort((a,b)=>a.km-b.km);const arr=await Promise.all(near.map(async st=>{try{return{st,j:await one(st,key)}}catch(e){return{st,error:e.message}}}));$('status').innerHTML='<span class="ok">Consulta finalizada.</span>';$('grid').innerHTML=arr.map(({st,j,error})=>{if(error)return `<div class="st"><b>${esc(st.name)}</b><div class="muted">${st.km.toFixed(1)} km</div><p class="err">${esc(error)}</p></div>`;const x=j?.data??j;return `<div class="st"><b>${esc(st.name)}</b><div class="muted">WMO ${st.id} · ${st.km.toFixed(1)} km</div><div class="big">${esc(x.temperatura??x.temperature??x.temp??'--')} °C</div><div class="row"><span>Humedad</span><b>${esc(x.humedad??x.humidity??'--')}</b></div><div class="row"><span>Presión</span><b>${esc(x.presion??x.pressure??'--')}</b></div><div class="row"><span>Viento</span><b>${esc(x.viento??x.wind??x.wind_speed??'--')}</b></div><div class="row"><span>Tiempo</span><b>${esc(x.tiempo??x.weather??'--')}</b></div><div class="muted" style="margin-top:6px">${esc(x.fecha_hora??x.datetime??x.timestamp??'')}</div></div>`}).join('');near.forEach(st=>marks.push(L.circleMarker([st.lat,st.lon],{radius:7,color:'#22d3ee',fillColor:'#22d3ee',fillOpacity:.9}).addTo(map).bindPopup(`<b>${esc(st.name)}</b><br>WMO ${st.id}<br>${st.km.toFixed(1)} km del GPS`)));map.fitBounds(L.featureGroup(marks).getBounds().pad(.15))}$('rapidKey').value=localStorage.getItem('argweather_rapid_key')||'';mapInit();
</script></body></html>
