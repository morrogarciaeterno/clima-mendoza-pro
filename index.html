<style>
*{box-sizing:border-box}:root{--bg:#07111f;--panel:#0d1829;--line:#2b3d56;--text:#eaf2fb;--muted:#91a5bd;--orange:#f59e0b;--red:#ef4444;--green:#16a34a;--blue:#3b82f6}html{color-scheme:dark}body{margin:0;min-height:100vh;padding:12px;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif}.app{max-width:1550px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}.header{background:linear-gradient(135deg,#10253e,#123757)}h1,h2{margin:0}.header h1{color:#63cbea;font-size:22px}.sub{color:var(--muted);font-size:11px}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid #276d45;border-radius:999px;background:#0b3825;color:#8ce5ac;font-size:10px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.btn{padding:8px 11px;border:1px solid #3b587b;border-radius:7px;background:#14243b;color:#edf5ff;cursor:pointer;font-weight:650}.btn.green{border-color:#2c8252;background:#123d29}.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.three{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.station-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}.station-title{font-size:15px;font-weight:750}.station-code{color:var(--muted);font-size:10px;margin-top:3px}.station-temp{font-size:34px;font-weight:780;letter-spacing:-1px}.distance{color:#b9c8d9;font-size:11px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.tile{min-height:68px;padding:9px;border:1px solid #283c56;border-radius:8px;background:#0a1525}.tile label{display:block;color:#8fa6be;font-size:9px;text-transform:uppercase;letter-spacing:.5px}.tile strong{display:block;margin-top:7px;color:#f5f8fc;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid #26384f;color:var(--muted);font-size:9px}.off{color:#ffcf6b!important}.modal{display:none;position:fixed;inset:0;z-index:1000;padding:16px;background:#020711e8;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{width:min(1450px,98vw);height:min(900px,95vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid #4a5f7b;border-radius:13px;background:#081322}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.modal-body{padding:12px;overflow:auto}.filters{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-bottom:9px}.select,.range-btn,.model-btn{padding:7px 10px;border:1px solid #344d6b;border-radius:6px;background:#101c2e;color:#d8e4f2}.range-btn,.model-btn{cursor:pointer}.range-btn.active,.range-btn.now-active{border-color:#38bdf8;background:#123348;color:#bdefff}.model-btn.active[data-series="weatherapi"]{border-color:var(--orange);color:#fbbf24}.model-btn.active[data-series="openmeteo"]{border-color:var(--red);color:#fca5a5}.model-btn.active[data-series="ecmwf"]{border-color:var(--blue);color:#93c5fd;background:#0b1f3a}.model-btn.active[data-series="average"]{border-color:#a855f7;color:#d8b4fe;background:#25113b}.model-btn.active[data-series="territoria"]{border-color:var(--green);color:#4ade80;background:#0b2f1b}.chart-card{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1728}.chart-title{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.chart-wrap{height:390px;overflow:hidden}.chart-wrap svg{width:100%;height:100%;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:18px;height:3px;margin-right:5px;vertical-align:middle}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metric{padding:10px;border:1px solid #293d56;border-radius:8px;background:#0c192a}.metric label{display:block;color:var(--muted);font-size:9px}.metric strong{display:block;margin-top:5px;font-size:17px}.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)}@media(max-width:1100px){.three{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:680px){body{padding:7px}.three{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}.modal{padding:4px}.modal-box{width:100vw;height:100vh;border-radius:0}.chart-wrap{height:320px}}

/* Variables alineadas de forma identica en los cinco paneles */
.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-auto-rows:68px;gap:8px!important;margin-top:12px!important}
.cell{min-width:0;height:68px;display:flex;flex-direction:column;justify-content:center;padding:8px!important}

.station-temp{min-height:49px;display:flex;align-items:flex-end}.distance{min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.station-head{min-height:54px;align-items:flex-start}.station-code{min-height:28px;line-height:13px}
@media(max-width:1250px){main{grid-template-columns:repeat(3,minmax(0,1fr))!important}}@media(max-width:800px){main{grid-template-columns:1fr!important}.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}}

/* Paneles principales sin descripcion secundaria */
main .station-code, main .distance{display:none!important}
main .station-head{min-height:38px!important}

/* Mostrar completas todas las variables, sin recortes */
main{grid-template-columns:repeat(5,minmax(260px,1fr))!important;overflow-x:auto;padding-bottom:8px}

.cell{height:auto!important;min-height:72px!important;overflow:visible!important}
.cell label{height:auto!important;min-height:15px!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;font-size:8px!important}
.cell strong{height:auto!important;min-height:27px!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;font-size:12px!important;word-break:normal}
@media(max-width:1250px){main{grid-template-columns:repeat(2,minmax(300px,1fr))!important;overflow-x:visible}}
@media(max-width:800px){main{grid-template-columns:1fr!important}.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.cell strong{font-size:13px!important}}

<body>
<main class="app">
<section class="panel header"><div><h1>MODELO TERRITORIA IA</h1><div class="sub">Open-Meteo Best Match + WeatherAPI + ECMWF + aprendizaje local</div></div><span class="status" id="globalStatus"><span class="dot"></span> INICIANDO</span></section>
<section class="panel toolbar"><div><strong>Panel meteorológico</strong><div class="sub" id="lastGlobal">Última actualización: --</div><div class="sub" id="gpsText">Ubicación: esperando GPS</div></div><div class="group"><button class="btn green" onclick="refreshAll()">↻ Actualizar</button><button class="btn" onclick="openHistory()">📊 Históricos</button></div></section>
<section class="three"><article class="panel" id="openMeteoCard"></article><article class="panel" id="weatherApiCard"></article><article class="panel" id="ecmwfCard"></article><article class="panel" id="averageCard"></article><article class="panel" id="aiCard"></article></section>
</main>
<div class="modal" id="historyModal"><div class="modal-box"><div class="modal-head"><div><h2>Historial del Modelo Territoria IA</h2><div class="sub" id="rangeText">Últimos 7 días</div></div><button class="btn" onclick="closeHistory()">✕ Cerrar</button></div><div class="modal-body"><div class="filters"><select class="select" id="variableSelect" onchange="drawHistory()"><option value="temperature">Temperatura</option><option value="feels">Sensación térmica</option><option value="humidity">Humedad</option><option value="wind">Viento</option><option value="pressure">Presión</option><option value="visibility">Visibilidad</option><option value="cloud">Nubosidad</option><option value="precipitation">Precipitación</option></select><div class="group"><button class="range-btn" onclick="shiftRange(-1)">◀</button><button class="range-btn active" data-range="7" onclick="setRange(7,this)">7D</button><button class="range-btn" data-range="14" onclick="setRange(14,this)">14D</button><button class="range-btn" data-range="31" onclick="setRange(31,this)">31D</button><button class="range-btn" data-range="1M" onclick="setRange('1M',this)">1M</button><button class="range-btn" data-range="3M" onclick="setRange('3M',this)">3M</button><button class="range-btn" data-range="6M" onclick="setRange('6M',this)">6M</button><button class="range-btn" data-range="1Y" onclick="setRange('1Y',this)">1A</button><button class="range-btn" data-range="ALL" onclick="setRange('ALL',this)">TODO</button><button class="range-btn" onclick="shiftRange(1)">▶</button><button class="range-btn" id="nowBtn" onclick="goNow(event)">● AHORA</button></div><div class="group"><button class="model-btn active" data-series="weatherapi" onclick="toggleSeries(this)">● WEATHERAPI</button><button class="model-btn active" data-series="openmeteo" onclick="toggleSeries(this)">● OPEN-METEO</button><button class="model-btn active" data-series="ecmwf" onclick="toggleSeries(this)">● ECMWF</button><button class="model-btn active" data-series="average" onclick="toggleSeries(this)">● TERRITORIA MATEMÁTICA</button><button class="model-btn active" data-series="territoria" onclick="toggleSeries(this)">● MODELO TERRITORIA IA</button></div></div><section class="chart-card"><div class="chart-title"><strong id="chartTitle">Temperatura</strong><div class="legend"><span><i style="background:#f59e0b"></i>WeatherAPI</span><span><i style="background:#ef4444"></i>Open-Meteo</span><span><i style="background:#3b82f6"></i>ECMWF</span><span><i style="background:#a855f7"></i>Territoria Matemática</span><span><i style="background:#16a34a"></i>Modelo Territoria IA</span></div></div><div class="chart-wrap" id="mainChart"></div></section><section class="metrics" id="historyMetrics"></section></div></div></div>
<script>
// ===== FIRESTORE COMPARTIDO: NOTEBOOK + ANDROID =====
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDWWxho-0WaxgsYcE6i4oa9I9F2xJ5eZ_s",
  authDomain:"modelo-territoria-ia.firebaseapp.com",
  projectId:"modelo-territoria-ia",
  storageBucket:"modelo-territoria-ia.firebasestorage.app",
  messagingSenderId:"127019007898",
  appId:"1:127019007898:web:1addbf9f583c73cee38423"
};
const FIRESTORE_COLLECTION='territoria_meteo_historial';
let firestoreDb=null,firestoreReady=false,cloudSyncing=false;
async function initFirestore(){
 try{
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  firestoreDb=firebase.firestore();
  firestoreReady=true;
  await loadCloudHistory();
  return true;
 }catch(e){console.error('Firestore init:',e);firestoreReady=false;return false}
}
function mergeHistoryRows(rows){
 const map=new Map(history.map(x=>[x.id,x]));
 rows.forEach(x=>{if(x&&x.id)map.set(x.id,{...(map.get(x.id)||{}),...x})});
 history=[...map.values()].sort((a,b)=>new Date(a.observedAt)-new Date(b.observedAt)).slice(-20000);
 saveHistory();
}
async function loadCloudHistory(){
 if(!firestoreReady||cloudSyncing)return;
 cloudSyncing=true;
 try{
  const snap=await firestoreDb.collection(FIRESTORE_COLLECTION).orderBy('observedAt','desc').limit(2000).get();
  mergeHistoryRows(snap.docs.map(d=>({id:d.id,...d.data()})));
  if(document.getElementById('historyModal')?.classList.contains('show'))drawHistory();
  const el=document.getElementById('lastGlobal');if(el)el.textContent='Historial sincronizado: '+history.length+' registros';
 }catch(e){console.error('Firestore lectura:',e)}finally{cloudSyncing=false}
}
async function saveCloudRecord(rec){
 if(!firestoreReady||!rec?.id)return;
 try{await firestoreDb.collection(FIRESTORE_COLLECTION).doc(rec.id).set(rec,{merge:true})}
 catch(e){console.error('Firestore escritura:',e)}
}
async function uploadLocalHistoryOnce(){
 if(!firestoreReady||!history.length)return;
 const batchSize=400;
 for(let i=0;i<history.length;i+=batchSize){
  const batch=firestoreDb.batch();
  history.slice(i,i+batchSize).forEach(rec=>batch.set(firestoreDb.collection(FIRESTORE_COLLECTION).doc(rec.id),rec,{merge:true}));
  await batch.commit();
 }
 await loadCloudHistory();
}
const WEATHER_PROXY='https://weatherapi-proxy.elexpreso17.workers.dev/';
const STORE='territoria_meteo_weatherapi_v1';
let gps={lat:-32.9294,lon:-68.8607,accuracy:null},history=loadHistory(),range={kind:7,end:new Date()},visible={weatherapi:true,openmeteo:true,ecmwf:true,average:true,territoria:true},refreshing=false;
const $=id=>document.getElementById(id),num=v=>Number.isFinite(Number(v))?Number(v):null,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}):'--';
const VARS={temperature:{label:'Temperatura',unit:'°C'},feels:{label:'Sensación térmica',unit:'°C'},humidity:{label:'Humedad',unit:'%'},wind:{label:'Viento',unit:'km/h'},pressure:{label:'Presión',unit:'hPa'},visibility:{label:'Visibilidad',unit:'km'},cloud:{label:'Nubosidad',unit:'%'},precipitation:{label:'Precipitación',unit:'mm'}};
function loadHistory(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return[]}}function saveHistory(){localStorage.setItem(STORE,JSON.stringify(history.slice(-20000)))}
async function fetchWeatherApi(){const r=await fetch(`${WEATHER_PROXY}?lat=${gps.lat}&lon=${gps.lon}`,{cache:'no-store'});const j=await r.json();if(!r.ok||j.error)throw Error(j.error?.message||j.error||'WeatherAPI no disponible');return j}
async function fetchOpenMeteo(){const current='temperature_2m,apparent_temperature,relative_humidity_2m,surface_pressure,wind_speed_10m,wind_direction_10m,cloud_cover,visibility,precipitation';const p=new URLSearchParams({latitude:gps.lat,longitude:gps.lon,current,timezone:'America/Argentina/Mendoza',wind_speed_unit:'kmh'});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+p,{cache:'no-store'});if(!r.ok)throw Error('Open-Meteo HTTP '+r.status);return (await r.json()).current}
async function fetchECMWF(){const current='temperature_2m,apparent_temperature,relative_humidity_2m,surface_pressure,wind_speed_10m,wind_direction_10m,cloud_cover,visibility,precipitation';const p=new URLSearchParams({latitude:gps.lat,longitude:gps.lon,current,timezone:'America/Argentina/Mendoza',wind_speed_unit:'kmh',models:'ecmwf_ifs025'});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+p,{cache:'no-store'});if(!r.ok)throw Error('ECMWF HTTP '+r.status);return (await r.json()).current}
function parseWA(j){const c=j.current||{};return{temperature:num(c.temp_c),feels:num(c.feelslike_c),humidity:num(c.humidity),wind:num(c.wind_kph),pressure:num(c.pressure_mb),visibility:num(c.vis_km),cloud:num(c.cloud),precipitation:num(c.precip_mm),windDirection:c.wind_dir||'--',condition:c.condition?.text||'--',updated:c.last_updated||null}}
function parseOM(c){return{temperature:num(c.temperature_2m),feels:num(c.apparent_temperature),humidity:num(c.relative_humidity_2m),wind:num(c.wind_speed_10m),pressure:num(c.surface_pressure),visibility:Number.isFinite(Number(c.visibility))?Number(c.visibility)/1000:null,cloud:num(c.cloud_cover),precipitation:num(c.precipitation),windDirection:Number.isFinite(Number(c.wind_direction_10m))?Math.round(c.wind_direction_10m)+'°':'--',condition:'Modelo meteorológico',updated:c.time||null}}
function aiValue(key,base){
 if(!Number.isFinite(base))return null;
 const rows=history.filter(x=>Number.isFinite(x.openmeteo?.[key])&&(Number.isFinite(x.weatherapi?.[key])||Number.isFinite(x.ecmwf?.[key]))).slice(-240);
 // Empieza desde la primera muestra comparable. Con pocas muestras usa una correccion prudente.
 const diffs=rows.map(x=>{const refs=[x.weatherapi?.[key],x.ecmwf?.[key]].filter(Number.isFinite);return refs.length?refs.reduce((a,b)=>a+b,0)/refs.length-x.openmeteo[key]:null}).filter(Number.isFinite);
 if(!diffs.length)return base;
 const recent=diffs.slice(-Math.min(24,diffs.length));
 const bias=recent.reduce((a,b)=>a+b,0)/recent.length;
 const confidence=Math.min(1,diffs.length/12);
 return base+bias*confidence
}
function makeAI(om){const out={};for(const k of Object.keys(VARS))out[k]=aiValue(k,om[k]);return out}
function recordId(updated){return 'gps_'+String(updated||new Date().toISOString()).replace(/[^0-9]/g,'').slice(0,12)}
function upsert(rec){const i=history.findIndex(x=>x.id===rec.id);if(i>=0)history[i]={...history[i],...rec};else history.push(rec);history.sort((a,b)=>new Date(a.observedAt)-new Date(b.observedAt));saveHistory();saveCloudRecord(rec)}
function card(title,subtitle,data,color,status){return `<div class="station-head"><div><div class="station-title">${esc(title)}</div><div class="station-code">${esc(subtitle)}</div></div><span class="status" style="border-color:${color};color:${color};background:#091521"><span class="dot"></span> ${esc(status)}</span></div><div class="station-temp" style="color:${color}">${fmt(data.temperature,1)} °C</div><div class="distance">${esc(data.condition||'--')}</div><div class="tiles"><div class="tile"><label>Humedad</label><strong>${fmt(data.humidity,0)} %</strong></div><div class="tile"><label>Sensación</label><strong>${fmt(data.feels,1)} °C</strong></div><div class="tile"><label>Viento</label><strong>${fmt(data.wind,1)} km/h</strong></div><div class="tile"><label>Dirección</label><strong>${esc(data.windDirection||'--')}</strong></div><div class="tile"><label>Presión</label><strong>${fmt(data.pressure,1)} hPa</strong></div><div class="tile"><label>Visibilidad</label><strong>${fmt(data.visibility,1)} km</strong></div><div class="tile"><label>Nubosidad</label><strong>${fmt(data.cloud,0)} %</strong></div><div class="tile"><label>Precipitación</label><strong>${fmt(data.precipitation,2)} mm</strong></div><div class="tile"><label>Actualización</label><strong style="font-size:10px">${esc(data.updated||'--')}</strong></div></div>`}
function directionDegrees(v){
 if(Number.isFinite(Number(v)))return Number(v);
 const txt=String(v||'').trim().toUpperCase().replace('°','');
 if(Number.isFinite(Number(txt)))return Number(txt);
 const dirs={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
 return Number.isFinite(dirs[txt])?dirs[txt]:null
}
function circularMean(values){
 const a=values.map(directionDegrees).filter(Number.isFinite);if(a.length!==3)return null;
 const x=a.reduce((s,d)=>s+Math.cos(d*Math.PI/180),0)/a.length,y=a.reduce((s,d)=>s+Math.sin(d*Math.PI/180),0)/a.length;
 return (Math.atan2(y,x)*180/Math.PI+360)%360
}
function mean3(a,b,c){const v=[a,b,c].filter(Number.isFinite);return v.length===3?v.reduce((x,y)=>x+y,0)/3:null}
function makeAverage(wa,om,ecmwf){
 if(!wa||!om||!ecmwf)return null;
 const out={condition:'Promedio matemático multivariable',updated:new Date().toLocaleString('es-AR'),sources:3};
 for(const k of Object.keys(VARS))out[k]=mean3(wa?.[k],om?.[k],ecmwf?.[k]);
 const dir=circularMean([wa.windDirection,om.windDirection,ecmwf.windDirection]);
 out.windDirection=Number.isFinite(dir)?Math.round(dir)+'°':'--';
 return out
}
function renderAverage(avg){
 if(!avg){$('averageCard').innerHTML='<div class="sub">Esperando las 3 fuentes…</div>';return}
 $('averageCard').innerHTML=card('🟣 Territoria Matemática','Promedio de WeatherAPI + Open-Meteo + ECMWF',avg,'#a855f7','REGISTRANDO')+`<div class="foot"><span>Promedio cada 15 min multivariable</span><strong>${avg.sources}/3 fuentes</strong></div>`
}
function renderAI(ai){const valid=Number.isFinite(ai?.temperature),n=history.filter(x=>Number.isFinite(x.openmeteo?.temperature)&&(Number.isFinite(x.weatherapi?.temperature)||Number.isFinite(x.ecmwf?.temperature))).length,status=valid?(n>=12?'CALIBRADO':'APRENDIENDO'):'ESPERANDO';const d={...ai,condition:valid?`Estimacion inicial · aprendizaje ${Math.min(n,12)}/12`:'Esperando primera muestra comparable',windDirection:'--',updated:new Date().toLocaleString('es-AR')};$('aiCard').innerHTML=card('🧠 Modelo Territoria IA',`Muestras comparables: ${n}`,d,'#16a34a',status)+`<div class="foot"><span>Correccion progresiva desde ahora</span><strong class="off">${valid?'ON':'OFF'}</strong></div>`}
async function refreshAll(){if(refreshing)return;refreshing=true;$('globalStatus').innerHTML='<span class="dot"></span> ACTUALIZANDO';try{
 const results=await Promise.allSettled([fetchWeatherApi(),fetchOpenMeteo(),fetchECMWF()]);
 const [waRes,omRes,eRes]=results;
 let wa=null,om=null,ecmwf=null,waRaw=null;
 if(waRes.status==='fulfilled'){waRaw=waRes.value;wa=parseWA(waRaw);$('weatherApiCard').innerHTML=card('🟠 WeatherAPI',(waRaw.location?.name||'GPS')+' · '+(waRaw.location?.region||''),wa,'#f59e0b','ACTUAL')}else $('weatherApiCard').innerHTML='<div class="sub">WeatherAPI no disponible: '+esc(waRes.reason?.message||'error')+'</div>';
 if(omRes.status==='fulfilled'){om=parseOM(omRes.value);$('openMeteoCard').innerHTML=card('🔴 Open-Meteo','Modelo en coordenadas GPS',om,'#ef4444','ACTUAL')}else $('openMeteoCard').innerHTML='<div class="sub">Open-Meteo no disponible: '+esc(omRes.reason?.message||'error')+'</div>';
 if(eRes.status==='fulfilled'){ecmwf=parseOM(eRes.value);ecmwf.condition='ECMWF IFS';$('ecmwfCard').innerHTML=card('🔵 ECMWF','IFS · modelo individual vía Open-Meteo',ecmwf,'#3b82f6','ACTUAL')}else $('ecmwfCard').innerHTML='<div class="sub">ECMWF no disponible: '+esc(eRes.reason?.message||'error')+'</div>';

 const now=new Date(),localParts=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Argentina/Mendoza',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now),lp=Object.fromEntries(localParts.map(x=>[x.type,x.value])),slot=Math.floor(Number(lp.minute)/15)*15,slotKey=`${lp.year}${lp.month}${lp.day}${lp.hour}${String(slot).padStart(2,'0')}`;

function openHistory(){$('historyModal').classList.add('show');drawHistory();loadCloudHistory()}function closeHistory(){$('historyModal').classList.remove('show')}function setRange(v,b){range.kind=v;range.end=new Date();document.querySelectorAll('.range-btn[data-range]').forEach(x=>x.classList.toggle('active',x===b));drawHistory()}function rangeMs(){if(range.kind==='ALL')return Infinity;if(range.kind==='1M')return 31*864e5;if(range.kind==='3M')return 92*864e5;if(range.kind==='6M')return 183*864e5;if(range.kind==='1Y')return 365*864e5;return Number(range.kind)*864e5}function shiftRange(d){const ms=rangeMs();if(Number.isFinite(ms)){range.end=new Date(range.end.getTime()+d*ms);drawHistory()}}function goNow(e){e?.preventDefault();range.end=new Date(Date.now()+60000);const b=$('nowBtn');b?.classList.add('now-active');drawHistory();setTimeout(()=>b?.classList.remove('now-active'),900)}function toggleSeries(b){const k=b.dataset.series;visible[k]=!visible[k];b.classList.toggle('active',visible[k]);drawHistory()}
function rowsNow(){const end=range.end.getTime(),ms=rangeMs(),start=Number.isFinite(ms)?end-ms:-Infinity;return history.filter(x=>{const t=new Date(x.observedAt).getTime();return t>=start&&t<=end})}function val(o,k){return Number.isFinite(o?.[k])?o[k]:null}
function chartSvg(rows,key){if(!rows.length)return '<div class="empty">Todavía no hay registros para este periodo.</div>';const series={weatherapi:rows.map(x=>val(x.weatherapi,key)),openmeteo:rows.map(x=>val(x.openmeteo,key)),ecmwf:rows.map(x=>val(x.ecmwf,key)),average:rows.map(x=>val(x.average,key)),territoria:rows.map(x=>val(x.territoria,key))},enabled=Object.entries(series).filter(([k])=>visible[k]),values=enabled.flatMap(([,a])=>a.filter(Number.isFinite));if(!values.length)return '<div class="empty">Sin valores para esta selección.</div>';let mn=Math.min(...values),mx=Math.max(...values);if(mx===mn){mx++;mn--}const W=1200,H=330,L=58,R=20,T=20,B=58,X=i=>rows.length===1?(L+W-R)/2:L+i*(W-L-R)/(rows.length-1),Y=v=>T+(mx-v)/(mx-mn)*(H-T-B),colors={weatherapi:'#f59e0b',openmeteo:'#ef4444',ecmwf:'#3b82f6',average:'#a855f7',territoria:'#16a34a'};let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;for(let i=0;i<=4;i++){const y=T+i*(H-T-B)/4,v=mx-i*(mx-mn)/4;s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#24364d"/><text x="${L-8}" y="${y+4}" fill="#91a5bd" font-size="11" text-anchor="end">${v.toFixed(1)}</text>`}for(const [k,a] of enabled){const pts=a.map((v,i)=>Number.isFinite(v)?`${X(i)},${Y(v)}`:null).filter(Boolean);if(pts.length>1)s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${colors[k]}" stroke-width="3"/>`;a.forEach((v,i)=>{if(Number.isFinite(v))s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${rows.length===1?7:4}" fill="${colors[k]}" stroke="#081322" stroke-width="2"><title>${k}: ${v}</title></circle>`})}const every=Math.max(1,Math.ceil(rows.length/8));rows.forEach((r,i)=>{if(i%every===0||i===rows.length-1){const d=new Date(r.observedAt),lab=d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).replace(',',' ·');s+=`<text x="${X(i)}" y="${H-18}" fill="#91a5bd" font-size="10" text-anchor="middle">${lab}</text>`}});return s+'</svg>'}
function latest(rows,key,src){for(let i=rows.length-1;i>=0;i--){const v=val(rows[i][src],key);if(Number.isFinite(v))return v}return null}function drawHistory(){const rows=rowsNow(),key=$('variableSelect').value,v=VARS[key];$('chartTitle').textContent=v.label+' · comparación superpuesta';$('mainChart').innerHTML=chartSvg(rows,key);const ms=rangeMs(),start=Number.isFinite(ms)?new Date(range.end-ms):rows[0]?new Date(rows[0].observedAt):null;$('rangeText').textContent=start?start.toLocaleString('es-AR')+' → '+range.end.toLocaleString('es-AR'):'Sin registros';$('historyMetrics').innerHTML=`<div class="metric"><label>Registros visibles</label><strong>${rows.length}</strong></div><div class="metric"><label>Último WeatherAPI</label><strong>${fmt(latest(rows,key,'weatherapi'),key==='precipitation'?2:1)} ${v.unit}</strong></div><div class="metric"><label>Último Open-Meteo</label><strong>${fmt(latest(rows,key,'openmeteo'),key==='precipitation'?2:1)} ${v.unit}</strong></div><div class="metric"><label>Último ECMWF</label><strong>${fmt(latest(rows,key,'ecmwf'),key==='precipitation'?2:1)} ${v.unit}</strong></div><div class="metric"><label>Territoria Matemática</label><strong>${fmt(latest(rows,key,'average'),key==='precipitation'?2:1)} ${v.unit}</strong></div>`}
initFirestore().then(ok=>{if(ok)uploadLocalHistoryOnce()});$('openMeteoCard').innerHTML='<div class="sub">Esperando Open-Meteo…</div>';$('weatherApiCard').innerHTML='<div class="sub">Esperando WeatherAPI…</div>';$('ecmwfCard').innerHTML='<div class="sub">Esperando ECMWF…</div>';$('averageCard').innerHTML='<div class="sub">Esperando las 3 fuentes…</div>';renderAI(null);if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};$('gpsText').textContent=`Ubicación: ${gps.lat.toFixed(4)}, ${gps.lon.toFixed(4)} · ±${Math.round(gps.accuracy)} m`;refreshAll()},()=>{ $('gpsText').textContent=`Ubicación de referencia: ${gps.lat}, ${gps.lon}`;refreshAll()},{enableHighAccuracy:true,timeout:9000,maximumAge:60000});else refreshAll();setInterval(refreshAll,15*60*1000);
