<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

 

<link rel="stylesheet"

href=https://unpkg.com/leaflet@1.9.4/dist/leaflet.css/>

 

<style>

html,body{

    margin:0;

    padding:0;

    height:100%;

}

#map{

    height:100vh;

    width:100%;

}

</style>

</head>

 

<body>

 

<div id="map"></div>

 

<script src=https://unpkg.com/leaflet@1.9.4/dist/leaflet.js></script>

 

<script>

 

var map = L.map('map').setView([-34.6,-64],4);

 

L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

    attribution:'© OpenStreetMap',

    maxZoom:19

}

).addTo(map);

 

</script>

 

</body>

</html>
