<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar Meteorológico</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#111827;
    font-family:Arial,sans-serif;
}

#map{
    width:100%;
    height:100vh;
}

.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:9999;
    background:rgba(17,24,39,.95);
    padding:10px;
    border-radius:10px;
    border:1px solid #374151;
    box-shadow:0 0 10px rgba(0,0,0,.4);
}

.panel h3{
    margin:0 0 8px 0;
    color:white;
    font-size:18px;
}

button{
    background:#1f2937;
    color:white;
    border:1px solid #374151;
    padding:8px 12px;
    margin:3px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#374151;
}

.estado{
    margin-top:8px;
    color:#38bdf8;
    font-size:12px;
}

</style>
</head>

<body>

<div class="panel">

<h3>🛰️ Radar Meteo</h3>

<button id="btnBase">
🌍 Base
</button>

<button id="btnSat">
🛰️ Satélite
</button>

<button id="btnGPS">
📍 GPS
</button>

<button id="btnArgentina">
🇦🇷 Argentina
</button>

<div id="estado" class="estado">
Visor listo
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

5
);

);
