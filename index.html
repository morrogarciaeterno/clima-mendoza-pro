<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Territoria - Sistema Oficial</title>
    <!-- Librería Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Librería Leaflet.draw para dibujo de polígonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- Librería PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <!-- Firebase App y Firestore (Compat SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #070a14;
            --card-bg: #0e1526;
            --card-inner: #162035;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg);
            color: var(--text-main);
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-text-size-adjust: 100%;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            padding-top: max(8px, env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-content {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex-grow: 1;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 50%;
            background: #ffffff;
            padding: 2px;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .brand-text-container {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .brand h1 {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand p {
            font-size: 0.62rem;
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
            line-height: 1.2;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .date-display {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #fecha {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: capitalize;
            line-height: 1.1;
        }

        .time-temp-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 1px;
        }

        #digitalFallback {
            font-size: 0.62rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            line-height: 1.1;
        }

        #headerTemp {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.1;
        }

        /* CINTA DE ALARMAS SCADA */
        .scada-banner-container {
            background: linear-gradient(90deg, #1e1115 0%, #0e1526 50%, #1e1115 100%);
            border-bottom: 2px solid #ef4444;
            padding: 6px 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.2);
            position: sticky;
            top: 51px;
            z-index: 99;
        }

        .scada-banner-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .scada-badge-blink {
            background: #ef4444;
            color: #fff;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
            letter-spacing: 0.5px;
            animation: pulseGlowBadge 1.2s infinite;
            text-transform: uppercase;
        }

        @keyframes pulseGlowBadge {
            0% { opacity: 0.7; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.04); box-shadow: 0 0 10px #ef4444; }
            100% { opacity: 0.7; transform: scale(0.98); }
        }

        .scada-ticker-wrapper {
            flex-grow: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            display: flex;
            align-items: center;
        }

        .scada-ticker-content {
            display: inline-flex;
            gap: 15px;
            align-items: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-main);
            animation: marqueeScroll 25s linear infinite;
        }

        .scada-ticker-content:hover {
            animation-play-state: paused;
        }

        @keyframes marqueeScroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .scada-alert-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-abrir-alarmero-modal {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-abrir-alarmero-modal:hover {
            background: var(--accent);
            color: #000;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px 8px 40px 8px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            padding: 4px;
        }

        .modal-content-box {
            background: var(--card-bg);
            border: 1px solid var(--accent);
            border-radius: 14px;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }

        .modal-header {
            padding: 8px 12px;
            background: var(--card-inner);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 800;
        }

        .btn-cerrar-modal {
            background: #ef4444;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* ESTILOS ESPECÍFICOS HIDROMETRÍA */
        .hidro-layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
        }
        @media(min-width: 900px) {
            .hidro-layout-grid { grid-template-columns: 1fr 1.2fr; gap: 16px; }
        }
        #map {
            height: 420px;
            border-radius: 10px;
            border: 1px solid var(--border);
            z-index: 10;
            width: 100%;
        }
        @media(min-width: 768px) {
            #map { height: 520px; }
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        .card.alerta-roja {
            border-color: #ef4444;
            background: linear-gradient(135deg, #1f1115 0%, #162035 100%);
        }
        .resumen-caudal {
            margin-top: 10px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #091325 0%, #111e38 100%);
            border: 1px solid #0284c7;
            border-radius: 10px;
            padding: 10px;
        }
        .resumen-caudal.alerta-activa {
            border-color: #ef4444;
            background: linear-gradient(135deg, #2a0f15 0%, #111e38 100%);
        }
        .indicadores-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            text-align: center;
        }
        .ind-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 6px;
        }
        .ind-label { font-size: 0.58rem; color: var(--text-muted); text-transform: uppercase; }
        .ind-val { font-size: 0.9rem; font-weight: 800; color: #fff; margin-top: 2px; }
        .tendencia { font-size: 0.65rem; font-weight: bold; margin-top: 2px; }
        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        select, input {
            flex: 1;
            padding: 8px 10px;
            background: var(--card-inner);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.78rem;
            outline: none;
        }
        select:focus, input:focus { border-color: var(--accent); }
        button{
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #000;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.75rem;
        }
        button:hover{ opacity: 0.9; }
        .btn-secundario {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 6px 10px;
            margin-top: 6px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .json-box{
            display: none;
            margin-top: 6px;
            background: #02040a;
            border: 1px solid var(--border);
            color: #22c55e;
            border-radius: 10px;
            padding: 10px;
            overflow: auto;
            max-height: 120px;
            font-family: monospace;
            font-size: 0.65rem;
        }
        .loading{
            text-align: center;
            font-size: 0.75rem;
            color: var(--accent);
            padding: 15px;
            grid-column: 1 / -1;
        }
        /* Estilo para etiquetas limpias mostrando solo el ID */
        .map-station-tooltip {
            background: rgba(14, 21, 38, 0.95) !important;
            border: 1px solid var(--accent) !important;
            color: #38bdf8 !important;
            font-size: 0.65rem !important;
            font-weight: 900 !important;
            padding: 2px 6px !important;
            border-radius: 4px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5) !important;
        }
    </style>
</head>

<body oncontextmenu="return false;">

<header>
    <div class="header-content">
        <div class="brand">
            <img src="territoria-logo.png" alt="Territoria" class="brand-logo" onerror="this.style.display='none'">
            <div class="brand-text-container">
                <h1>Territoria</h1>
                <p id="ubicacionTexto" style="cursor: pointer; text-decoration: underline;" onclick="centrarUbicacion()" title="Clic para activar GPS">Mendoza, Argentina</p>
            </div>
        </div>

        <div class="header-right">
            <div class="date-display">
                <div id="fecha">--</div>
                <div class="time-temp-container">
                    <span id="digitalFallback">00:00:00</span>
                    <span id="headerTemp">--°C</span>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- CINTA DE ALARMAS SCADA -->
<div class="scada-banner-container">
    <div class="scada-banner-left">
        <span class="scada-badge-blink">🚨 SCADA</span>
    </div>
    <div class="scada-ticker-wrapper">
        <div class="scada-ticker-content" id="scadaTickerContent">
            <span>✔ Sistema Normal: Sin alarmas activas en la red.</span>
        </div>
    </div>
    <button type="button" class="btn-abrir-alarmero-modal" onclick="abrirModalAlarmasActivas()">
        Alarmero 📋
    </button>
</div>

<div class="container">

    <!-- SECCIÓN DE HIDROMETRÍA SNIH -->
    <div id="seccionHidrometriaModulo" class="card" style="border-left: 6px solid #0284c7; background: linear-gradient(135deg, #0e1526 0%, #0c1a2f 100%); margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; flex-wrap: wrap; gap: 6px;">
            <div>
                <h3 id="tituloEstacion" style="color: var(--text-main); font-size: 0.85rem; font-weight: 800;">🌊 Territoria - Monitoreo Hídrico SNIH & Panel de Control</h3>
                <small id="instruccionMapa" style="color: var(--text-muted); font-size: 0.65rem;">Haz clic en el botón amarillo para agregar un punto y arrástralo en el mapa para ubicarlo.</small>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                <!-- BOTÓN AMARILLO PARA AGREGAR PUNTO DE MEDICIÓN -->
                <button onclick="agregarPuntoMedicionMapa()" style="background: #facc15; color: #000; padding: 5px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 900; cursor: pointer; box-shadow: 0 0 12px rgba(250,204,21,0.5);">⭐ Agregar Punto de Medición</button>
                <button onclick="escanearTodasLasEstaciones()" style="background: #0284c7; color: #fff; padding: 5px 10px; border-radius: 6px; font-size: 0.68rem; font-weight: 800; cursor: pointer;">🔍 Escanear Red</button>
            </div>
        </div>

        <div class="hidro-layout-grid">
            <!-- COLUMNA IZQUIERDA: CONTROLES, DATOS Y EDICIÓN -->
            <div class="panel" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="search-box">
                    <select id="id" onchange="consultar()">
                        <!-- Se llena dinámicamente -->
                    </select>
                    <button onclick="consultar()">Actualizar</button>
                </div>

                <div id="infoDetalle" style="font-size: 0.7rem; color: var(--text-muted);">
                    Información de la red y ubicación...
