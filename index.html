<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentina Clima & Alertas</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 12px;
        }
        .header {
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 1.25rem;
            margin: 0 0 4px 0;
        }
        .header p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 0;
        }
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-full {
            grid-column: span 2;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card h3 {
            font-size: 0.75rem;
            color: #94a3b8;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .temp-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
        }
        #map {
            height: 280px;
            border-radius: 8px;
            width: 100%;
            margin-top: 8px;
        }
        .info-p {
            font-size: 0.95rem;
            margin: 6px 0;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="titulo-app">🇦🇷 Argentina Clima & Alertas</h1>
        <p id="subtitulo-alerta">Alertas · Zonda · Pronóstico · Riesgo de Incendios</p>
    </div>

    <div class="card">
        <h3 id="lbl-ubicacion">📍 Detectando ubicación...</h3>
        <p class="info-p" id="lbl-temp">🌡 Temperatura: --°C</p>
        <p class="info-p" id="lbl-humedad">💧 Humedad: --%</p>
        <p class="info-p" id="lbl-viento">🌬 Viento: -- km/h</p>
        <p class="info-p" id="lbl-estado">🌤 Estado del cielo: Cargando...</p>
    </div>

    <div class="card-full">
        <h3>Radar & Mapa Interactivo (Foco de Incendios / Zonda)</h3>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-32.89, -68.84], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker([-32.89, -68.84]).addTo(map);

        function iniciarClima() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    map.setView([lat, lon], 12);
                    marker.setLatLng([lat, lon]);

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const data = await response.json();
                        
                        const ciudad = data.address.city || data.address.town || data.address.village || data.address.county || "Mendoza";
                        const estado = data.address.state || "";
                        
                        document.getElementById("lbl-ubicacion").innerText = `📍 Departamento ${ciudad}, ${estado}`;

                        obtenerClimaOpenMeteo(lat, lon);

                    } catch (e) {
                        console.error("Error obteniendo nombre de ubicación", e);
                        document.getElementById("lbl-ubicacion").innerText = "📍 Mendoza Capital";
                        obtenerClimaOpenMeteo(-32.89, -68.84);
                    }
                }, error => {
                    console.error("Error de GPS:", error);
                    document.getElementById("lbl-ubicacion").innerText = "📍 Mendoza Capital (Por defecto)";
                    obtenerClimaOpenMeteo(-32.89, -68.84);
                });
            } else {
                obtenerClimaOpenMeteo(-32.89, -68.84);
            }
        }

        async function obtenerClimaOpenMeteo(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=America%2FArgentina%2FMendoza`);
                const data = await res.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const humedad = data.current.relative_humidity_2m;
                const viento = data.current.wind_speed_10m;
                const code = data.current.weather_code;

                document.getElementById("lbl-temp").innerText = `🌡 Temperatura: ${temp}°C`;
                document.getElementById("lbl-humedad").innerText = `💧 Humedad: ${humedad}%`;
                document.getElementById("lbl-viento").innerText = `🌬 Viento: ${viento} km/h`;
                document.getElementById("lbl-estado").innerText = `🌤 Estado del cielo: ${obtenerTextoCondicion(code)}`;
            } catch (e) {
                console.error("Error al consultar API del clima", e);
            }
        }

        function obtenerTextoCondicion(code) {
            switch (code) {
                case 0: return "Cielo despejado ☀️️";
                case 1: case 2: case 3: return "Parcialmente nublado 🌤️";
                case 45: case 48: return "Neblina 🌫️";
                default: 
                    if (code >= 51 && code <= 67) return "Lluvia 🌧️️";
                    return "Condiciones estables";
            }
        }

        iniciarClima();
    </script>
</body>
</html>
