<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clima Mendoza Pro</title>
<style>
:root {
    --bg: #090d16;
    --card-bg: #111827;
    --card-inner: #1f2937;
    --accent: #38bdf8;
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    --border: #1f2937;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* Bloqueo estricto del scroll horizontal */
html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: pan-y; /* Solo permite scroll vertical */
    background-color: var(--bg);
    color: var(--text-main);
    padding-bottom: 30px;
}

header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 15px 30px;
    width: 100%;
}

.header-content {
    max-width: 1400px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.brand p {
    font-size: 0.85rem;
    color: var(--text-muted);
}

.date-display {
    text-align: right;
}

#fecha {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
    text-transform: capitalize;
}

#digitalFallback {
    font-size: 0.85rem;
    color: var(--accent);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
}

.container {
    max-width: 1400px;
    margin: 25px auto;
    padding: 0 20px;
    width: 100%;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
}

.card h3 {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 500;
}

.metric {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text-main);
    margin-top: 8px;
}

.temp-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#weatherIcon {
    width: 45px;
    height: 45px;
}

.forecast-cards {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    overflow-x: auto;
    touch-action: pan-x; /* Permite scroll horizontal solo dentro de las tarjetas de pronostico */
}

.forecast-card {
    flex: 1;
    min-width: 80px;
    background: var(--card-inner);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
}

.forecast-card .icon {
    font-size: 1.5rem;
    margin: 6px 0;
}

.forecast-card .max {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
}

.forecast-card .min {
    font-size: 0.85rem;
    color: var(--text-muted);
}

.dashboard-row {
    display: grid;
    grid-template-columns: 2fr 1.2fr 1fr 1.2fr;
    gap: 15px;
    align-items: center;
}

.sismos-container-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.sismos-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 15px;
    width: 100%;
}

.sismo-card {
    background: var(--card-inner);
    border-top: 4px solid #ef4444;
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
    min-width: 130px;
    flex: 1 1 130px;
    max-width: 160px;
}

.sismo-mag {
    font-size: 1.8rem;
    font-weight: 800;
    color: #ef4444;
    line-height: 1;
}

.sismo-hora {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-top: 4px;
}

.sismo-epicentro {
    font-size: 0.9rem;
    font-weight: 600;
    margin: 6px 0 4px;
    color: var(--text-main);
    line-height: 1.2;
}

.sismo-prof {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
}

.clock-center-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 0 10px;
}

.analog-clock {
    width: 130px;
    height: 130px;
    border: 3.5px solid var(--accent);
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    margin-top: 8px;
}

.analog-clock .dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
}

.hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 4px;
    z-index: 5;
}

.hand.hour {
    width: 4px;
    height: 34px;
    background: var(--text-main);
}

.hand.minute {
    width: 3px;
    height: 46px;
    background: var(--accent);
}

.hand.second {
    width: 1.5px;
    height: 52px;
    background: #ef4444;
    z-index: 6;
}

.clock-number {
    position: absolute;
    font-size: 10px;
    font-weight: bold;
    color: var(--text-muted);
}

.num-12 { top: 4px; left: 50%; transform: translateX(-50%); }
.num-3 { right: 6px; top: 50%; transform: translateY(-50%); }
.num-6 { bottom: 4px; left: 50%; transform: translateX(-50%); }
.num-9 { left: 6px; top: 50%; transform: translateY(-50%); }

.solar-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.solar-arc {
    position: relative;
    width: 120px;
    height: 60px;
    border: 2px dashed #374151;
    border-bottom: 2px solid #374151;
    border-radius: 60px 60px 0 0;
    margin-top: 10px;
}

.sun-pivot {
    position: absolute;
    width: 100%;
    height: 100%;
    bottom: 0;
    left: 0;
    transform-origin: bottom center;
    transition: transform 1s ease-out;
}

.sun-icon {
    position: absolute;
    left: -12px;
