<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Territoria · Prueba estaciones meteorológicas</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e7edf6;font:14px Segoe UI,Arial;padding:14px}.app{max-width:1200px;margin:auto}.card{background:#101d31;border:1px solid #293b55;border-radius:14px;padding:15px;margin-bottom:10px}.head{background:linear-gradient(135deg,#102b49,#153f68)}h1,h2,h3{margin-top:0}.muted{color:#9baac0;font-size:11px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls button{padding:9px;border-radius:8px;border:1px solid #3b82f6;background:#172554;color:#fff}.controls input{min-width:280px;flex:1}.controls button{cursor:pointer}.green{border-color:#22c55e!important;background:#14532d!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.station{border:1px solid #2dd4bf;border-left:5px solid #2dd4bf;background:#0c1728;border-radius:12px;padding:12px}.big{font-size:26px;font-weight:900;color:#67e8f9}.row{display:flex;justify-content:space-between;border-bottom:1px solid #293b55;padding:6px 0;gap:10px}.ok{color:#86efac}.warn{color:#fde047}.err{color:#fca5a5}#map{height:420px;border-radius:12px;overflow:hidden;background:#0f172a}@media(max-width:600px){#map{height:340px}.controls input{min-width:100%}}
</style></head><body><main class="app"><section class="card head"><h1>🌤️ TERRITORIA · Estaciones meteorológicas cercanas</h1><div class="muted">Prueba por geolocalización con meteorologia.com.ar. La API key queda sólo en este navegador.</div></section><section class="card"><div class="controls"><input id="apiKey" type="password" placeholder="Pega aquí tu API key de meteorologia.com.ar"><button class="green" onclick="start()">📍 Buscar cerca de mi GPS</button><button onclick="clearKey()">🧹 Borrar key</button></div><div id="status" class="muted" style="margin-top:8px">Esperando…</div></section><section class="card"><div id="map"></div></section><section class="grid" id="stations"></section></main>
<script>
let lat=-32.89,lon=-68.84,map,markers=[];const $=id=>document.getElementById(id);$('apiKey').value=localStorage.getItem('meteo_api_key')||'';
function dist(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadLeaflet(){return new Promise((ok,no)=>{if(window.L)return ok();const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function initMap(){await loadLeaflet();if(!map){map=L.map('map').setView([lat,lon],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map)}markers.forEach(x=>map.removeLayer(x));markers=[];markers.push(L.circleMarker([lat,lon],{radius:9,color:'#fff',fillColor:'#2563eb',fillOpacity:1,weight:3}).addTo(map).bindPopup('📍 Mi GPS'));map.setView([lat,lon],8)}
async function api(path,key){const r=await fetch('https://meteorologia.com.ar/api/v1/'+path,{headers:{'X-API-Key':key},cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j?.error?.message||('HTTP '+r.status));return j}
function stationList(j){if(Array.isArray(j))return j;if(Array.isArray(j.stations))return j.stations;if(Array.isArray(j.data))return j.data;return[]}
function getLat(s){return Number(s.lat??s.latitude)}function getLon(s){return Number(s.lon??s.lng??s.longitude)}function getId(s){return s.id??s.station??s.station_id??''}
async function start(){const key=$('apiKey').value.trim();if(!key){$('status').innerHTML='<span class="warn">Falta la API key.</span>';return}localStorage.setItem('meteo_api_key',key);$('status').textContent='Solicitando GPS…';navigator.geolocation.getCurrentPosition(async p=>{lat=p.coords.latitude;lon=p.coords.longitude;await initMap();loadStations(key)},async()=>{await initMap();$('status').innerHTML='<span class="warn">GPS no disponible. Usando coordenadas de prueba de Mendoza.</span>';loadStations(key)},{enableHighAccuracy:true,timeout:12000})}
async function loadStations(key){try{$('status').textContent='Consultando estaciones de Mendoza…';const j=await api('stations.php?provincia=Mendoza',key),all=stationList(j).map(s=>({...s,_lat:getLat(s),_lon:getLon(s)})).filter(s=>Number.isFinite(s._lat)&&Number.isFinite(s._lon)&&getId(s));all.forEach(s=>s._km=dist(lat,lon,s._lat,s._lon));const nearest=all.sort((a,b)=>a._km-b._km).slice(0,6);if(!nearest.length)throw Error('La respuesta no contiene estaciones georreferenciadas de Mendoza.');$('status').innerHTML=`<span class="ok">${nearest.length} estaciones más cercanas encontradas.</span>`;const readings=await Promise.all(nearest.map(async s=>{try{return{s,data:await api('current.php?station='+encodeURIComponent(getId(s)),key)}}catch(e){return{s,error:e.message}}}));render(readings)}catch(e){$('status').innerHTML='<span class="err">Error: '+esc(e.message)+'</span>'; $('stations').innerHTML=''}}
function render(list){$('stations').innerHTML=list.map(({s,data,error})=>{const d=data?.data||{},st=data?.station||s;return `<article class="station"><h3>${esc(st.name||s.name||getId(s))}</h3><div class="muted">${esc(st.location||s.location||'Mendoza')} · ${s._km.toFixed(1)} km del GPS</div>${error?`<p class="err">${esc(error)}</p>`:`<div class="big">${d.temp??'--'} °C</div><div class="row"><span>💧 Humedad</span><b>${d.humidity??'--'} %</b></div><div class="row"><span>🌬️ Viento</span><b>${d.wind_speed??'--'} km/h</b></div><div class="row"><span>📊 Presión</span><b>${d.pressure??'--'} hPa</b></div><div class="row"><span>🌧️ Precipitación</span><b>${d.precip_total??'--'} mm</b></div><div class="row"><span>☀️ Radiación</span><b>${d.solar_radiation??'--'}</b></div><div class="muted" style="margin-top:7px">${esc(data.timestamp||'')}</div>`}</article>`}).join('');list.forEach(({s,data})=>{const st=data?.station||s,m=L.circleMarker([s._lat,s._lon],{radius:7,color:'#22d3ee',fillColor:'#22d3ee',fillOpacity:.85}).addTo(map).bindPopup(`<b>${esc(st.name||getId(s))}</b><br>${s._km.toFixed(1)} km del GPS`);markers.push(m)});if(markers.length>1)map.fitBounds(L.featureGroup(markers).getBounds().pad(.18))}
function clearKey(){localStorage.removeItem('meteo_api_key');$('apiKey').value='';$('status').textContent='API key borrada de este navegador.'}
initMap();
</script></body></html>
