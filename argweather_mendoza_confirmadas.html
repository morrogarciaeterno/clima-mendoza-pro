<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Territoria · Estaciones oficiales de Mendoza</title><style>
*{box-sizing:border-box}:root{--bg:#07111f;--p:#101d31;--b:#293b55;--t:#e7edf6;--m:#9baac0;--a:#38bdf8;--g:#22c55e;--r:#ef4444}body{margin:0;min-height:100vh;padding:14px;background:var(--bg);color:var(--t);font:14px Segoe UI,Arial}.app{max-width:1100px;margin:auto}.card{margin-bottom:10px;padding:15px;border:1px solid var(--b);border-radius:14px;background:var(--p)}.head{background:linear-gradient(135deg,#102b49,#153f68)}h1,h2,h3{margin-top:0}.muted{color:var(--m);font-size:11px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:10px;border:1px solid #3b82f6;border-radius:8px;background:#172554;color:#fff;cursor:pointer}.green{border-color:var(--g);background:#14532d}.badge{padding:5px 9px;border-radius:999px;background:#0c4a6e;color:#bae6fd;font-size:10px;font-weight:900}.ok{color:#86efac}.warn{color:#fde047}.err{color:#fca5a5}#map{height:430px;border-radius:12px;background:#0f172a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.station{padding:14px;border:1px solid var(--sc);border-left:6px solid var(--sc);border-radius:13px;background:#0c1728;box-shadow:0 0 18px color-mix(in srgb,var(--sc) 20%,transparent)}.big{font-size:29px;font-weight:950;color:var(--sc);margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--b)}.nearest{outline:2px solid #22c55e}.source{margin-top:8px;font-size:9px;color:#64748b}@media(max-width:650px){body{padding:8px}#map{height:350px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="app"><section class="card head"><div class="controls" style="justify-content:space-between"><div><h2>🌤️ TERRITORIA · Estaciones oficiales de Mendoza</h2><div class="muted">Las estaciones se cargan siempre. El GPS sólo se usa para calcular distancias.</div></div><span class="badge" id="gpsBadge">GPS pendiente</span></div></section><section class="card"><div class="controls"><button class="green" onclick="requestGps()">📍 Usar mi GPS</button><button onclick="loadStations()">↻ Actualizar estaciones</button></div><div id="status" class="muted" style="margin-top:8px">Inicializando mapa…</div></section><section class="card"><div id="map"></div></section><section id="grid" class="grid"></section></main><script>
const PROXY='https://meteo-proxy.elexpreso17.workers.dev/';
const ST=[{id:'87418',name:'Mendoza Aero',lat:-32.8437,lon:-68.796358,color:'#22d3ee'},{id:'87509',name:'San Rafael Aero',lat:-34.590836,lon:-68.401642,color:'#fb7185'}];
let lat=null,lon=null,map,gpsMarker,stationLayer,lastWeather={};const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function km(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function loadLeaflet(){return new Promise((ok,no)=>{if(window.L)return ok();const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function initMap(){await loadLeaflet();if(!map){map=L.map('map').setView([-33.65,-68.65],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);stationLayer=L.layerGroup().addTo(map)}drawStations();setTimeout(()=>map.invalidateSize(),100)}
function stationPopup(st){
 const distance=lat===null?null:km(lat,lon,st.lat,st.lon),x=lastWeather[st.id];
 if(!x)return `<div style="color:#111827;min-width:210px"><b>🌤️ ${esc(st.name)}</b><br>WMO ${st.id}${distance===null?'':`<br>${distance.toFixed(1)} km del GPS`}<br><br>Cargando condiciones…</div>`;
 return `<div style="color:#111827;min-width:225px;line-height:1.5"><b style="font-size:15px">🌤️ ${esc(st.name)}</b><br><small>WMO ${st.id}${distance===null?'':` · ${distance.toFixed(1)} km del GPS`}</small><hr style="border:0;border-top:1px solid #ddd"><b style="font-size:22px">${esc(x.temperatura_aire||'--')}</b><br>🌡️ Sensación: <b>${esc(x.sensacion_termica||'--')}</b><br>💧 Humedad: <b>${esc(x.humedad_relativa||'--')}</b><br>🌬️ Viento: <b>${esc(x.direccion_viento||'--')} · ${esc(x.velocidad_viento||'--')}</b><br>📊 Presión: <b>${esc(x.presion_estacion||'--')}</b><br>☁️ Nubosidad: <b>${esc(x.nubosidad_total||'--')}</b><br>👁️ Visibilidad: <b>${esc(x.visibilidad||'--')}</b><br>🌤️ Tiempo: <b>${esc(x.tiempo_presente||'--')}</b><br><small>Registro: ${esc(x.dia||'--')} · ${esc(x.hora??'--')}:00 h</small></div>`
}
function drawStations(){if(!map)return;stationLayer.clearLayers();ST.forEach(st=>{L.circleMarker([st.lat,st.lon],{radius:12,color:'#fff',fillColor:st.color,fillOpacity:.95,weight:3}).bindPopup(stationPopup(st),{maxWidth:310}).addTo(stationLayer)});const pts=ST.map(s=>[s.lat,s.lon]);if(lat!==null)pts.push([lat,lon]);map.fitBounds(pts,{padding:[35,35]})}
async function fetchStation(st){const r=await fetch(PROXY+'?wmo_id='+encodeURIComponent(st.id),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j?.ok===false||j?.message)throw Error(j.error||j.message);return Array.isArray(j)?(j[0]||{}):j}
async function loadStations(){$('status').textContent='Consultando Mendoza Aero y San Rafael Aero…';const out=[];for(const st of ST){try{const x=await fetchStation(st);lastWeather[st.id]=x;out.push({st,x})}catch(e){out.push({st,error:e.message})}await new Promise(r=>setTimeout(r,1100))}renderCards(out);drawStations();$('status').innerHTML='<span class="ok">Estaciones actualizadas.</span>'}
function renderCards(out){const withDist=out.map(o=>({...o,d:lat===null?null:km(lat,lon,o.st.lat,o.st.lon)}));const valid=withDist.filter(o=>o.d!==null);const nearest=valid.length?valid.reduce((a,b)=>a.d<b.d?a:b).st.id:null;$('grid').innerHTML=withDist.map(({st,x,error,d})=>error?`<article class="station" style="--sc:${st.color}"><h3>${esc(st.name)}</h3><div class="muted">WMO ${st.id}${d===null?'':` · ${d.toFixed(1)} km`}</div><p class="err">${esc(error)}</p></article>`:`<article class="station ${nearest===st.id?'nearest':''}" style="--sc:${st.color}"><div class="controls" style="justify-content:space-between"><h3>${esc(st.name)}</h3>${nearest===st.id?'<span class="badge">MÁS CERCANA</span>':''}</div><div class="muted">WMO ${st.id}${d===null?' · GPS no disponible':` · ${d.toFixed(1)} km del GPS`}</div><div class="big">${esc(x.temperatura_aire||'--')}</div><div class="row"><span>🌡️ Sensación</span><b>${esc(x.sensacion_termica||'--')}</b></div><div class="row"><span>💧 Humedad</span><b>${esc(x.humedad_relativa||'--')}</b></div><div class="row"><span>📊 Presión estación</span><b>${esc(x.presion_estacion||'--')}</b></div><div class="row"><span>🌬️ Viento</span><b>${esc(x.direccion_viento||'--')} · ${esc(x.velocidad_viento||'--')}</b></div><div class="row"><span>☁️ Nubosidad</span><b>${esc(x.nubosidad_total||'--')}</b></div><div class="row"><span>👁️ Visibilidad</span><b>${esc(x.visibilidad||'--')}</b></div><div class="row"><span>🌤️ Tiempo</span><b>${esc(x.tiempo_presente||'--')}</b></div><div class="muted" style="margin-top:7px">Registro: ${esc(x.dia||'--')} · ${esc(x.hora??'--')}:00 h</div><div class="source">Fuente consultada mediante meteo-proxy · observación horaria</div></article>`).join('')}
function requestGps(){if(!navigator.geolocation){$('gpsBadge').textContent='GPS no compatible';return} $('gpsBadge').textContent='Solicitando GPS…';navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;$('gpsBadge').textContent='GPS activo';$('gpsBadge').classList.add('ok');if(gpsMarker)map.removeLayer(gpsMarker);gpsMarker=L.circleMarker([lat,lon],{radius:10,color:'#fff',fillColor:'#2563eb',fillOpacity:1,weight:3}).addTo(map).bindPopup('📍 Mi ubicación');drawStations();loadStations()},e=>{$('gpsBadge').textContent='GPS no disponible';$('status').innerHTML='<span class="warn">Las estaciones siguen visibles y pueden consultarse sin GPS.</span>'},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
(async()=>{await initMap();await loadStations();requestGps()})();
</script></body></html>
