<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Territoria · Monitoreo Satelital de Calor</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #07111f;
            --p: #101d31;
            --i: #17263d;
            --b: #293b55;
            --t: #e7edf6;
            --m: #9baac0;
            --a: #38bdf8;
            --g: #22c55e;
            --y: #facc15;
            --o: #f97316;
            --r: #ef4444;
        }
        body {
            margin: 0;
            padding: 14px;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
        }
        .app { max-width: 1200px; margin: auto; }
        .card {
            margin-bottom: 12px;
            padding: 16px;
            border: 1px solid var(--b);
            border-radius: 14px;
            background: var(--p);
        }
        h1, h3 { margin-top: 0; color: #40c6ef; }
        .flex { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .badge {
            padding: 5px 9px;
            border: 1px solid #15803d;
            border-radius: 20px;
            background: #064e3b;
            color: #86efac;
            font-size: 10px;
            font-weight: 800;
        }
        .muted { color: var(--m); font-size: 11px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .big { font-size: 24px; font-weight: 800; }
        
        /* Tarjetas con alertas dinámicas idénticas a Territoria */
        #fireCard, #goesCard {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: background .4s ease, border-color .4s ease;
        }
        #fireCard.fire-safe, #goesCard.goes-safe { background: var(--p); border-color: var(--b); }
        #fireCard.fire-watch, #goesCard.goes-watch { background: linear-gradient(145deg, #3a3005, #211d08); border-color: #facc15; }
        #fireCard.fire-near, #goesCard.goes-near { background: linear-gradient(145deg, #542107, #281408); border-color: #f97316; }
        #fireCard.fire-critical, #goesCard.goes-critical { background: linear-gradient(145deg, #541015, #270a0d); border-color: #ef4444; }

        .controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        button, select {
            padding: 9px 12px;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            background: #172554;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        button.active { border-color: #22c55e !important; background: #14532d !important; }
        #map { width: 100%; height: 500px; border: 1px solid var(--b); border-radius: 12px; background: #0f172a; }
        .gpsdot { width: 16px; height: 16px; border-radius: 50%; background: #2563eb; border: 3px solid white; box-shadow: 0 0 10px #3b82f6; }
    </style>
</head>
<body>
<main class="app">
    <header class="card">
        <h1>TERRITORIA · Módulo Satelital Térmico</h1>
        <div class="muted">Ejemplo completo e independiente para integración de anomalías térmicas (GOES-19 y VIIRS).</div>
    </header>

    <!-- Paneles de Estado Térmico -->
    <section class="grid-2">
        <div class="card alert" id="fireCard" onclick="focusCurrentFire()">
            <div class="flex"><b>🛰️ Focos VIIRS más próximos</b><span class="badge" id="fireState">ESPERANDO</span></div>
            <div class="flex" style="align-items:flex-end">
                <div class="big" id="fireDistance">-- km</div>
                <strong id="fireIndex" style="color:#7dd3fc;font-size:11px">-- / --</strong>
            </div>
            <div class="muted" id="fireDetail">Consultando NASA FIRMS…</div>
            <div id="fireDots" style="margin-top:8px;color:#38bdf8;letter-spacing:6px">○ ○ ○ ○</div>
        </div>

        <div class="card alert" id="goesCard" onclick="focusCurrentGoes()">
            <div class="flex"><b>🛰️ GOES-19 · Anomalía térmica</b><span class="badge" id="goesCardState">ESPERANDO</span></div>
            <div class="flex" style="align-items:flex-end">
                <div class="big" id="goesDistance">-- km</div>
                <strong id="goesIndex" style="color:#7dd3fc;font-size:11px">-- / --</strong>
            </div>
            <div class="muted" id="goesDetail">Consultando GOES-19 FDCF…</div>
            <div id="goesDots" style="margin-top:8px;color:#f59e0b;letter-spacing:6px">○ ○ ○ ○</div>
        </div>
    </section>

    <!-- Controles y Mapa Cartográfico -->
    <section class="card">
        <div class="controls">
            <button onclick="centerGps()">📍 Centrar GPS</button>
            <button id="viirsBtn" onclick="toggleViirsLayer()">🔥 VIIRS WMS OFF</button>
            <button id="goesBtn" onclick="toggleGoesLayer()" class="active">🛰️ GOES Marcadores ON</button>
            <select id="radiusSelect" onchange="changeRadius()">
                <option value="20">Radio 20 km</option>
                <option value="50" selected>Radio 50 km</option>
                <option value="100">Radio 100 km</option>
                <option value="200">Radio 200 km</option>
            </select>
        </div>
        <div id="map"></div>
    </section>
</main>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Configuración base (Coordenadas de referencia: Mendoza / Godoy Cruz)
    let lat = -32.89, lon = -68.84, radiusKm = 50;
    let map, gpsMarker, radiusCircle;
    let viirsVisible = false, goesVisible = true;
    let fireLayer = null, goesLayer = null;

    let closestFires = [], currentFireIndex = 0, fireRotationTimer = null;
    let goesDetections = [], closestGoes = [], currentGoesIndex = 0, goesRotationTimer = null;

    const FIRMS_MAP_KEY = "77a9490b2a337c7055de7a2e5948c836";
    const GOES_WORKER_URL = "https://territoria-goes.elexpreso17.workers.dev/";

    const $ = id => document.getElementById(id);
    const set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
    const distance = (a, b, c, d) => {
        const R = 6371, x = (c - a) * Math.PI/180, y = (d - b) * Math.PI/180;
        const q = Math.sin(x/2)**2 + Math.cos(a*Math.PI/180) * Math.cos(c*Math.PI/180) * Math.sin(y/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(q), Math.sqrt(1 - q));
    };

    // Inicializar Mapa Leaflet
    function initMap() {
        if (map) return;
        map = L.map('map').setView([lat, lon], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        gpsMarker = L.marker([lat, lon], {
            icon: L.divIcon({ className: '', html: '<div class="gpsdot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] })
        }).addTo(map).bindPopup('<b>Ubicación GPS Territoria</b>');

        updateRadiusCircle();
        loadAllThermalData();
    }

    function updateRadiusCircle() {
        if (!map) return;
        if (radiusCircle) map.removeLayer(radiusCircle);
        radiusCircle = L.circle([lat, lon], {
            radius: radiusKm * 1000,
            color: '#38bdf8',
            weight: 1.5,
            fillOpacity: 0.04
        }).addTo(map);
    }

    function changeRadius() {
        radiusKm = Number($('radiusSelect').value);
        updateRadiusCircle();
        filterAndRenderProximate();
    }

    function centerGps() {
        if (map) map.setView([lat, lon], 11);
    }

    // --- Carga de Focos VIIRS (NASA FIRMS) ---
    async function loadViirsFires() {
        try {
            set('fireState', 'CONSULTANDO');
            const d = 3, box = [lon - d, lat - d, lon + d, lat + d].map(v => v.toFixed(4)).join(',');
            const r = await fetch(`https://firms.modaps.eosdis.nasa.gov/api/area/csv/${FIRMS_MAP_KEY}/VIIRS_SNPP_NRT/${box}/1`, { cache: 'no-store' });
            if (!r.ok) throw Error('HTTP ' + r.status);
            const text = await r.text();
            const lines = text.trim().split(/\r?\n/);
            const headers = lines[0]?.split(',') || [];
            const il = headers.indexOf('latitude'), io = headers.indexOf('longitude');
            const id = headers.indexOf('acq_date'), it = headers.indexOf('acq_time'), ic = headers.indexOf('confidence');

            if (il < 0 || io < 0) throw Error('Formato CSV inválido');

            const events = lines.slice(1).map(x => {
                const c = x.split(',');
                const a = Number(c[il]), b = Number(c[io]);
                if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
                return {
                    lat: a, lon: b,
                    dist: distance(lat, lon, a, b),
                    date: c[id] || '', time: c[it] || '', conf: c[ic] || 'n/d'
                };
            }).filter(Boolean).sort((a, b) => a.dist - b.dist);

            closestFires = events.filter(e => e.dist <= radiusKm).slice(0, 4);
            currentFireIndex = 0;
            set('fireState', closestFires.length ? 'ACTIVO' : 'SIN FOCOS');
            renderCurrentFire();
            startFireRotation();
        } catch (e) {
            closestFires = [];
            set('fireState', 'ERROR');
            set('fireDetail', 'VIIRS: ' + e.message);
        }
    }

    function renderCurrentFire() {
        const card = $('fireCard');
        if (!closestFires.length) {
            set('fireDistance', '-- km');
            set('fireIndex', '0 / 0');
            set('fireDetail', 'Sin focos VIIRS en el radio configurado.');
            $('fireDots').textContent = '○ ○ ○';
            card.className = 'card alert fire-safe';
            return;
        }
        currentFireIndex = (currentFireIndex + closestFires.length) % closestFires.length;
        const n = closestFires[currentFireIndex];
        const km = Math.round(n.dist);
        set('fireDistance', km + ' km');
        set('fireIndex', `${currentFireIndex + 1} / ${closestFires.length}`);
        set('fireDetail', `Fecha: ${n.date} · ${n.time} UTC · Confianza: ${n.conf}`);
        $('fireDots').textContent = closestFires.map((_, i) => i === currentFireIndex ? '●' : '○').join(' ');
        
        // Asignación de clase visual por proximidad
        card.className = 'card alert ' + (km <= 25 ? 'fire-critical' : km <= 75 ? 'fire-near' : 'fire-watch');
    }

    function startFireRotation() {
        if (fireRotationTimer) clearInterval(fireRotationTimer);
        if (closestFires.length > 1) {
            fireRotationTimer = setInterval(() => {
                currentFireIndex = (currentFireIndex + 1) % closestFires.length;
                renderCurrentFire();
            }, 8000);
        }
    }

    function focusCurrentFire() {
        if (!map || !closestFires.length) return;
        const n = closestFires[currentFireIndex];
        map.setView([n.lat, n.lon], 10);
        L.popup().setLatLng([n.lat, n.lon]).setContent(`<b>🔥 Foco VIIRS</b><br>Distancia: ${Math.round(n.dist)} km<br>Confianza: ${n.conf}`).openOn(map);
    }

    // --- Carga de GOES-19 (Worker dedicado) ---
    async function loadGoesData() {
        try {
            set('goesCardState', 'CONSULTANDO');
            const u = new URL(GOES_WORKER_URL);
            u.searchParams.set('lat', lat);
            u.searchParams.set('lon', lon);
            u.searchParams.set('radius', '5000');
            const r = await fetch(u, { cache: 'no-store' });
            const j = await r.json();
            if (!r.ok || j.ok === false) throw Error(j.error || 'Respuesta GOES inválida');

            goesDetections = (j.detections || []).map(d => ({
                ...d,
                distanceKm: Number.isFinite(Number(d.distanceKm)) ? Number(d.distanceKm) : distance(lat, lon, Number(d.lat), Number(d.lon))
            })).sort((a, b) => a.distanceKm - b.distanceKm);

            filterAndRenderProximate();
        } catch (e) {
            goesDetections = [];
            set('goesCardState', 'ERROR');
            set('goesDetail', 'GOES-19: ' + e.message);
        }
    }

    function filterAndRenderProximate() {
        closestGoes = goesDetections.filter(d => d.distanceKm <= radiusKm).slice(0, 4);
        currentGoesIndex = 0;
        renderCurrentGoes();
        startGoesRotation();
        renderGoesMarkers();
    }

    function renderCurrentGoes() {
        const card = $('goesCard');
        if (!closestGoes.length) {
            set('goesDistance', '-- km');
            set('goesIndex', '0 / 0');
            set('goesDetail', `${goesDetections.length} anomalías GOES regionales · ninguna dentro del radio de ${radiusKm} km.`);
            $('goesDots').textContent = '○ ○ ○';
            card.className = 'card alert goes-safe';
            return;
        }
        currentFireIndex = (currentGoesIndex + closestGoes.length) % closestGoes.length;
        const n = goesDetections[currentGoesIndex] || closestGoes[currentGoesIndex];
        const km = Math.round(n.distanceKm);
        set('goesDistance', km + ' km');
        set('goesIndex', `${currentGoesIndex + 1} / ${closestGoes.length}`);
        set('goesDetail', `${n.classification || 'Anomalía térmica'} · FRP: ${n.frpMw ? Number(n.frpMw).toFixed(1) + ' MW' : 's/d'}`);
        $('goesDots').textContent = closestGoes.map((_, i) => i === currentGoesIndex ? '●' : '○').join(' ');
        
        card.className = 'card alert ' + (km <= 25 ? 'goes-critical' : km <= 75 ? 'goes-near' : 'goes-watch');
    }

    function startGoesRotation() {
        if (goesRotationTimer) clearInterval(goesRotationTimer);
        if (closestGoes.length > 1) {
            goesRotationTimer = setInterval(() => {
                currentGoesIndex = (currentGoesIndex + 1) % closestGoes.length;
                renderCurrentGoes();
            }, 8000);
        }
    }

    function renderGoesMarkers() {
        if (!map) return;
        if (!goesLayer) goesLayer = L.layerGroup().addTo(map);
        goesLayer.clearLayers();

        if (!goesVisible) return;

        goesDetections.forEach(n => {
            const isHigh = String(n.classification || '').toLowerCase().includes('high');
            const color = isHigh ? '#f97316' : '#facc15';
            L.circleMarker([n.lat, n.lon], {
                radius: isHigh ? 6 : 4,
                color: color,
                fillColor: color,
                fillOpacity: 0.85,
                weight: 1
            }).bindPopup(`<b>🛰️ GOES-19 · ${n.classification}</b><br>Distancia: ${Math.round(n.distanceKm)} km<br>FRP: ${n.frpMw || 's/d'} MW`).addTo(goesLayer);
        });
    }

    function toggleGoesLayer() {
        goesVisible = !goesVisible;
        $('goesBtn').classList.toggle('active', goesVisible);
        set('goesBtn', goesVisible ? '🛰️ GOES Marcadores ON' : '🛰️ GOES OFF');
        renderGoesMarkers();
    }

    function toggleViirsLayer() {
        viirsVisible = !viirsVisible;
        $('viirsBtn').classList.toggle('active', viirsVisible);
        set('viirsBtn', viirsVisible ? '🔥 VIIRS WMS ON' : '🔥 VIIRS WMS OFF');

        if (viirsVisible) {
            if (!fireLayer) {
                fireLayer = L.tileLayer.wms(`https://firms.modaps.eosdis.nasa.gov/mapserver/wms/fires/${FIRMS_MAP_KEY}/`, {
                    layers: 'fires_viirs_24',
                    format: 'image/png',
                    transparent: true,
                    version: '1.1.1',
                    opacity: 0.8
                });
            }
            fireLayer.addTo(map);
        } else if (fireLayer && map.hasLayer(fireLayer)) {
            map.removeLayer(fireLayer);
        }
    }

    function focusCurrentGoes() {
        if (!map || !closestGoes.length) return;
        const n = closestGoes[currentGoesIndex];
        map.setView([n.lat, n.lon], 9);
        L.popup().setLatLng([n.lat, n.lon]).setContent(`<b>🛰️ GOES-19</b><br>${n.classification}<br>Distancia: ${Math.round(n.distanceKm)} km`).openOn(map);
    }

    function loadAllThermalData() {
        loadViirsFires();
        loadGoesData();
    }

    // Arranque inicial
    window.onload = () => {
        initMap();
    };
</script>
</body>
</html>
