<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Modelo Territoria IA</title>
<style>
*{box-sizing:border-box}:root{--bg:#07111f;--panel:#0d1829;--panel2:#111f34;--line:#2b3d56;--text:#eaf2fb;--muted:#91a5bd;--cyan:#59c7e8;--green:#65d68a;--amber:#f2c94c;--violet:#aa8cff;--red:#ff7c86}html{color-scheme:dark}body{margin:0;min-height:100vh;padding:12px;background:var(--bg);color:var(--text);font:14px "Segoe UI",Arial,sans-serif}.app{max-width:1550px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;background:linear-gradient(135deg,#10253e,#123757)}h1,h2,h3,p{margin-top:0}.header h1{margin:0;color:#63cbea;font-size:22px}.sub{color:var(--muted);font-size:11px}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid #276d45;border-radius:999px;background:#0b3825;color:#8ce5ac;font-size:10px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.btn{padding:8px 11px;border:1px solid #3b587b;border-radius:7px;background:#14243b;color:#edf5ff;cursor:pointer;font-weight:650}.btn:hover,.btn.active{border-color:#4faed0;background:#15354d}.btn.green{border-color:#2c8252;background:#123d29}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.station,.ai{min-width:0}.station-head,.ai-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}.station-title,.ai-title{font-size:15px;font-weight:750}.station-code{color:var(--muted);font-size:10px;margin-top:3px}.station-temp{font-size:34px;font-weight:780;color:var(--cyan);letter-spacing:-1px}.distance{color:#b9c8d9;font-size:11px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.tile{min-height:68px;padding:9px;border:1px solid #283c56;border-radius:8px;background:#0a1525}.tile label{display:block;color:#8fa6be;font-size:9px;text-transform:uppercase;letter-spacing:.5px}.tile strong{display:block;margin-top:7px;color:#f5f8fc;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid #26384f;color:var(--muted);font-size:9px}.ai{border-color:#554879;background:linear-gradient(150deg,#10182a,#17172c)}.ai .tile{border-color:#3f365c;background:#121326}.ai-value{color:#c7b4ff!important}.source-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;color:#cbd6e3;font-size:11px}.source-list span:before{content:'●';color:var(--green);margin-right:6px}.off{color:#ffcf6b}.notice{margin-top:10px;padding:8px 9px;border-left:3px solid var(--amber);background:#2a240f;color:#f6dfa0;font-size:10px}.modal{display:none;position:fixed;inset:0;z-index:1000;padding:16px;background:#020711e8;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{width:min(1450px,98vw);height:min(920px,95vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid #4a5f7b;border-radius:13px;background:#081322}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.modal-body{padding:12px;overflow:auto}.filters{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-bottom:9px}.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.select{padding:8px;border:1px solid #344d6b;border-radius:7px;background:#101f33;color:#fff}.range-btn,.model-btn{padding:7px 10px;border:1px solid #344d6b;border-radius:6px;background:#101c2e;color:#d8e4f2;cursor:pointer}.range-btn.active,.range-btn.now-active{border-color:var(--cyan);background:#123348;color:#bdefff}.model-btn.active[data-series="observed"]{border-color:#f59e0b;color:#fbbf24}.model-btn.active[data-series="openmeteo"]{border-color:#ef4444;color:#fca5a5}.model-btn.active[data-series="territoria"]{border-color:#facc15;color:#fde047}.chart-card{margin-bottom:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1728}.chart-title{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.chart-wrap{height:340px;overflow:hidden}.chart-wrap svg{width:100%;height:100%;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:18px;height:3px;margin-right:5px;vertical-align:middle}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:10px;border:1px solid #293d56;border-radius:8px;background:#0c192a}.metric label{display:block;color:var(--muted);font-size:9px}.metric strong{display:block;margin-top:5px;font-size:17px}.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)}@media(max-width:980px){.three{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:600px){body{padding:7px}.tiles{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}.header{align-items:flex-start}.modal{padding:4px}.modal-box{width:100vw;height:100vh;border-radius:0}.chart-wrap{height:300px}}
</style>
</head>
<body>
<main class="app">
<section class="panel header">
 <div><h1>MODELO TERRITORIA IA</h1><div class="sub">Observaciones oficiales, modelo meteorológico y aprendizaje local</div></div>
 <span class="status" id="globalStatus"><span class="dot"></span> INICIANDO</span>
</section>
<section class="panel toolbar">
 <div><strong>Panel meteorológico</strong><div class="sub" id="lastGlobal">Última actualización: --</div></div>
 <div class="group"><button class="btn green" onclick="refreshAll(true)">↻ Actualizar</button><button class="btn" onclick="openHistory()">📊 Históricos</button></div>
</section>
<section class="three">
 <article class="panel station" id="card87418"></article>
 <article class="panel station" id="card87509"></article>
 <article class="panel station" id="aiCard"></article>
</section>
</main>
<div class="modal" id="historyModal">
 <div class="modal-box">
  <div class="modal-head"><div><h2 style="margin:0">Historial del Modelo Territoria IA</h2><div class="sub" id="rangeText">Últimos 7 días</div></div><button class="btn" onclick="closeHistory()">✕ Cerrar</button></div>
  <div class="modal-body">
   <div class="filters">
    <div class="group"><select class="select" id="stationSelect" onchange="drawHistory()"><option value="87418">Mendoza Aero</option><option value="87509">San Rafael Aero</option></select><select class="select" id="variableSelect" onchange="drawHistory()"><option value="temperature">Temperatura</option><option value="humidity">Humedad</option><option value="wind">Viento</option><option value="pressure">Presión</option><option value="feels">Sensación térmica</option><option value="visibility">Visibilidad</option></select></div>
    <div class="group"><button class="range-btn" onclick="shiftRange(-1)">◀</button><button class="range-btn active" data-range="7" onclick="setRange(7,this)">7D</button><button class="range-btn" data-range="14" onclick="setRange(14,this)">14D</button><button class="range-btn" data-range="31" onclick="setRange(31,this)">31D</button><button class="range-btn" data-range="1M" onclick="setRange('1M',this)">1M</button><button class="range-btn" data-range="3M" onclick="setRange('3M',this)">3M</button><button class="range-btn" data-range="6M" onclick="setRange('6M',this)">6M</button><button class="range-btn" data-range="1Y" onclick="setRange('1Y',this)">1A</button><button class="range-btn" data-range="ALL" onclick="setRange('ALL',this)">TODO</button><button class="range-btn" onclick="shiftRange(1)">▶</button><button class="range-btn" id="nowBtn" type="button" onclick="goNow(event)">● AHORA</button></div>
    <div class="group"><button class="model-btn active" data-series="observed" onclick="toggleSeries(this)">● ESTACIÓN METEOROLÓGICA</button><button class="model-btn active" data-series="openmeteo" onclick="toggleSeries(this)">● OPEN-METEO</button><button class="model-btn active" data-series="territoria" onclick="toggleSeries(this)">● MODELO TERRITORIA IA</button></div>
   </div>
   <section class="chart-card"><div class="chart-title"><strong id="chartTitle">Temperatura · comparación actual e histórica</strong><div class="legend"><span><i style="background:#f59e0b"></i>Estación</span><span><i style="background:#ef4444"></i>Open-Meteo</span><span><i style="background:#facc15"></i>Modelo Territoria IA</span></div></div><div class="chart-wrap" id="mainChart"></div></section>
   
   <section class="metrics" id="historyMetrics"></section>
  </div>
 </div>
</div>
<script>
const PROXY='https://meteo-proxy.elexpreso17.workers.dev/';
const STATIONS={
 '87418':{id:'87418',name:'Mendoza Aero',lat:-32.8437,lon:-68.796358},
 '87509':{id:'87509',name:'San Rafael Aero',lat:-34.590836,lon:-68.401642}
};
const STORE='territoria_meteo_history_v1';
let gps={lat:-32.89,lon:-68.84,accuracy:null},history=loadHistory(),lastData={},range={kind:7,end:new Date()},visible={observed:true,openmeteo:true,territoria:true};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadHistory(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return[]}}
function saveHistory(){localStorage.setItem(STORE,JSON.stringify(history.slice(-15000)))}
function numeric(v){const m=String(v??'').replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}
function distance(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function parseStationDate(x){if(!x)return new Date();const day=String(x.dia||'').trim(),hour=Number(x.hora);if(/^\d{4}-\d{2}-\d{2}$/.test(day)&&Number.isFinite(hour))return new Date(day+'T'+String(hour).padStart(2,'0')+':00:00-03:00');return new Date()}
async function fetchStation(st){const r=await fetch(PROXY+'?wmo_id='+st.id,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j?.message||j?.ok===false)throw Error(j.message||j.error);return Array.isArray(j)?j[0]:j}
async function fetchModel(st){const current='temperature_2m,apparent_temperature,relative_humidity_2m,surface_pressure,wind_speed_10m,wind_direction_10m,cloud_cover,visibility,precipitation';const p=new URLSearchParams({latitude:st.lat,longitude:st.lon,current,timezone:'America/Argentina/Mendoza',wind_speed_unit:'kmh'});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+p,{cache:'no-store'});if(!r.ok)throw Error('Open-Meteo HTTP '+r.status);return (await r.json()).current}
function buildRecord(st,obs,model){const t=parseStationDate(obs);const observed={temperature:numeric(obs.temperatura_aire),feels:numeric(obs.sensacion_termica),humidity:numeric(obs.humedad_relativa),wind:numeric(obs.velocidad_viento),pressure:numeric(obs.presion_estacion),visibility:numeric(obs.visibilidad)};const openmeteo={temperature:numeric(model.temperature_2m),feels:numeric(model.apparent_temperature),humidity:numeric(model.relative_humidity_2m),wind:numeric(model.wind_speed_10m),pressure:numeric(model.surface_pressure),visibility:Number.isFinite(Number(model.visibility))?Number(model.visibility)/1000:null};const count=history.filter(x=>x.stationId===st.id).length;const blend=count<12?null:{temperature:blendValue(st.id,'temperature',openmeteo.temperature),humidity:blendValue(st.id,'humidity',openmeteo.humidity),wind:blendValue(st.id,'wind',openmeteo.wind),pressure:blendValue(st.id,'pressure',openmeteo.pressure)};return{id:st.id+'_'+t.toISOString().slice(0,13),stationId:st.id,stationName:st.name,observedAt:t.toISOString(),queriedAt:new Date().toISOString(),gpsDistanceKm:distance(gps.lat,gps.lon,st.lat,st.lon),observed,openmeteo,territoria:blend,raw:{weather:obs.tiempo_presente,cloud:obs.nubosidad_total,visibility:obs.visibilidad,windDirection:obs.direccion_viento,feels:obs.sensacion_termica}}}
function blendValue(id,key,base){if(!Number.isFinite(base))return null;const rows=history.filter(x=>x.stationId===id&&Number.isFinite(x.observed?.[key])&&Number.isFinite(x.openmeteo?.[key])).slice(-240);if(rows.length<12)return null;const bias=rows.reduce((s,x)=>s+(x.observed[key]-x.openmeteo[key]),0)/rows.length;return base+bias}
function upsertRecord(rec){const i=history.findIndex(x=>x.id===rec.id);if(i>=0)history[i]={...history[i],...rec};else history.push(rec);history.sort((a,b)=>new Date(a.observedAt)-new Date(b.observedAt));saveHistory()}
function stationCard(st,rec,error){if(error)return `<div class="station-head"><div><div class="station-title">🌤 ${esc(st.name)}</div><div class="station-code">WMO ${st.id}</div></div><span class="status" style="border-color:#7f343b;background:#3a171c;color:#ff9ca5"><span class="dot"></span> ERROR</span></div><p style="color:#ff9ca5">${esc(error)}</p>`;const o=rec.observed,r=rec.raw,age=Math.max(0,Math.round((Date.now()-new Date(rec.observedAt))/60000));return `<div class="station-head"><div><div class="station-title">🌤 ${esc(st.name)}</div><div class="station-code">WMO ${st.id} · ${rec.gpsDistanceKm.toFixed(1)} km del GPS</div></div><span class="status"><span class="dot"></span> ${age<=90?'ACTUAL':'DEMORADA'}</span></div><div class="station-temp">${o.temperature??'--'} °C</div><div class="distance">${esc(r.weather||'Sin estado informado')}</div><div class="tiles"><div class="tile"><label>Humedad</label><strong>${o.humidity??'--'} %</strong></div><div class="tile"><label>Sensación</label><strong>${esc(r.feels||'--')}</strong></div><div class="tile"><label>Viento</label><strong>${o.wind??'--'} km/h</strong></div><div class="tile"><label>Dirección</label><strong>${esc(r.windDirection||'--')}</strong></div><div class="tile"><label>Presión</label><strong>${o.pressure??'--'} hPa</strong></div><div class="tile"><label>Visibilidad</label><strong>${esc(r.visibility||'--')}</strong></div></div><div class="foot"><span>Observación: ${new Date(rec.observedAt).toLocaleString('es-AR')}</span><span>Consulta: ${new Date(rec.queriedAt).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</span></div>`}
function renderAI(){
 const all=history.filter(x=>x.territoria),latest=all.length?all[all.length-1]:null,n=history.length,valid=all.filter(x=>Number.isFinite(x.territoria?.temperature)).length;
 const t=latest?.territoria||{},raw=latest?.raw||{},status=n<24?'APRENDIENDO':valid<40?'CALIBRANDO':'VALIDANDO';
 $('aiCard').innerHTML=`<div class="station-head"><div><div class="station-title">🧠 Modelo Territoria IA</div><div class="station-code">Aprendizaje meteorológico local</div></div><span class="status" style="border-color:#645290;background:#211c39;color:#d2c5ff"><span class="dot"></span> ${status}</span></div><div class="station-temp" style="color:#aa8cff">${Number.isFinite(t.temperature)?t.temperature.toFixed(1)+' °C':'-- °C'}</div><div class="distance">${valid?'Estimación experimental':'Aprendiendo de las estaciones y Open-Meteo'}</div><div class="tiles"><div class="tile"><label>Humedad</label><strong>${Number.isFinite(t.humidity)?t.humidity.toFixed(0)+' %':'-- %'}</strong></div><div class="tile"><label>Estado</label><strong style="color:#c7b4ff">${status}</strong></div><div class="tile"><label>Viento</label><strong>${Number.isFinite(t.wind)?t.wind.toFixed(1)+' km/h':'-- km/h'}</strong></div><div class="tile"><label>Muestras</label><strong>${n}</strong></div><div class="tile"><label>Presión</label><strong>${Number.isFinite(t.pressure)?t.pressure.toFixed(1)+' hPa':'-- hPa'}</strong></div><div class="tile"><label>Corrección</label><strong class="off">OFF</strong></div></div><div class="foot"><span>Estimaciones IA: ${valid}</span><span>Último aprendizaje: ${latest?new Date(latest.queriedAt).toLocaleString('es-AR'):'--'}</span></div>`
}
async function refreshAll(force=false){$('globalStatus').innerHTML='<span class="dot"></span> ACTUALIZANDO';const entries=[];for(const st of Object.values(STATIONS)){try{const obs=await fetchStation(st);const model=await fetchModel(st);const rec=buildRecord(st,obs,model);upsertRecord(rec);lastData[st.id]=rec;entries.push({st,rec});}catch(e){entries.push({st,error:e.message})}await new Promise(r=>setTimeout(r,1100))}for(const x of entries)$('card'+x.st.id).innerHTML=stationCard(x.st,x.rec,x.error);renderAI();$('lastGlobal').textContent='Última actualización: '+new Date().toLocaleString('es-AR');$('globalStatus').innerHTML='<span class="dot"></span> EN LÍNEA'}
function openHistory(){$('historyModal').classList.add('show');drawHistory()}function closeHistory(){$('historyModal').classList.remove('show')}
function setRange(v,btn){range.kind=v;range.end=new Date();document.querySelectorAll('.range-btn[data-range]').forEach(x=>x.classList.toggle('active',x===btn));drawHistory()}
function rangeMs(){if(range.kind==='ALL')return Infinity;if(range.kind==='1M')return 31*864e5;if(range.kind==='3M')return 92*864e5;if(range.kind==='6M')return 183*864e5;if(range.kind==='1Y')return 365*864e5;return Number(range.kind)*864e5}
function shiftRange(dir){const ms=rangeMs();if(!Number.isFinite(ms))return;range.end=new Date(range.end.getTime()+dir*ms);drawHistory()}
function goNow(ev){if(ev){ev.preventDefault();ev.stopPropagation()}range.end=new Date(Date.now()+60000);document.querySelectorAll('.range-btn').forEach(x=>x.classList.remove('now-active'));const b=document.getElementById('nowBtn');if(b)b.classList.add('now-active');drawHistory();if(b)setTimeout(()=>b.classList.remove('now-active'),900)}
function toggleSeries(btn){const k=btn.dataset.series;visible[k]=!visible[k];btn.classList.toggle('active',visible[k]);drawHistory()}
function currentRows(){const id=$('stationSelect').value,end=range.end.getTime(),ms=rangeMs(),start=Number.isFinite(ms)?end-ms:-Infinity;return history.filter(x=>x.stationId===id&&new Date(x.observedAt).getTime()>=start&&new Date(x.observedAt).getTime()<=end)}
const VARS={temperature:{label:'Temperatura',unit:'°C'},humidity:{label:'Humedad',unit:'%'},wind:{label:'Velocidad del viento',unit:'km/h'},pressure:{label:'Presión',unit:'hPa'},visibility:{label:'Visibilidad',unit:'km'},feels:{label:'Sensación térmica',unit:'°C'}};
function chartSvg(rows,key,error=false){if(!rows.length)return '<div class="empty">Todavía no hay registros para este periodo.</div>';const series=error?{openmeteo:rows.map(x=>diff(x.openmeteo,x.observed,key)),territoria:rows.map(x=>diff(x.territoria,x.observed,key))}:{observed:rows.map(x=>val(x.observed,key)),openmeteo:rows.map(x=>val(x.openmeteo,key)),territoria:rows.map(x=>val(x.territoria,key))};const enabled=Object.entries(series).filter(([k])=>visible[k]),vals=enabled.flatMap(([,a])=>a.filter(Number.isFinite));if(!vals.length)return '<div class="empty">Sin valores numéricos para esta selección.</div>';let mn=Math.min(...vals),mx=Math.max(...vals);if(error){mn=Math.min(mn,0);mx=Math.max(mx,0)}if(mx===mn){mx+=1;mn-=1}const W=1200,H=300,pL=55,pR=18,pT=20,pB=42,X=i=>rows.length===1?(pL+W-pR)/2:pL+i*(W-pL-pR)/(rows.length-1),Y=v=>pT+(mx-v)/(mx-mn)*(H-pT-pB),colors={observed:'#f59e0b',openmeteo:'#ef4444',territoria:'#facc15'};let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;for(let i=0;i<=4;i++){const y=pT+i*(H-pT-pB)/4,v=mx-i*(mx-mn)/4;s+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#24364d" stroke-width="1"/><text x="${pL-8}" y="${y+4}" fill="#91a5bd" font-size="11" text-anchor="end">${v.toFixed(1)}</text>`}if(error)s+=`<line x1="${pL}" y1="${Y(0)}" x2="${W-pR}" y2="${Y(0)}" stroke="#667991" stroke-dasharray="5 5"/>`;for(const [k,a] of enabled){let seg=[];for(let i=0;i<a.length;i++){if(Number.isFinite(a[i]))seg.push(`${X(i)},${Y(a[i])}`);else if(seg.length){s+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${colors[k]}" stroke-width="3"/>`;seg=[]}}if(seg.length)s+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${colors[k]}" stroke-width="3"/>`;a.forEach((v,i)=>{if(Number.isFinite(v))s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${rows.length===1?7:3.5}" fill="${colors[k]}" stroke="#081322" stroke-width="2"><title>${k==='observed'?'Estación':k==='openmeteo'?'Open-Meteo':'Modelo Territoria IA'}: ${v.toFixed(2)}</title></circle>`})}const every=Math.max(1,Math.ceil(rows.length/8));rows.forEach((r,i)=>{if(i%every===0||i===rows.length-1)s+=`<text x="${X(i)}" y="${H-12}" fill="#91a5bd" font-size="10" text-anchor="middle">${new Date(r.observedAt).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})}</text>`});return s+'</svg>'}
function val(obj,key){const n=obj?.[key];return Number.isFinite(n)?n:null}
function diff(a,b,key){const x=val(a,key),y=val(b,key);return Number.isFinite(x)&&Number.isFinite(y)?x-y:null}
function mae(rows,key,series){const a=rows.map(x=>{const o=val(x.observed,key),p=val(x[series],key);return Number.isFinite(o)&&Number.isFinite(p)?Math.abs(p-o):null}).filter(Number.isFinite);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null}
function drawHistory(){const rows=currentRows(),key=$('variableSelect').value,v=VARS[key];$('chartTitle').textContent=v.label+' · comparación actual e histórica';$('mainChart').innerHTML=chartSvg(rows,key,false);const ms=rangeMs(),start=Number.isFinite(ms)?new Date(range.end-ms):rows[0]?new Date(rows[0].observedAt):null;$('rangeText').textContent=start?start.toLocaleString('es-AR')+' → '+range.end.toLocaleString('es-AR'):'Sin registros';const m1=mae(rows,key,'openmeteo'),m2=mae(rows,key,'territoria'),improve=Number.isFinite(m1)&&Number.isFinite(m2)&&m1>0?(1-m2/m1)*100:null;$('historyMetrics').innerHTML=`<div class="metric"><label>Registros visibles</label><strong>${rows.length}</strong></div><div class="metric"><label>MAE Open-Meteo</label><strong>${Number.isFinite(m1)?m1.toFixed(2)+' '+v.unit:'--'}</strong></div><div class="metric"><label>MAE Modelo Territoria IA</label><strong>${Number.isFinite(m2)?m2.toFixed(2)+' '+v.unit:'--'}</strong></div><div class="metric"><label>Mejora experimental</label><strong>${Number.isFinite(improve)?improve.toFixed(1)+' %':'--'}</strong></div>`}
renderAI();for(const st of Object.values(STATIONS))$('card'+st.id).innerHTML=stationCard(st,null,'Esperando primera consulta');
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};refreshAll()},()=>refreshAll(),{enableHighAccuracy:true,timeout:9000,maximumAge:60000});else refreshAll();
setInterval(()=>refreshAll(false),10*60*1000);
</script>
