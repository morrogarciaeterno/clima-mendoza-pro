<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <meta name="theme-color" content="#07111f"/>
    <title>Territoria - Monitoreo Satelital Directo (VIIRS + GOES)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; }
        :root { --bg: #07111f; --p: #101d31; --b: #293b55; --t: #e7edf6; --m: #9baac0; --a: #38bdf8; --r: #ef4444; --g: #f97316; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--t); font-family: system-ui, -apple-system, sans-serif; }
        .app { display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 10px; max-width: 1600px; margin: auto; }
        header { background: linear-gradient(135deg, #102b49, #153f68); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--b); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 20px; color: #38bdf8; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        button, select, input { padding: 8px 12px; background: #172554; border: 1px solid #3b82f6; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px; }
        button:hover { background: #1d4ed8; }
        .main-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 10px; flex: 1; min-height: 0; }
        .sidebar { background: var(--p); border: 1px solid var(--b); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
        .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
        .foco-item { padding: 10px; background: #0c1728; border: 1px solid var(--b); border-left: 4px solid var(--r); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .foco-item.goes { border-left-color: var(--g); }
        .foco-item:hover { background: #14243a; }
        #map { width: 100%; height: 100%; min-height: 400px; border-radius: 12px; border: 1px solid var(--b); background: #0f172a; }
        .muted { color: var(--m); font-size: 11px; }
        .badge { background: #064e3b; color: #86efac; border: 1px solid #15803d; padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
        @media(max-width: 900px) { .main-layout { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div>
                <h1>TERRITORIA · VIIRS + GOES (Argentina)</h1>
                <div class="muted">Monitoreo térmico multissatelital directo (Sin proxys)</div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="gpsBadge" class="badge">GPS: Iniciando...</span>
                <button onclick="forzarGpsReal()">📍 Reintentar GPS</button>
            </div>
        </header>

        <div class="controls">
            <button onclick="ejecutarConsulta()">🔄 Actualizar Ambos Satélites</button>
            <label>Radio: 
                <select id="radioSelect" onchange="ejecutarConsulta()">
                    <option value="500">500 km</option>
                    <option value="1000">1000 km</option>
                    <option value="2000" selected>2000 km (Nacional)</option>
                    <option value="5000">Cono Sur</option>
                </select>
            </label>
            <button onclick="centrarMapaGps()">🎯 Centrar Posición</button>
        </div>

        <div class="main-layout">
            <aside class="sidebar">
                <div style="font-weight: 700; font-size: 14px;">Anomalías Térmicas (VIIRS & GOES)</div>
                <div class="muted" id="contadorFocos">Sin datos cargados</div>
                <div class="list" id="listaFocos">
                    <div class="muted" style="padding: 10px;">Consultando servidores de la NASA y NOAA...</div>
                </div>
            </aside>
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const FIRMS_MAP_KEY = "77a9490b2a337c7055de7a2e5948c836";
        
        let lat = -32.89, lon = -68.84;
        let map, markersLayer, gpsMarker, radiusCircle;
        let focosData = [];

        function initApp() {
            map = L.map('map').setView([lat, lon], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);

            forzarGpsReal();
        }

        function forzarGpsReal() {
            const badge = document.getElementById('gpsBadge');
            badge.textContent = "GPS: Buscando...";
            badge.style.background = "#78350f";
            badge.style.borderColor = "#d97706";
            badge.style.color = "#fde047";

            if (!navigator.geolocation) {
                activarFallbackGps("No soportado");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                pos => {
                    lat = pos.coords.latitude;
                    lon = pos.coords.longitude;
                    badge.textContent = `GPS OK: ${lat.toFixed(2)}, ${lon.toFixed(2)}`;
                    badge.style.background = "#064e3b";
                    badge.style.borderColor = "#15803d";
                    badge.style.color = "#86efac";
                    
                    actualizarCapaGps();
                    ejecutarConsulta();
                },
                err => {
                    activarFallbackGps("Usando Mendoza");
                },
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
            );
        }

        function activarFallbackGps(motivo) {
            const badge = document.getElementById('gpsBadge');
            badge.textContent = `GPS: ${motivo}`;
            badge.style.background = "#7f1d1d";
            badge.style.borderColor = "#dc2626";
            badge.style.color = "#fecaca";
            
            actualizarCapaGps();
            ejecutarConsulta();
        }

        function actualizarCapaGps() {
            if (gpsMarker) map.removeLayer(gpsMarker);
            if (radiusCircle) map.removeLayer(radiusCircle);

            gpsMarker = L.marker([lat, lon]).addTo(map).bindPopup(`<b>Mi Posición Activa</b><br>Lat: ${lat}, Lon: ${lon}`);
            const radioKm = parseInt(document.getElementById('radioSelect').value);
            radiusCircle = L.circle([lat, lon], { radius: radioKm * 1000, color: '#38bdf8', fillOpacity: 0.04 }).addTo(map);
            map.setView([lat, lon], 5);
        }

        function centrarMapaGps() {
            if (map) {
                map.setView([lat, lon], 6);
                if (radiusCircle) map.fitBounds(radiusCircle.getBounds());
            }
        }

        function calcularDistancia(x1, y1, x2, y2) {
            const R = 6371;
            const dLat = (x2 - x1) * Math.PI / 180;
            const dLon = (y2 - y1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(x1 * Math.PI / 180) * Math.cos(x2 * Math.PI / 180) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function ejecutarConsulta() {
            const radioKm = parseInt(document.getElementById('radioSelect').value);
            actualizarCapaGps();
            
            document.getElementById('contadorFocos').textContent = 'Consultando VIIRS y GOES...';
            document.getElementById('listaFocos').innerHTML = '<div class="muted" style="padding:10px;">Descargando fuentes satelitales en paralelo...</div>';
            markersLayer.clearLayers();

            const delta = radioKm / 111.0;
            const box = [
                (lon - delta).toFixed(4),
                (lat - delta).toFixed(4),
                (lon + delta).toFixed(4),
                (lat + delta).toFixed(4)
            ].join(',');

            // Consultar VIIRS y GOES (via NASA FIRMS endpoints en paralelo)
            const urlViirs = `https://firms.modaps.eosdis.nasa.gov/api/area/csv/${FIRMS_MAP_KEY}/VIIRS_SNPP_NRT/${box}/1`;
            const urlGoes = `https://firms.modaps.eosdis.nasa.gov/api/area/csv/${FIRMS_MAP_KEY}/GOES_NRT/${box}/1`;

            try {
                const [resViirs, resGoes] = await Promise.allSettled([
                    fetch(urlViirs).then(r => r.ok ? r.text() : ''),
                    fetch(urlGoes).then(r => r.ok ? r.text() : '')
                ]);

                let parsedFocos = [];

                // Parsear VIIRS
                if (resViirs.status === 'fulfilled' && resViirs.value) {
                    const lines = resViirs.value.trim().split(/\r?\n/);
                    if (lines.length > 1) {
                        const h = lines[0].split(',');
                        const iLat = h.indexOf('latitude'), iLon = h.indexOf('longitude'), iBright = h.indexOf('brightness'), iConf = h.indexOf('confidence'), iDate = h.indexOf('acq_date'), iTime = h.indexOf('acq_time');
                        
                        lines.slice(1).forEach(row => {
                            const c = row.split(',');
                            const fLat = parseFloat(c[iLat]), fLon = parseFloat(c[iLon]);
                            const dist = calcularDistancia(lat, lon, fLat, fLon);
                            if (!isNaN(fLat) && !isNaN(fLon) && dist <= radioKm) {
                                parsedFocos.push({
                                    satelite: 'VIIRS (Alta Res)',
                                    lat: fLat, lon: fLon, distancia: dist,
                                    brilloC: c[iBright] ? (parseFloat(c[iBright]) - 273.15).toFixed(1) : 'N/D',
                                    confianza: c[iConf] || 'n/d',
                                    fecha: c[iDate] || '', hora: c[iTime] || ''
                                });
                            }
                        });
                    }
                }

                // Parsear GOES
                if (resGoes.status === 'fulfilled' && resGoes.value) {
                    const lines = resGoes.value.trim().split(/\r?\n/);
                    if (lines.length > 1) {
                        const h = lines[0].split(',');
                        const iLat = h.indexOf('latitude'), iLon = h.indexOf('longitude'), iBright = h.indexOf('brightness'), iConf = h.indexOf('confidence'), iDate = h.indexOf('acq_date'), iTime = h.indexOf('acq_time');
                        
                        lines.slice(1).forEach(row => {
                            const c = row.split(',');
                            const fLat = parseFloat(c[iLat]), fLon = parseFloat(c[iLon]);
                            const dist = calcularDistancia(lat, lon, fLat, fLon);
                            if (!isNaN(fLat) && !isNaN(fLon) && dist <= radioKm) {
                                parsedFocos.push({
                                    satelite: 'GOES (Geoestacionario)',
                                    lat: fLat, lon: fLon, distancia: dist,
                                    brilloC: c[iBright] ? (parseFloat(c[iBright]) - 273.15).toFixed(1) : 'N/D',
                                    confianza: c[iConf] || 'n/d',
                                    fecha: c[iDate] || '', hora: c[iTime] || ''
                                });
                            }
                        });
                    }
                }

                focosData = parsedFocos.sort((a, b) => a.distancia - b.distancia);
                document.getElementById('contadorFocos').textContent = `${focosData.length} registros totales`;

                if (focosData.length === 0) {
                    document.getElementById('listaFocos').innerHTML = '<div class="muted" style="padding:10px;">Sin anomalías en VIIRS ni GOES para este radio.</div>';
                    return;
                }

                let listHtml = '';
                focosData.forEach((foco, index) => {
                    const isGoes = foco.satelite.includes('GOES');
                    listHtml += `
                        <div class="foco-item ${isGoes ? 'goes' : ''}" onclick="enfocarFoco(${index})">
                            <div style="font-weight:700;">📡 ${foco.satelite} · ${Math.round(foco.distancia)} km</div>
                            <div class="muted">📍 Lat: ${foco.lat.toFixed(4)}, Lon: ${foco.lon.toFixed(4)}</div>
                            <div style="color: ${isGoes ? '#fdba74' : '#fca5a5'}; font-weight: bold; font-size: 12px; margin-top: 2px;">🌡️ Brillo: ${foco.brilloC} °C</div>
                            <div class="muted">📅 ${foco.fecha} ${foco.hora} UTC · Conf: ${foco.confianza}</div>
                        </div>
                    `;

                    L.circleMarker([foco.lat, foco.lon], {
                        radius: 6,
                        color: '#fff',
                        weight: 1,
                        fillColor: isGoes ? '#f97316' : '#ef4444',
                        fillOpacity: 0.85
                    }).bindPopup(`<b>${foco.satelite}</b><br><b>Ubicación:</b> ${foco.lat.toFixed(4)}, ${foco.lon.toFixed(4)}<br><b>Distancia:</b> ${Math.round(foco.distancia)} km<br><b>Brillo:</b> ${foco.brilloC} °C<br><b>Fecha:</b> ${foco.fecha} ${foco.hora} UTC`)
                      .addTo(markersLayer);
                });

                document.getElementById('listaFocos').innerHTML = listHtml;

            } catch (error) {
                console.error(error);
                document.getElementById('contadorFocos').textContent = 'Error de red';
                document.getElementById('listaFocos').innerHTML = `<div class="muted" style="padding:10px; color:#ef4444;">Error al consultar los satélites. (${error.message})</div>`;
            }
        }

        function enfocarFoco(index) {
            const f = focosData[index];
            if (f && map) {
                map.setView([f.lat, f.lon], 10);
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
