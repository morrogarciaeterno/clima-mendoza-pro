<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Territoria · Estaciones Mendoza</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#07111f;color:#e7edf6;font:14px Segoe UI,Arial}.app{max-width:1050px;margin:auto}.card,.st{background:#101d31;border:1px solid #293b55;border-radius:14px;padding:15px;margin-bottom:10px}.head{background:linear-gradient(135deg,#102b49,#153f68)}.muted{color:#9baac0;font-size:11px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls button{padding:10px;border:1px solid #3b82f6;border-radius:8px;background:#172554;color:white}.controls input{flex:1;min-width:260px}.green{background:#14532d!important;border-color:#22c55e!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.st{border-color:#22d3ee;border-left:6px solid #22d3ee;background:#0c1728}.big{font-size:28px;font-weight:900;color:#67e8f9;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #293b55}.err{color:#fca5a5}.ok{color:#86efac}#map{height:390px;border-radius:12px;background:#0f172a}@media(max-width:600px){#map{height:320px}}</style></head><body><main class="app"><section class="card head"><h2>🌤️ TERRITORIA · Estaciones oficiales de Mendoza</h2><div class="muted">Prueba con las estaciones confirmadas: Mendoza Aero y San Rafael Aero.</div></section><section class="card"><div class="controls"><input id="key" type="password" placeholder="RapidAPI key"><button class="green" onclick="start()">📍 Consultar con mi GPS</button></div><div id="status" class="muted" style="margin-top:8px">Esperando key…</div></section><section class="card"><div id="map"></div></section><section id="grid" class="grid"></section></main><script>
const ST=[{id:'87418',name:'Mendoza Aero',lat:-32.8437,lon:-68.796358},{id:'87509',name:'San Rafael Aero',lat:-34.590836,lon:-68.401642}];let lat=-32.89,lon=-68.84,map,marks=[];const $=x=>document.getElementById(x);$('key').value=localStorage.getItem('argweather_key')||'';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function km(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function leaflet(){return new Promise((ok,no)=>{if(window.L)return ok();let c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);let s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}async function initMap(){await leaflet();if(!map){map=L.map('map').setView([lat,lon],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map)}marks.forEach(m=>map.removeLayer(m));marks=[];marks.push(L.circleMarker([lat,lon],{radius:9,color:'#fff',fillColor:'#2563eb',fillOpacity:1,weight:3}).addTo(map).bindPopup('📍 Mi GPS'))}async function request(st,key){const u='https://argentina-real-time-weather.p.rapidapi.com/ArgWeatherAnalytics?wmo_id='+st.id,r=await fetch(u,{headers:{'X-RapidAPI-Key':key,'X-RapidAPI-Host':'argentina-real-time-weather.p.rapidapi.com'},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();return Array.isArray(j)?j[0]:j}async function start(){const key=$('key').value.trim();if(!key)return $('status').innerHTML='<span class="err">Falta la RapidAPI key.</span>';localStorage.setItem('argweather_key',key);$('status').textContent='Solicitando GPS…';navigator.geolocation.getCurrentPosition(async p=>{lat=p.coords.latitude;lon=p.coords.longitude;await run(key)},async()=>run(key),{enableHighAccuracy:true,timeout:10000})}async function run(key){await initMap();$('status').textContent='Consultando observaciones horarias…';const ordered=ST.map(s=>({...s,km:km(lat,lon,s.lat,s.lon)})).sort((a,b)=>a.km-b.km),out=[];for(const st of ordered){try{out.push({st,x:await request(st,key)})}catch(e){out.push({st,error:e.message})}await new Promise(r=>setTimeout(r,1100))}render(out);$('status').innerHTML='<span class="ok">Consulta finalizada.</span>'}function render(out){$('grid').innerHTML=out.map(({st,x,error})=>error?`<article class="st"><b>${esc(st.name)}</b><div class="muted">WMO ${st.id} · ${st.km.toFixed(1)} km</div><p class="err">${esc(error)}</p></article>`:`<article class="st"><b>${esc(st.name)}</b><div class="muted">WMO ${st.id} · ${st.km.toFixed(1)} km del GPS</div><div class="big">${esc(x.temperatura_aire||'--')}</div><div class="row"><span>Sensación</span><b>${esc(x.sensacion_termica||'--')}</b></div><div class="row"><span>Humedad</span><b>${esc(x.humedad_relativa||'--')}</b></div><div class="row"><span>Presión estación</span><b>${esc(x.presion_estacion||'--')}</b></div><div class="row"><span>Viento</span><b>${esc(x.direccion_viento||'--')} · ${esc(x.velocidad_viento||'--')}</b></div><div class="row"><span>Nubosidad</span><b>${esc(x.nubosidad_total||'--')}</b></div><div class="row"><span>Visibilidad</span><b>${esc(x.visibilidad||'--')}</b></div><div class="row"><span>Tiempo</span><b>${esc(x.tiempo_presente||'--')}</b></div><div class="muted" style="margin-top:7px">Registro: ${esc(x.dia||'--')} · ${esc(x.hora??'--')}:00 h</div></article>`).join('');ordered=out.map(o=>o.st);ordered.forEach(st=>marks.push(L.circleMarker([st.lat,st.lon],{radius:8,color:'#22d3ee',fillColor:'#22d3ee',fillOpacity:.9}).addTo(map).bindPopup(`<b>${esc(st.name)}</b><br>${st.km.toFixed(1)} km del GPS`)));map.fitBounds(L.featureGroup(marks).getBounds().pad(.15))}initMap();
</script></body></html>
